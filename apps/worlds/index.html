<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Atlas — idol.id</title>
<link rel="stylesheet" href="/shared/theme.css">
<script src="/config.js"></script>
<style>
  :root {
    --atlas-subject: #d7ad61;
    --atlas-world: #6fc7d2;
    --atlas-foreign: #a799d8;
    --atlas-published: #86aa86;
    --atlas-panel: rgba(12, 13, 14, 0.92);
  }
  body { overflow: hidden; background: #050607; }
  .atlas { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(290px, 360px) minmax(0, 1fr); position: relative; }
  .atlas::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 72% 18%, rgba(111,199,210,.06), transparent 28%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: auto, 44px 44px, 44px 44px;
  }
  .rail, .detail { position: relative; z-index: 1; min-height: 0; }
  .rail { border-right: 1px solid var(--rule); background: rgba(5,6,7,.88); display: flex; flex-direction: column; }
  .atlas-head { padding: 22px 20px 16px; border-bottom: 1px solid var(--rule); }
  .eyebrow { color: var(--atlas-world); font: 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
  .atlas-head h1 { margin-top: 9px; font: 500 clamp(24px, 3vw, 36px)/1.05 var(--sans); letter-spacing: -.035em; }
  .atlas-head p { margin-top: 10px; max-width: 36ch; color: var(--ink-3); font-size: 12px; line-height: 1.65; }
  .search { padding: 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 9px; }
  .search input { width: 100%; border-radius: 999px; padding-inline: 14px; }
  .filters { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter { flex: none; border-radius: 999px; padding: 5px 10px; background: transparent; }
  .filter.here { border-color: var(--ink-3); color: var(--ink); background: var(--bg-active); }
  .capture { padding: 8px 14px; display: flex; justify-content: space-between; gap: 12px; color: var(--ink-4); font-size: 10px; border-bottom: 1px solid var(--rule); }
  .world-list { flex: 1; min-height: 0; overflow: auto; padding: 7px; }
  .world-card { width: 100%; text-align: left; display: grid; grid-template-columns: 9px minmax(0,1fr) auto; gap: 11px; align-items: start; padding: 13px 12px; border: 1px solid transparent; background: transparent; border-radius: 9px; }
  .world-card:hover { border-color: var(--rule-2); background: rgba(255,255,255,.025); }
  .world-card.here { border-color: var(--rule-3); background: rgba(255,255,255,.055); }
  .orb { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,.025); }
  .orb.provided { background: var(--atlas-world); }
  .orb.published { background: var(--atlas-published); }
  .orb.foreign { background: var(--atlas-foreign); }
  .world-name { color: var(--ink); font-size: 13px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; }
  .world-summary { margin-top: 4px; color: var(--ink-3); font-size: 11px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .world-meta { margin-top: 7px; display: flex; gap: 8px; color: var(--ink-4); font: 9.5px/1.3 var(--mono); flex-wrap: wrap; }
  .compare-box { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--rule-2); border-radius: 50%; color: var(--ink-4); }
  .compare-box.on { color: var(--atlas-subject); border-color: rgba(215,173,97,.5); background: rgba(215,173,97,.08); }

  .detail { overflow: auto; background: linear-gradient(180deg, rgba(11,12,13,.72), rgba(5,6,7,.9)); }
  .detail-inner { max-width: 1080px; margin: 0 auto; padding: clamp(24px, 5vw, 68px); }
  .mobile-back { display: none; }
  .world-kicker { display: flex; gap: 8px; align-items: center; color: var(--ink-3); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .14em; }
  .category { border: 1px solid currentColor; border-radius: 999px; padding: 4px 8px; }
  .category.provided { color: var(--atlas-world); }
  .category.published { color: var(--atlas-published); }
  .category.foreign { color: var(--atlas-foreign); }
  .world-title { margin-top: 18px; font: 520 clamp(42px, 8vw, 104px)/.9 var(--sans); letter-spacing: -.065em; overflow-wrap: anywhere; }
  .world-lede { margin-top: 22px; max-width: 65ch; color: var(--ink-2); font-size: clamp(14px, 1.5vw, 18px); line-height: 1.65; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
  .actions a { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--rule-2); border-radius: 999px; padding: 9px 14px; min-height: 40px; color: var(--ink-2); background: rgba(255,255,255,.02); }
  .actions a:hover { color: var(--ink); border-color: var(--rule-3); }
  .actions .primary { color: #050607; background: var(--ink); border-color: var(--ink); }
  .facts { margin-top: clamp(34px, 6vw, 76px); display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .fact { min-height: 112px; padding: 15px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .fact .label { color: var(--ink-4); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .fact .value { margin-top: 11px; color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }
  .tags { margin-top: 30px; display: flex; gap: 7px; flex-wrap: wrap; }
  .tag { padding: 6px 9px; border-radius: 999px; border: 1px solid var(--rule-2); color: var(--ink-3); font-size: 11px; }
  .boundary { margin-top: 42px; padding: 18px; border: 1px solid var(--rule-2); border-radius: 12px; background: rgba(255,255,255,.018); }
  .boundary h2, .compare-panel h2 { font: 500 16px/1.2 var(--sans); }
  .boundary p { margin-top: 8px; color: var(--ink-3); line-height: 1.65; max-width: 72ch; }
  .empty-detail { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--ink-4); }
  .empty-detail strong { display: block; color: var(--ink-2); font: 500 22px/1.2 var(--sans); margin-bottom: 8px; }
  .compare-panel { margin-top: 32px; border: 1px solid var(--rule-2); border-radius: 12px; overflow: hidden; }
  .compare-head { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--rule); }
  .compare-head .spacer { flex: 1; }
  .compare-note { color: var(--ink-4); font-size: 11px; }
  .compare-row { display: grid; grid-template-columns: 130px minmax(0,1fr) minmax(0,1fr); border-bottom: 1px solid var(--rule); }
  .compare-row:last-child { border-bottom: 0; }
  .compare-row > div { padding: 10px 12px; overflow-wrap: anywhere; }
  .compare-row .field { color: var(--ink-4); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  .compare-row .value { border-left: 1px solid var(--rule); color: var(--ink-2); font: 11px/1.45 var(--mono); }
  .compare-row.changed .value { color: var(--atlas-subject); }
  .mobile-nav { display: none; }

  @media (max-width: 900px) {
    .facts { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  @media (max-width: 699px) {
    body { overflow: hidden; }
    .atlas { grid-template-columns: 1fr; }
    .rail { border-right: 0; }
    .atlas-head { padding: 18px 16px 13px; }
    .atlas-head h1 { font-size: 28px; }
    .world-list { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    .world-card { min-height: 72px; padding-block: 12px; }
    .detail { position: fixed; z-index: 20; inset: 48px 0 0; transform: translateX(100%); transition: transform 180ms ease; }
    .detail.open { transform: none; }
    .detail-inner { padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
    .mobile-back { display: inline-flex; margin-bottom: 28px; }
    .world-title { font-size: 54px; }
    .world-lede { font-size: 15px; }
    .actions a, .actions button { flex: 1 1 44%; min-height: 44px; }
    .facts { grid-template-columns: 1fr 1fr; }
    .fact { min-height: 96px; }
    .compare-row { grid-template-columns: 84px minmax(0,1fr) minmax(0,1fr); }
    .mobile-nav { display: flex; position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 54px; border: 1px solid var(--rule-2); border-radius: 16px; background: rgba(10,11,12,.94); box-shadow: 0 20px 50px rgba(0,0,0,.6); padding: 5px; }
    .mobile-nav button { flex: 1; border: 0; background: transparent; min-height: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <main class="atlas">
    <section class="rail" aria-label="World list">
      <header class="atlas-head">
        <div class="eyebrow">@ · authority atlas</div>
        <h1>World Atlas</h1>
        <p>Published world identities and provenance. Origin labels organize the view; they do not create new semantic kinds.</p>
      </header>
      <div class="search">
        <input id="query" type="search" placeholder="Search identity, relation tags, origin…" autocomplete="off" aria-label="Search worlds">
        <div class="filters" id="filters" aria-label="World origin filters">
          <button class="filter here" data-category="all">all</button>
          <button class="filter" data-category="provided">provided</button>
          <button class="filter" data-category="published">published</button>
          <button class="filter" data-category="foreign">foreign</button>
        </div>
      </div>
      <div class="capture"><span id="count">loading</span><span class="mono" id="captured"></span></div>
      <div class="world-list" id="list" aria-live="polite"></div>
    </section>
    <section class="detail" id="detail" aria-live="polite">
      <div class="empty-detail"><div><strong>Select a world</strong>Inspect exact published identity, provenance, and representation facts.</div></div>
    </section>
  </main>
  <nav class="mobile-nav" aria-label="World Atlas mobile navigation">
    <button id="mobile-list">worlds</button>
    <button id="mobile-detail">detail</button>
    <button id="mobile-compare">compare <span id="compare-count">0</span></button>
  </nav>
  <div class="statusbar"></div>
</div>

<script src="/shared/shell.js"></script>
<script type="module">
import {
  compareWorlds,
  filterWorlds,
  graphUrl,
  normaliseWorld,
  registryUrl,
  worldCoordinate,
} from "/shared/worlds.js";

Shell.boot("worlds", {
  title: "World Atlas",
  keys: [["⌘K", "search"], ["↑↓", "walk"], ["C", "compare"], ["Esc", "back"]],
});
IdolShell.crumbs([{ label: "worlds" }, { label: "atlas" }]);

const state = { worlds: [], visible: [], selected: null, category: "all", compare: [] };
const list = document.getElementById("list");
const detail = document.getElementById("detail");
const query = document.getElementById("query");

const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

function formatBytes(value) {
  if (value < 1024) return `${value} B`;
  if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KiB`;
  return `${(value / 1024 / 1024).toFixed(1)} MiB`;
}

function choose(name, mobile = true) {
  state.selected = state.worlds.find((world) => world.name === name) || null;
  location.hash = state.selected ? `#${encodeURIComponent(state.selected.name)}` : "";
  paintList();
  paintDetail();
  if (mobile && matchMedia("(max-width: 699px)").matches) detail.classList.add("open");
}

function toggleCompare(world, event) {
  event?.stopPropagation();
  const present = state.compare.findIndex((item) => item.name === world.name);
  if (present >= 0) state.compare.splice(present, 1);
  else {
    if (state.compare.length === 2) state.compare.shift();
    state.compare.push(world);
  }
  document.getElementById("compare-count").textContent = String(state.compare.length);
  paintList();
  if (state.selected) paintDetail();
}

function paintList() {
  state.visible = filterWorlds(state.worlds, query.value, state.category);
  document.getElementById("count").textContent = `${state.visible.length} / ${state.worlds.length} worlds`;
  list.innerHTML = "";
  if (!state.visible.length) {
    const empty = el("div", "empty");
    empty.append(el("div", "glyph", "∅"), el("div", "", "No published world matches this view."));
    list.appendChild(empty);
    return;
  }
  for (const world of state.visible) {
    const button = el("button", `world-card${state.selected?.name === world.name ? " here" : ""}`);
    button.type = "button";
    button.addEventListener("click", () => choose(world.name));
    button.appendChild(el("span", `orb ${world.category}`));
    const body = el("span");
    body.appendChild(el("span", "world-name", world.name));
    body.appendChild(el("span", "world-summary", world.summary || "Published world projection"));
    const meta = el("span", "world-meta");
    meta.append(el("span", "", `v${world.version}`), el("span", "", world.publisher || "unknown"), el("span", "", world.category));
    body.appendChild(meta);
    button.appendChild(body);
    const compare = el("span", `compare-box${state.compare.some((item) => item.name === world.name) ? " on" : ""}`, "◇");
    compare.title = "Toggle comparison";
    compare.addEventListener("click", (event) => toggleCompare(world, event));
    button.appendChild(compare);
    list.appendChild(button);
  }
}

function fact(label, value, mono = false) {
  const card = el("div", "fact");
  card.appendChild(el("div", "label", label));
  card.appendChild(el("div", `value${mono ? " identity" : ""}`, value || "not published"));
  return card;
}

function action(label, href, primary = false) {
  const link = el("a", primary ? "primary" : "", label);
  link.href = href;
  return link;
}

function paintComparison(mount) {
  if (!state.compare.length) return;
  const panel = el("section", "compare-panel");
  const head = el("div", "compare-head");
  head.appendChild(el("h2", "", state.compare.length === 2 ? "Published fact comparison" : "Comparison queue"));
  head.appendChild(el("span", "spacer"));
  head.appendChild(el("span", "compare-note", "No semantic compatibility claim is inferred."));
  panel.appendChild(head);
  if (state.compare.length < 2) {
    const note = el("div", "boundary");
    note.appendChild(el("p", "", "Select one more world to compare exact published manifest fields."));
    panel.appendChild(note);
  } else {
    for (const row of compareWorlds(state.compare[0], state.compare[1])) {
      const line = el("div", `compare-row${row.equal ? "" : " changed"}`);
      line.append(el("div", "field", row.field), el("div", "value", row.left || "—"), el("div", "value", row.right || "—"));
      panel.appendChild(line);
    }
  }
  mount.appendChild(panel);
}

function paintDetail() {
  detail.innerHTML = "";
  const world = state.selected;
  if (!world) {
    const empty = el("div", "empty-detail");
    const body = el("div");
    body.append(el("strong", "", "Select a world"), document.createTextNode("Inspect exact published identity, provenance, and representation facts."));
    empty.appendChild(body); detail.appendChild(empty); return;
  }

  const inner = el("article", "detail-inner");
  const back = el("button", "mobile-back ghost", "← all worlds");
  back.addEventListener("click", () => detail.classList.remove("open"));
  inner.appendChild(back);

  const kicker = el("div", "world-kicker");
  kicker.appendChild(el("span", `category ${world.category}`, world.category));
  kicker.appendChild(el("span", "", `world · v${world.version}`));
  inner.appendChild(kicker);
  inner.appendChild(el("h1", "world-title", world.name));
  inner.appendChild(el("p", "world-lede", world.summary || "Published world projection with no summary."));

  const actions = el("div", "actions");
  actions.append(action("Open registry", registryUrl(world), true), action("Open graph", graphUrl(world)));
  const copy = el("button", "", "Copy coordinate");
  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(worldCoordinate(world));
    copy.textContent = "Copied";
    setTimeout(() => { copy.textContent = "Copy coordinate"; }, 1000);
  });
  const compare = el("button", "", state.compare.some((item) => item.name === world.name) ? "Remove comparison" : "Add comparison");
  compare.addEventListener("click", (event) => toggleCompare(world, event));
  actions.append(copy, compare);
  inner.appendChild(actions);

  const facts = el("section", "facts");
  facts.append(
    fact("graph identity", world.graph_id, true),
    fact("source hash", world.source_hash, true),
    fact("publisher", world.publisher || "not published"),
    fact("origin", world.origin || (world.category === "provided" ? "idol" : "not published"), true),
    fact("source extent", `${world.lines.toLocaleString()} lines · ${formatBytes(world.bytes)}`),
    fact("mirror", world.mirror || "not published", true),
    fact("published", world.published_at || "not published", true),
    fact("versions", Array.isArray(world.versions) ? world.versions.join(", ") : world.version, true),
    fact("snapshot class", `${world.category} · presentation only`)
  );
  inner.appendChild(facts);

  const tags = el("div", "tags");
  for (const tag of world.tags) tags.appendChild(el("span", "tag", tag));
  if (!world.tags.length) tags.appendChild(el("span", "tag", "no published tags"));
  inner.appendChild(tags);

  const boundary = el("section", "boundary");
  boundary.appendChild(el("h2", "", "Authority boundary"));
  boundary.appendChild(el("p", "", "This atlas displays the registry projection exactly as published. Provided, published, and foreign are navigation qualifications. Injection witnesses, capability grants, semantic equivalence, and composition are shown only when the compiler or registry publishes those facts; this page does not manufacture them."));
  inner.appendChild(boundary);
  paintComparison(inner);
  detail.appendChild(inner);
}

function setCategory(category) {
  state.category = category;
  document.querySelectorAll(".filter").forEach((button) => button.classList.toggle("here", button.dataset.category === category));
  paintList();
}

document.getElementById("filters").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-category]");
  if (button) setCategory(button.dataset.category);
});
query.addEventListener("input", paintList);
document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); query.focus(); query.select(); }
  if (event.key === "Escape") detail.classList.remove("open");
  if (event.key.toLowerCase() === "c" && state.selected && document.activeElement !== query) toggleCompare(state.selected);
});
document.getElementById("mobile-list").addEventListener("click", () => detail.classList.remove("open"));
document.getElementById("mobile-detail").addEventListener("click", () => { if (state.selected) detail.classList.add("open"); });
document.getElementById("mobile-compare").addEventListener("click", () => { if (state.selected) { detail.classList.add("open"); paintDetail(); } });

try {
  const response = await fetch("/runtime/worlds.json", { cache: "no-cache" });
  if (!response.ok) throw new Error(`snapshot answered ${response.status}`);
  const snapshot = await response.json();
  if (snapshot.schema !== "idol.web.worlds.v1" || !Array.isArray(snapshot.worlds)) throw new Error("invalid world snapshot");
  state.worlds = snapshot.worlds.map(normaliseWorld);
  document.getElementById("captured").textContent = snapshot.captured_at ? `captured ${snapshot.captured_at.slice(0, 10)}` : "snapshot";
  const requested = decodeURIComponent(location.hash.slice(1));
  const first = state.worlds.find((world) => world.name === requested) || state.worlds[0];
  if (first) choose(first.name, false); else paintList();
} catch (error) {
  list.innerHTML = "";
  const empty = el("div", "empty");
  empty.append(el("div", "glyph", "×"), el("div", "", `World snapshot unavailable: ${error.message}`));
  list.appendChild(empty);
  document.getElementById("count").textContent = "refused";
}
</script>
</body>
</html>
