<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta name="description" content="Exact authority mirrors, operational interfaces, and explicitly bounded product and research projections for Idol.">
  <title>Docs — Idol</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/docs-app.css">
  <link rel="stylesheet" href="/shared/studio.css">
  <script src="/config.js"></script>
</head>
<body>
  <div class="app docs-app" id="docs-app">
    <header class="topbar"></header>
    <div class="docs-toolbar">
      <button id="docs-menu" type="button" aria-expanded="false" aria-controls="docs-nav" aria-label="Open documentation navigation">menu</button>
      <strong id="docs-mobile-title">Docs</strong>
    </div>

    <div class="docs-shell">
      <aside class="docs-nav" id="docs-nav" aria-label="Documentation">
        <div class="docs-search">
          <input id="docs-search" type="search" placeholder="Search deployed docs…" autocomplete="off" spellcheck="false" aria-label="Search all Idol documents">
          <div class="docs-search-hint" id="docs-search-hint">Press / or ⌘K to search all documents.</div>
        </div>
        <nav class="docs-nav-list" id="docs-nav-list"></nav>
      </aside>

      <main class="docs-main">
        <div class="docs-authority" id="docs-authority"><strong>Loading authority boundary.</strong></div>
        <article class="docs-content docs-loading" id="docs-content">Loading exact document projection…</article>
      </main>
    </div>

    <button class="docs-backdrop" id="docs-backdrop" type="button" aria-label="Close documentation navigation"></button>
    <footer class="statusbar"></footer>
  </div>

  <script src="/shared/idol.js"></script>
  <script src="/shared/shell.js"></script>
  <script type="module" src="/shared/docs-app.js"></script>
</body>
</html>
