<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registry — idol.id</title>
<meta name="description" content="Idol package and world registry with exact source, graph, version, artifact, and provenance projections.">
<link rel="stylesheet" href="/shared/theme.css">
<script src="/config.js"></script>
<style>
  .pane-list { width: 330px; flex: none; border-right: 1px solid var(--rule); }
  .pane-list .search { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: flex; gap: 8px; }
  .pane-list .search input { flex: 1; font-size: 11px; }
  .pane-list .sort { display: flex; gap: 4px; }
  .pane-list .sort button { font-size: 9px; padding: 3px 7px; letter-spacing: .08em; }
  .seg { display: flex; border-bottom: 1px solid var(--rule); }
  .seg button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); border-bottom: 1px solid transparent; }
  .seg button.here { color: var(--ink); border-bottom-color: var(--signal); background: var(--bg-hover); }
  .boundary-note { padding: 9px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-4); font-family: var(--sans); font-size: 10px; line-height: 1.55; }
  .boundary-note strong { color: var(--ink-2); font-weight: 530; }
  .corpus-strip { padding: 7px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-4); font-size: 9.5px; letter-spacing: .06em; display: flex; gap: 12px; }
  .row .metric { color: var(--ink-4); font-size: 10px; flex: none; }
  .row .vbadge { color: var(--signal); font-size: 9px; flex: none; }
  .pkg-head { padding: 20px 22px 15px; border-bottom: 1px solid var(--rule); }
  .pkg-head h1 { font-family: var(--sans); font-size: 21px; font-weight: 610; letter-spacing: -.01em; }
  .pkg-head .sub { color: var(--ink-3); margin-top: 5px; font-family: var(--sans); font-size: 12px; line-height: 1.6; max-width: 72ch; }
  .pkg-head .meta { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  .statgrid { margin: 16px 20px; }
  .pkg-body { flex: 1; overflow: auto; display: flex; flex-direction: column; min-height: 0; }
  .read-section { padding: 15px 20px; border-bottom: 1px solid var(--rule); }
  .read-section h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 8px; }
  .read-section p { color: var(--ink-2); font-family: var(--sans); font-size: 12px; line-height: 1.65; max-width: 76ch; }
  .rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .vrow { display: flex; gap: 12px; padding: 9px 20px; border-bottom: 1px solid var(--rule); align-items: center; }
  .vrow .v { color: var(--ink); }
  .vrow button { margin-left: auto; font-size: 10px; }
  .vrow button + button { margin-left: 0; }
  .deps-cols { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
  .deps-cols > div:first-child { border-right: 1px solid var(--rule); }
  .deps-cols h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); padding: 12px 16px 8px; }
  .lib-mobile-nav { display: none; }
  dialog { background: var(--bg-raise); color: var(--ink); border: 1px solid var(--rule-3); border-radius: var(--radius); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  dialog form { display: flex; flex-direction: column; gap: 10px; padding: 18px; min-width: min(420px, calc(100vw - 30px)); }
  dialog h2 { font-family: var(--sans); font-size: 14px; font-weight: 550; }
  dialog label { display: flex; flex-direction: column; gap: 5px; font-family: var(--sans); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); }
  dialog .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  @media (max-width: 699px) {
    .stage { display: block; overflow: auto; }
    .pane-list { width: 100%; max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--rule-2); }
    .pane-list .pane-body { max-height: 28vh; }
    .pkg-body { min-height: 54vh; overflow: visible; }
    .lib-mobile-nav { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); border-bottom: 1px solid var(--rule); }
    .lib-mobile-nav a { min-height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--rule); color: var(--ink-3); font-family: var(--sans); font-size: 11px; }
    .lib-mobile-nav a:last-child { border-right: 0; }
    .pkg-head, .actions, .read-section { padding-left: 16px; padding-right: 16px; }
    .statgrid { margin-left: 16px; margin-right: 16px; }
    .deps-cols { grid-template-columns: 1fr; }
    .deps-cols > div:first-child { border-right: 0; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <nav class="lib-mobile-nav" aria-label="Registry contextual views"><a href="/atlas">World Atlas</a><a href="/universe">Universe views</a></nav>
  <div class="stage">
    <aside class="pane pane-list">
      <div class="search">
        <input type="search" id="q" placeholder="search packages and worlds… (⌘K)" spellcheck="false">
        <div class="sort">
          <button data-sort="rel" class="here">best</button>
          <button data-sort="name">a–z</button>
          <button data-sort="lines">size</button>
        </div>
      </div>
      <div class="seg">
        <button class="here" data-set="worlds">worlds</button>
        <button data-set="libs">homes</button>
      </div>
      <div class="boundary-note"><strong>Package provenance is not semantic identity.</strong> A published world keeps its exact registry evidence; a home is reach and provenance, not a world.</div>
      <div class="corpus-strip" id="strip"></div>
      <div class="pane-body"><div class="list" id="list"></div></div>
    </aside>
    <main class="pane pkg-body" id="detail">
      <div class="empty" style="flex:1"><div class="glyph">◍</div><div>select a published world</div><div class="mono-note">versions · source · graph · dependencies · provenance</div></div>
    </main>
  </div>
  <div class="statusbar"></div>
</div>

<script src="/shared/idol.js"></script>
<script src="/shared/graph.js"></script>
<script src="/shared/shell.js"></script>
<script>
(function () {
  Shell.boot("lib", { title: "Registry", keys: [["hover", "any token"], ["⌘K", "search"], ["⌘E", "explorer"], ["↑↓", "walk list"]] });
  IdolShell.crumbs([{ label: "registry" }, { label: "published worlds" }]);

  let set = "worlds";
  if (new URLSearchParams(location.search).get("set") === "homes") set = "libs";
  let sort = "rel";
  let items = [];
  let current = null;
  let cursor = -1;
  let visible = [];
  let detCache = null;
  const q = document.getElementById("q");

  document.querySelectorAll(".seg button").forEach((button) => {
    button.classList.toggle("here", button.dataset.set === set);
    button.addEventListener("click", () => {
      set = button.dataset.set;
      document.querySelectorAll(".seg button").forEach((candidate) => candidate.classList.toggle("here", candidate === button));
      cursor = -1;
      current = null;
      history.replaceState(null, "", set === "libs" ? "?set=homes" : location.pathname);
      IdolShell.crumbs([{ label: "registry" }, { label: set === "worlds" ? "published worlds" : "source homes" }]);
      load();
    });
  });
  document.querySelectorAll(".sort button").forEach((button) => button.addEventListener("click", () => {
    sort = button.dataset.sort;
    document.querySelectorAll(".sort button").forEach((candidate) => candidate.classList.toggle("here", candidate === button));
    render();
  }));

  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); q.focus(); q.select(); }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "e") { event.preventDefault(); openInExplorerCurrent(); }
    if (document.activeElement !== q || !["ArrowDown", "ArrowUp", "Enter"].includes(event.key)) return;
    event.preventDefault();
    if (event.key === "Enter") {
      const selected = visible[Math.max(0, cursor)];
      if (selected) { q.blur(); select(selected.name); }
      return;
    }
    cursor = Math.max(0, Math.min(visible.length - 1, cursor + (event.key === "ArrowDown" ? 1 : -1)));
    paintCursor();
    document.getElementById("list").children[cursor]?.scrollIntoView({ block: "nearest" });
  });
  q.addEventListener("input", () => { cursor = -1; render(); });

  function score(item, needle) {
    if (!needle) return 1;
    const name = item.name.toLowerCase();
    if (name.startsWith(needle)) return 100 - name.length * .1;
    if (name.includes(needle)) return 70 - name.length * .1;
    let matched = 0;
    for (const character of name) { if (character === needle[matched]) matched++; if (matched === needle.length) return 40 - name.length * .1; }
    const facts = `${item.summary || ""} ${(item.relations || []).join(" ")}`.toLowerCase();
    return facts.includes(needle) ? 10 : 0;
  }

  async function load() {
    try {
      const payload = set === "worlds" ? await Idol.api.get("/api/worlds") : await Idol.api.get("/api/libs");
      items = payload.worlds || payload.libs || [];
      const lines = items.reduce((sum, item) => sum + Number(item.lines || item.stats?.lines || 0), 0);
      document.getElementById("strip").textContent = `${items.length} ${set === "worlds" ? "worlds" : "homes"} · ${lines.toLocaleString()} lines`;
      render();
      const initial = decodeURIComponent(location.hash.slice(1));
      if (initial && initial !== current) select(initial, false);
    } catch (error) { Idol.toast(error.message, true); }
  }

  function render() {
    const needle = q.value.trim().toLowerCase();
    const list = document.getElementById("list");
    list.replaceChildren();
    visible = items.map((item) => ({ item, score: score(item, needle) })).filter((entry) => entry.score > 0);
    if (sort === "name") visible.sort((a, b) => a.item.name.localeCompare(b.item.name));
    else if (sort === "lines") visible.sort((a, b) => Number(b.item.lines || b.item.stats?.lines || 0) - Number(a.item.lines || a.item.stats?.lines || 0));
    else visible.sort((a, b) => b.score - a.score);
    visible = visible.map((entry) => entry.item);
    if (!visible.length) { list.appendChild(Idol.el("div", { class: "empty" }, Idol.el("div", { class: "glyph" }, "∅"), Idol.el("div", null, "nothing matches"))); return; }
    for (const item of visible) {
      const world = set === "worlds";
      const row = Idol.el("div", { class: `row${current === item.name ? " here" : ""}` },
        Idol.el("div", { class: "grow" }, Idol.el("div", { class: "title" }, item.name), Idol.el("div", { class: "sub" }, world ? `v${item.version || "?"} · ${item.summary || ""}` : item.summary || (item.relations || []).slice(0, 5).join(" "))),
        world && item.mirror === "r2" ? Idol.el("span", { class: "vbadge" }, "◈ r2") : null,
        Idol.el("span", { class: "metric" }, `${item.lines || item.stats?.lines || "?"} ln`));
      row.addEventListener("click", () => select(item.name));
      list.appendChild(row);
    }
  }

  function paintCursor() {
    document.querySelectorAll("#list .row").forEach((row, index) => row.classList.toggle("here", visible[index]?.name === visible[cursor]?.name));
  }

  async function select(name, push = true) {
    current = name;
    if (push) location.hash = `#${encodeURIComponent(name)}`;
    render();
    IdolShell.crumbs([{ label: "registry" }, { label: set === "worlds" ? "world" : "home" }, { label: name }]);
    const detail = document.getElementById("detail");
    detail.replaceChildren(Idol.el("div", { style: "padding:20px" }, Idol.el("span", { class: "spin" })));
    try {
      const record = await Idol.api.get(`/api/lib/${encodeURIComponent(name)}/detail`);
      detCache = { name, record };
      renderDetail(name, record);
    } catch (error) {
      detail.replaceChildren(Idol.el("div", { class: "empty" }, Idol.el("div", { class: "glyph" }, "×"), Idol.el("div", null, error.message)));
    }
  }

  function renderDetail(name, record) {
    const detail = document.getElementById("detail");
    const graph = record.graph || {};
    const stats = record.stats || {};
    const world = set === "worlds";
    detail.replaceChildren();

    const head = Idol.el("div", { class: "pkg-head" },
      Idol.el("h1", null, name),
      Idol.el("div", { class: "sub" }, record.summary || stats.summary || (world ? "published world projection" : "source home reach projection")),
      Idol.el("div", { class: "meta" },
        Idol.el("span", { class: world ? "badge sig" : "badge" }, world ? "published world" : "source home"),
        world ? Idol.el("span", { class: "badge" }, `v${record.version || "?"}`) : null,
        record.check?.ok ? Idol.el("span", { class: "badge ok" }, "law ✓") : Idol.el("span", { class: "badge bad" }, "unverified"),
        stats.source_hash ? Idol.el("span", { class: "badge" }, `hash ${stats.source_hash}`) : null,
        record.mirror ? Idol.el("span", { class: "badge" }, `◈ ${record.mirror}`) : null));
    detail.appendChild(head);

    detail.appendChild(Idol.el("div", { class: "actions" },
      Idol.el("button", { class: "primary", onclick: openInExplorerCurrent }, "open in explorer"),
      Idol.el("button", { onclick: () => copyCoordinate(name, record, world) }, world ? "copy world link" : "copy home link"),
      Idol.el("button", { class: "ghost", onclick: () => navigator.clipboard.writeText(record.source || "").then(() => Idol.toast("source copied")) }, "copy source"),
      !world ? Idol.el("button", { class: "signal", onclick: () => publishDialog(name, record.source || "") }, "publish world") : null));

    const statgrid = Idol.el("div", { class: "statgrid" });
    for (const [value, label] of [
      [stats.lines || (record.source?.match(/\n/g) || []).length + 1, "lines"],
      [(graph.nodes || []).length, "graph nodes"],
      [(graph.edges || []).length, "structural edges"],
      [(graph.applications || []).length, "applications"],
      [(graph.worlds || []).length, "world facts"],
    ]) statgrid.appendChild(Idol.el("div", { class: "stat" }, Idol.el("div", { class: "n" }, String(value)), Idol.el("div", { class: "l" }, label)));
    detail.appendChild(statgrid);

    const tabs = Idol.el("div", { class: "tabs" });
    const bodies = {};
    const names = ["read", "source", "graph", "deps", ...(world ? ["versions"] : [])];
    for (const [index, name] of names.entries()) {
      const tab = Idol.el("button", { class: `tab${index === 0 ? " here" : ""}`, "data-tab": name }, name);
      tabs.appendChild(tab);
      const body = Idol.el("section", { style: `flex:1;display:${index === 0 ? "flex" : "none"};flex-direction:column;min-height:0;overflow:auto` });
      bodies[name] = body;
      tab.addEventListener("click", () => {
        tabs.querySelectorAll(".tab").forEach((candidate) => candidate.classList.toggle("here", candidate === tab));
        for (const [key, value] of Object.entries(bodies)) value.style.display = key === name ? "flex" : "none";
        if (name === "graph") graphView.fitIfFirst();
      });
    }
    detail.appendChild(tabs);
    for (const name of names) detail.appendChild(bodies[name]);

    const relationNames = [...new Set((graph.nodes || []).filter((node) => node.name && node.kind !== "module").map((node) => node.name))];
    bodies.read.appendChild(Idol.el("div", { class: "read-section" }, Idol.el("h3", null, `relations · ${relationNames.length}`), Idol.el("div", { class: "rel-chips" }, relationNames.slice(0, 48).map((relation) => Idol.el("span", { class: "chip" }, relation)))));
    bodies.read.appendChild(Idol.el("div", { class: "read-section" }, Idol.el("h3", null, "identity boundary"), Idol.el("p", null, world
      ? "This registry record projects published source, graph facts, version, artifacts, and provenance. The package coordinate is not the semantic identity; exact world identity must be published by the registry or compiler projection."
      : "This is a source home reach projection. Home is reach and provenance, not a world, subject, place, or authority grant.")));

    const editorMount = Idol.el("div", { style: "flex:1;display:flex;min-height:320px" });
    bodies.source.appendChild(editorMount);
    const editor = Idol.editor(editorMount, { source: record.source || "" });
    editor.ta.readOnly = true;
    editor.ta.style.caretColor = "transparent";
    const explorer = Idol.explore(editor, { graph: record.graph, explain: record.explain, onReveal: () => tabs.querySelector('[data-tab="graph"]').click(), onLib: (value) => select(value) });
    explorer.rebind();

    const graphMount = Idol.el("div", { style: "flex:1;min-height:360px" });
    bodies.graph.appendChild(graphMount);
    const graphView = new GraphView(graphMount, {});
    graphView.setGraph(record.graph);

    const columns = Idol.el("div", { class: "deps-cols" },
      Idol.el("div", null, Idol.el("h3", null, "uses"), Idol.el("div", { class: "list", id: "uses-list" })),
      Idol.el("div", null, Idol.el("h3", null, "used by"), Idol.el("div", { class: "list", id: "dependents-list" })));
    bodies.deps.appendChild(columns);
    Promise.all([
      Idol.api.get(`/api/lib/${encodeURIComponent(name)}/uses`).catch(() => ({ uses: [] })),
      Idol.api.get(`/api/lib/${encodeURIComponent(name)}/dependents`).catch(() => ({ dependents: [] })),
    ]).then(([uses, dependents]) => {
      fillNames(document.getElementById("uses-list"), uses.uses || [], "uses nothing");
      fillNames(document.getElementById("dependents-list"), dependents.dependents || [], "no dependents yet");
    });

    if (world) {
      const list = Idol.el("div", { class: "list" });
      bodies.versions.appendChild(list);
      Idol.api.get(`/api/lib/${encodeURIComponent(name)}/versions`).then((result) => {
        list.replaceChildren();
        for (const version of [...(result.versions || [])].reverse()) list.appendChild(Idol.el("div", { class: "vrow" },
          Idol.el("span", { class: "v", style: version === record.version ? "color:var(--signal)" : "" }, `v${version}`),
          version === record.version ? Idol.el("span", { class: "badge sig" }, "current") : null,
          Idol.el("span", { style: "flex:1" }),
          Idol.el("button", { onclick: () => viewVersion(name, version, editor, tabs) }, "view"),
          Idol.el("button", { class: "ghost", onclick: () => copyVersion(name, version) }, "copy")));
      }).catch(() => {});
    }
  }

  function fillNames(mount, names, emptyText) {
    mount.replaceChildren();
    if (!names.length) { mount.appendChild(Idol.el("div", { class: "empty" }, Idol.el("div", { class: "glyph" }, "◌"), Idol.el("div", null, emptyText))); return; }
    for (const name of names) mount.appendChild(Idol.el("div", { class: "row", onclick: () => select(name) }, Idol.el("div", { class: "grow" }, Idol.el("div", { class: "title" }, name))));
  }

  function openInExplorerCurrent() {
    if (!detCache) return;
    const encoded = btoa(unescape(encodeURIComponent(detCache.record.source || "")));
    window.open(`https://graph.idol.id/#${encoded}`, "_blank", "noopener");
  }

  function copyCoordinate(name, record, world) {
    const url = new URL("https://lib.idol.id/");
    if (!world) url.searchParams.set("set", "homes");
    url.hash = encodeURIComponent(name);
    navigator.clipboard.writeText(url.toString()).then(() => Idol.toast("deep link copied"));
  }

  function viewVersion(name, version, editor, tabs) {
    Idol.api.text(`/api/lib/${encodeURIComponent(name)}/version/${encodeURIComponent(version)}`).then((source) => {
      if (editor.setSource) editor.setSource(source);
      else { editor.ta.value = source; editor.ta.dispatchEvent(new Event("input")); }
      tabs.querySelector('[data-tab="source"]').click();
      Idol.toast(`viewing v${version}`);
    }).catch((error) => Idol.toast(error.message, true));
  }

  function copyVersion(name, version) {
    Idol.api.text(`/api/lib/${encodeURIComponent(name)}/version/${encodeURIComponent(version)}`).then((source) => navigator.clipboard.writeText(source).then(() => Idol.toast(`v${version} copied`)));
  }

  function publishDialog(name, source) {
    const dialog = document.createElement("dialog");
    document.body.appendChild(dialog);
    dialog.innerHTML = `<form method="dialog"><h2>publish ${name} as a world</h2><label>version <input name="version" value="0.1.0" required></label><label>summary <input name="summary" placeholder="one line"></label><label>tags <input name="tags" placeholder="core, test"></label><label>write token <input name="token" type="password" placeholder="Bearer write token" required></label><div class="row-btns"><button value="cancel" class="ghost">cancel</button><button value="ok" class="primary">publish</button></div></form>`;
    dialog.showModal();
    dialog.addEventListener("close", () => {
      if (dialog.returnValue !== "ok") { dialog.remove(); return; }
      const fields = new FormData(dialog.querySelector("form"));
      fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${fields.get("token")}` }, body: JSON.stringify({ name, version: fields.get("version"), source, summary: fields.get("summary"), meta: { publisher: "lib.idol.id", tags: String(fields.get("tags") || "").split(",").map((value) => value.trim()).filter(Boolean) } }) })
        .then((response) => response.json()).then((result) => { if (result.error) throw new Error(result.error); Idol.toast(`published ${name} v${result.version}`); set = "worlds"; load(); })
        .catch((error) => Idol.toast(error.message, true)).finally(() => dialog.remove());
    });
  }

  window.addEventListener("hashchange", () => {
    const name = decodeURIComponent(location.hash.slice(1));
    if (name && name !== current) select(name, false);
  });
  load();
})();
</script>
</body>
</html>
