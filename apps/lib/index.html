<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registry — idol.id</title>
<meta name="description" content="Idol package-and-world registry with exact source, graph, version, artifact, provenance, home, and canonical World Atlas projections.">
<link rel="stylesheet" href="/shared/theme.css">
<script src="/config.js"></script>
<style>
  :root { --lib-panel: rgba(5,6,7,.96); }
  html, body { max-width: 100%; }
  body { overflow: hidden; }
  .app { min-height: 0; }
  .stage { min-height: 0; }
  .pane-list { width: 350px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--rule); background: var(--lib-panel); }
  .lensbar { min-height: 46px; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); border-bottom: 1px solid var(--rule); }
  .lensbar a { min-width: 0; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; border: 0; border-right: 1px solid var(--rule); color: var(--ink-4); font-family: var(--sans); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
  .lensbar a:last-child { border-right: 0; }
  .lensbar a.here { color: var(--ink); box-shadow: inset 0 -1px var(--signal); background: var(--bg-hover); }
  .pane-list .search { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
  .pane-list .search input { min-width: 0; font-size: 11px; }
  .pane-list .sort { display: flex; gap: 4px; }
  .pane-list .sort button { font-size: 9px; padding: 3px 7px; letter-spacing: .08em; }
  .seg { display: flex; border-bottom: 1px solid var(--rule); }
  .seg button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); border-bottom: 1px solid transparent; }
  .seg button.here { color: var(--ink); border-bottom-color: var(--signal); background: var(--bg-hover); }
  .boundary-note { padding: 10px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-4); font-family: var(--sans); font-size: 10px; line-height: 1.55; }
  .boundary-note strong { color: var(--ink-2); font-weight: 540; }
  .corpus-strip { padding: 7px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-4); font: 9.5px/1.4 var(--mono); letter-spacing: .04em; }
  .pane-list .pane-body { flex: 1; min-height: 0; overflow: auto; }
  .list .row { min-height: 58px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; text-align: left; }
  .list .row:hover, .list .row.here { background: var(--bg-hover); }
  .row .grow { min-width: 0; flex: 1; }
  .row .title { overflow-wrap: anywhere; }
  .row .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .metric { color: var(--ink-4); font: 10px/1 var(--mono); flex: none; }
  .row .vbadge { color: var(--signal); font: 9px/1 var(--mono); flex: none; }
  .pkg-body { flex: 1; overflow: auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #020303; }
  .pkg-head { padding: 20px 22px 15px; border-bottom: 1px solid var(--rule); }
  .pkg-head-top { display: flex; align-items: center; gap: 10px; }
  .pkg-head h1 { font-family: var(--sans); font-size: 22px; font-weight: 610; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .pkg-head .sub { color: var(--ink-3); margin-top: 6px; font-family: var(--sans); font-size: 12px; line-height: 1.65; max-width: 74ch; }
  .pkg-head .meta { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  .mobile-back { display: none; }
  .actions { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .actions a { min-height: 42px; display: inline-flex; align-items: center; padding: 5px 12px; border: 1px solid var(--rule-2); border-radius: var(--radius); color: var(--ink-2); }
  .statgrid { margin: 16px 20px; }
  .read-section { padding: 15px 20px; border-bottom: 1px solid var(--rule); }
  .read-section h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 8px; }
  .read-section p { color: var(--ink-2); font-family: var(--sans); font-size: 12px; line-height: 1.65; max-width: 76ch; }
  .rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .vrow { display: flex; gap: 12px; padding: 9px 20px; border-bottom: 1px solid var(--rule); align-items: center; }
  .vrow .v { color: var(--ink); }
  .vrow button { margin-left: auto; font-size: 10px; }
  .vrow button + button { margin-left: 0; }
  .deps-cols { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
  .deps-cols > div:first-child { border-right: 1px solid var(--rule); }
  .deps-cols h3 { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); padding: 12px 16px 8px; }
  .lib-mobile-nav { display: none; }
  dialog { background: var(--bg-raise); color: var(--ink); border: 1px solid var(--rule-3); border-radius: 10px; padding: 0; max-width: calc(100vw - 24px); }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  dialog form { display: flex; flex-direction: column; gap: 10px; padding: 18px; width: min(430px,calc(100vw - 30px)); }
  dialog h2 { font-family: var(--sans); font-size: 14px; font-weight: 550; }
  dialog label { display: flex; flex-direction: column; gap: 5px; font-family: var(--sans); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); }
  dialog .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  @media (max-width: 699px) {
    html, body { width: 100%; height: 100%; overflow: hidden; }
    .app { height: 100dvh; }
    .stage { position: relative; display: block; flex: 1; min-height: 0; overflow: hidden; }
    .pane-list, .pkg-body { position: absolute; inset: 0 0 calc(68px + env(safe-area-inset-bottom)); width: 100%; border: 0; min-width: 0; min-height: 0; }
    .pane-list { display: none; }
    .pkg-body { display: none; overflow: auto; }
    .app[data-mobile="list"] .pane-list { display: flex; }
    .app[data-mobile="detail"] .pkg-body { display: flex; }
    .lensbar { min-height: 48px; }
    .lensbar a { min-height: 48px; padding: 0 3px; font-size: 8.5px; letter-spacing: .05em; }
    .pane-list .search { grid-template-columns: minmax(0,1fr); }
    .pane-list .sort { width: 100%; }
    .pane-list .sort button { flex: 1; }
    .pane-list .pane-body { flex: 1; max-height: none; overflow: auto; }
    .pkg-head, .actions, .read-section { padding-left: 16px; padding-right: 16px; }
    .pkg-head { padding-top: 14px; }
    .mobile-back { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: 44px; min-height: 44px; padding: 0; border-radius: 50%; font-size: 20px; }
    .statgrid { margin-left: 16px; margin-right: 16px; }
    .deps-cols { grid-template-columns: 1fr; }
    .deps-cols > div:first-child { border-right: 0; border-bottom: 1px solid var(--rule); }
    .tabs { overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; min-height: 44px; }
    .lib-mobile-nav { display: grid; position: fixed; z-index: 60; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); grid-template-columns: repeat(2,minmax(0,1fr)); padding: 5px; border: 1px solid var(--rule-2); border-radius: 15px; background: rgba(8,9,10,.96); box-shadow: 0 18px 48px rgba(0,0,0,.56); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .lib-mobile-nav button { min-height: 46px; border: 0; border-radius: 10px; background: transparent; }
    .lib-mobile-nav button.here { color: var(--signal); background: var(--signal-dim); }
    .statusbar { display: none; }
  }

  @media (max-width: 370px) {
    .boundary-note { font-size: 9.5px; }
    .pkg-head h1 { font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="app" id="lib-app" data-mobile="list">
  <div class="topbar"></div>
  <div class="stage">
    <aside class="pane pane-list">
      <nav class="lensbar" aria-label="Registry contextual views">
        <a class="here" href="/">published</a>
        <a href="https://worlds.idol.id/">atlas</a>
        <a href="/?set=homes">homes</a>
        <a href="https://worlds.idol.id/universe">universe</a>
      </nav>
      <div class="search">
        <input type="search" id="q" placeholder="search published records… (⌘K)" spellcheck="false" aria-label="Search published records and source homes">
        <div class="sort" aria-label="Sort registry results">
          <button data-sort="rel" class="here">best</button>
          <button data-sort="name">a–z</button>
          <button data-sort="lines">size</button>
        </div>
      </div>
      <div class="seg" aria-label="Registry record kind">
        <button class="here" data-set="worlds">published</button>
        <button data-set="libs">homes</button>
      </div>
      <div class="boundary-note"><strong>Published records and source homes are distinct projections.</strong> Package provenance is not semantic identity or authority. A home is reach and provenance, not a world.</div>
      <div class="corpus-strip" id="strip"></div>
      <div class="pane-body"><div class="list" id="list"></div></div>
    </aside>
    <main class="pane pkg-body" id="detail">
      <div class="empty" style="flex:1"><div class="glyph">◍</div><div>select a published record</div><div class="mono-note">source · graph · versions · dependencies · provenance</div></div>
    </main>
  </div>
  <nav class="lib-mobile-nav" aria-label="Registry mobile navigation">
    <button type="button" class="here" data-mobile-view="list">list</button>
    <button type="button" data-mobile-view="detail">detail</button>
  </nav>
  <div class="statusbar"></div>
</div>

<script src="/shared/idol.js"></script>
<script src="/shared/graph.js"></script>
<script src="/shared/shell.js"></script>
<script>
(function () {
  "use strict";

  Shell.boot("lib", { title: "Registry", keys: [["hover", "any token"], ["⌘K", "search"], ["⌘E", "explorer"], ["↑↓", "walk list"]] });
  const app = document.getElementById("lib-app");
  const q = document.getElementById("q");
  const requestedSet = new URLSearchParams(location.search).get("set");
  let set = requestedSet === "homes" ? "libs" : "worlds";
  let sort = "rel";
  let items = [];
  let visible = [];
  let current = null;
  let cursor = -1;
  let detailRecord = null;
  let graphView = null;

  function setMobileView(view) {
    app.dataset.mobile = view;
    document.querySelectorAll("[data-mobile-view]").forEach((button) => {
      button.classList.toggle("here", button.dataset.mobileView === view);
    });
  }

  document.querySelectorAll("[data-mobile-view]").forEach((button) => {
    button.addEventListener("click", () => setMobileView(button.dataset.mobileView));
  });

  function setRecordKind(next) {
    set = next;
    current = null;
    detailRecord = null;
    cursor = -1;
    document.querySelectorAll(".seg button").forEach((button) => button.classList.toggle("here", button.dataset.set === set));
    document.querySelectorAll(".lensbar a").forEach((link) => {
      const homeLens = link.getAttribute("href").includes("set=homes");
      link.classList.toggle("here", set === "worlds" ? link.getAttribute("href") === "/" : homeLens);
    });
    const url = new URL(location.href);
    if (set === "libs") url.searchParams.set("set", "homes"); else url.searchParams.delete("set");
    url.hash = "";
    history.replaceState(null, "", `${url.pathname}${url.search}`);
    IdolShell.crumbs([{ label: "registry" }, { label: set === "worlds" ? "published records" : "source homes" }]);
    setMobileView("list");
    load();
  }

  document.querySelectorAll(".seg button").forEach((button) => {
    button.classList.toggle("here", button.dataset.set === set);
    button.addEventListener("click", () => setRecordKind(button.dataset.set));
  });

  document.querySelectorAll(".sort button").forEach((button) => button.addEventListener("click", () => {
    sort = button.dataset.sort;
    document.querySelectorAll(".sort button").forEach((candidate) => candidate.classList.toggle("here", candidate === button));
    renderList();
  }));

  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      q.focus();
      q.select();
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "e") {
      event.preventDefault();
      openInExplorerCurrent();
    }
    if (document.activeElement !== q || !["ArrowDown", "ArrowUp", "Enter"].includes(event.key)) return;
    event.preventDefault();
    if (event.key === "Enter") {
      const selected = visible[Math.max(0,cursor)];
      if (selected) { q.blur(); select(selected.name); }
      return;
    }
    cursor = Math.max(0,Math.min(visible.length - 1,cursor + (event.key === "ArrowDown" ? 1 : -1)));
    paintCursor();
    document.getElementById("list").children[cursor]?.scrollIntoView({ block: "nearest" });
  });

  q.addEventListener("input", () => { cursor = -1; renderList(); });

  function score(item, needle) {
    if (!needle) return 1;
    const name = String(item.name || "").toLowerCase();
    if (name.startsWith(needle)) return 100 - name.length * .1;
    if (name.includes(needle)) return 70 - name.length * .1;
    let matched = 0;
    for (const character of name) {
      if (character === needle[matched]) matched += 1;
      if (matched === needle.length) return 40 - name.length * .1;
    }
    const facts = `${item.summary || ""} ${(item.relations || []).join(" ")} ${(item.tags || []).join(" ")}`.toLowerCase();
    return facts.includes(needle) ? 10 : 0;
  }

  async function load() {
    try {
      const payload = set === "worlds" ? await Idol.api.get("/api/worlds") : await Idol.api.get("/api/libs");
      items = payload.worlds || payload.libs || [];
      const lines = items.reduce((sum,item) => sum + Number(item.lines || item.stats?.lines || 0),0);
      document.getElementById("strip").textContent = `${items.length} ${set === "worlds" ? "published records" : "source homes"} · ${lines.toLocaleString()} lines`;
      renderList();
      const initial = decodeURIComponent(location.hash.slice(1));
      if (initial && initial !== current) select(initial,false);
    } catch (error) {
      Idol.toast(error.message,true);
      document.getElementById("list").replaceChildren(Idol.el("div", { class: "empty" }, Idol.el("div", null, "registry unavailable")));
    }
  }

  function renderList() {
    const needle = q.value.trim().toLowerCase();
    const list = document.getElementById("list");
    list.replaceChildren();
    visible = items.map((item) => ({ item, score: score(item,needle) })).filter((entry) => entry.score > 0);
    if (sort === "name") visible.sort((a,b) => a.item.name.localeCompare(b.item.name));
    else if (sort === "lines") visible.sort((a,b) => Number(b.item.lines || b.item.stats?.lines || 0) - Number(a.item.lines || a.item.stats?.lines || 0));
    else visible.sort((a,b) => b.score - a.score || a.item.name.localeCompare(b.item.name));
    visible = visible.map((entry) => entry.item);
    if (!visible.length) {
      list.appendChild(Idol.el("div", { class: "empty" }, Idol.el("div", { class: "glyph" }, "∅"), Idol.el("div", null, "nothing matches")));
      return;
    }
    for (const item of visible) {
      const published = set === "worlds";
      const sub = published ? `v${item.version || "?"} · ${item.summary || ""}` : item.summary || (item.relations || []).slice(0,5).join(" ");
      const row = Idol.el("button", { class: `row${current === item.name ? " here" : ""}`, type: "button" },
        Idol.el("div", { class: "grow" }, Idol.el("div", { class: "title" }, item.name), Idol.el("div", { class: "sub" }, sub)),
        published && item.mirror === "r2" ? Idol.el("span", { class: "vbadge" }, "◈ r2") : null,
        Idol.el("span", { class: "metric" }, `${item.lines || item.stats?.lines || "?"} ln`));
      row.addEventListener("click", () => select(item.name));
      list.appendChild(row);
    }
  }

  function paintCursor() {
    document.querySelectorAll("#list .row").forEach((row,index) => row.classList.toggle("here", visible[index]?.name === visible[cursor]?.name));
  }

  async function select(name, push = true) {
    current = name;
    if (push) {
      const url = new URL(location.href);
      url.hash = encodeURIComponent(name);
      history.pushState({ record: name, set }, "", `${url.pathname}${url.search}${url.hash}`);
    }
    renderList();
    setMobileView("detail");
    IdolShell.crumbs([{ label: "registry" }, { label: set === "worlds" ? "published" : "home" }, { label: name }]);
    const detail = document.getElementById("detail");
    detail.replaceChildren(Idol.el("div", { style: "padding:20px" }, Idol.el("span", { class: "spin" })));
    try {
      const record = await Idol.api.get(`/api/lib/${encodeURIComponent(name)}/detail`);
      detailRecord = { name, record };
      renderDetail(name,record);
    } catch (error) {
      detail.replaceChildren(Idol.el("div", { class: "empty" }, Idol.el("div", { class: "glyph" }, "×"), Idol.el("div", null, error.message)));
    }
  }

  function renderDetail(name, record) {
    const detail = document.getElementById("detail");
    const graph = record.graph || {};
    const stats = record.stats || {};
    const published = set === "worlds";
    const entities = record.explain?.knowledge_snapshot?.entities || [];
    detail.replaceChildren();

    const back = Idol.el("button", { class: "mobile-back", type: "button", title: "Back to list", "aria-label": "Back to registry list" }, "‹");
    back.addEventListener("click", () => setMobileView("list"));
    const head = Idol.el("header", { class: "pkg-head" },
      Idol.el("div", { class: "pkg-head-top" }, back, Idol.el("h1", null, name)),
      Idol.el("div", { class: "sub" }, record.summary || stats.summary || (published ? "published world projection" : "source home reach/provenance")),
      Idol.el("div", { class: "meta" },
        Idol.el("span", { class: published ? "badge sig" : "badge" }, published ? "published record" : "source home"),
        published ? Idol.el("span", { class: "badge" }, `v${record.version || "?"}`) : null,
        record.check?.ok ? Idol.el("span", { class: "badge ok" }, "law ✓") : Idol.el("span", { class: "badge bad" }, "errors"),
        stats.source_hash ? Idol.el("span", { class: "badge" }, `hash ${stats.source_hash}`) : null,
        record.mirror ? Idol.el("span", { class: "badge" }, `◈ ${record.mirror}`) : null));
    detail.appendChild(head);

    const actions = Idol.el("div", { class: "actions" });
    const explorer = Idol.el("button", { class: "primary", type: "button" }, "open in explorer");
    explorer.addEventListener("click", () => openInExplorer(record.source || ""));
    const copyLink = Idol.el("button", { type: "button" }, "copy link");
    copyLink.addEventListener("click", () => copyDeepLink(name));
    const copySource = Idol.el("button", { class: "ghost", type: "button" }, "copy source");
    copySource.addEventListener("click", async () => {
      try {
        const source = await Idol.api.text(`/api/lib/${encodeURIComponent(name)}/source`);
        await navigator.clipboard.writeText(source);
        Idol.toast("source copied");
      } catch (error) { Idol.toast(error.message,true); }
    });
    actions.append(explorer,copyLink,copySource);
    if (published) {
      const atlas = Idol.el("a", { href: `https://worlds.idol.id/#${encodeURIComponent(name)}` }, "view in Atlas");
      actions.appendChild(atlas);
    } else {
      const publish = Idol.el("button", { class: "signal", type: "button" }, "publish world record");
      publish.addEventListener("click", () => publishDialog(name,record.source || ""));
      actions.appendChild(publish);
    }
    detail.appendChild(actions);

    const statgrid = Idol.el("div", { class: "statgrid" });
    const statCells = [
      [stats.lines || (record.source?.match(/\n/g) || []).length + 1, "lines"],
      [(graph.nodes || []).length, "graph nodes"],
      [(graph.edges || []).length, "structural edges"],
      [(graph.applications || []).length, "applications"],
      [(graph.worlds || []).length, "world facts"],
      [entities.length || null, "entities"],
    ];
    for (const [value,label] of statCells) {
      statgrid.appendChild(Idol.el("div", { class: "stat" }, Idol.el("div", { class: "n" }, String(value ?? "—")), Idol.el("div", { class: "l" }, label)));
    }
    detail.appendChild(statgrid);

    const tabs = Idol.el("div", { class: "tabs" },
      Idol.el("button", { class: "tab here", "data-tab": "read", type: "button" }, "read"),
      Idol.el("button", { class: "tab", "data-tab": "source", type: "button" }, "source"),
      Idol.el("button", { class: "tab", "data-tab": "graph", type: "button" }, "graph"),
      Idol.el("button", { class: "tab", "data-tab": "deps", type: "button" }, "deps"),
      published ? Idol.el("button", { class: "tab", "data-tab": "versions", type: "button" }, "versions") : null);
    detail.appendChild(tabs);

    const bodies = {};
    for (const bodyName of ["read","source","graph","deps","versions"]) {
      const body = Idol.el("section", { style: "flex:1;display:none;flex-direction:column;min-height:0;" });
      bodies[bodyName] = body;
      detail.appendChild(body);
    }
    bodies.read.style.display = "flex";
    tabs.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
      tabs.querySelectorAll(".tab").forEach((candidate) => candidate.classList.toggle("here", candidate === tab));
      for (const [key,body] of Object.entries(bodies)) body.style.display = key === tab.dataset.tab ? "flex" : "none";
      if (tab.dataset.tab === "graph") graphView?.fitIfFirst?.();
    }));

    bodies.read.style.overflow = "auto";
    const projectedRelations = Array.isArray(graph.relations) ? graph.relations : [];
    const relationNames = projectedRelations.map((relation) => typeof relation === "string" ? relation : relation?.name || relation?.id).filter(Boolean);
    bodies.read.appendChild(Idol.el("div", { class: "read-section" },
      Idol.el("h3", null, `compiler-published relation projection · ${relationNames.length}`),
      relationNames.length
        ? Idol.el("div", { class: "rel-chips" }, relationNames.slice(0,64).map((relation) => Idol.el("span", { class: "chip" }, relation)))
        : Idol.el("p", null, "No compiler-published relation list is present. This browser does not reconstruct one from node names or local kind tags.")));
    bodies.read.appendChild(Idol.el("div", { class: "read-section" },
      Idol.el("h3", null, "what this record is"),
      Idol.el("p", null, published
        ? "A registry projection of a published world record. Versioned source, exact graph facts, provenance, artifacts, and evidence remain attached; package coordinates remain provenance rather than semantic identity or authority."
        : "A source home used for reach and provenance. A home is not a world, subject, module, namespace, place, semantic identity, or authority grant.")));
    const usesMount = Idol.el("div", { class: "rel-chips" }, Idol.el("span", { class: "dim" }, "loading…"));
    bodies.read.appendChild(Idol.el("div", { class: "read-section" }, Idol.el("h3", null, "uses"), usesMount));
    Idol.api.get(`/api/lib/${encodeURIComponent(name)}/uses`).then((payload) => fillChips(usesMount,payload.uses || [],"no published dependencies")).catch(() => usesMount.replaceChildren());

    const editorMount = Idol.el("div", { style: "flex:1;display:flex;min-height:0;" });
    bodies.source.appendChild(editorMount);
    const editor = Idol.editor(editorMount, { source: record.source || "" });
    editor.ta.readOnly = true;
    editor.ta.style.caretColor = "transparent";
    const explorerBinding = Idol.explore(editor, {
      graph: record.graph,
      explain: record.explain,
      onReveal: () => tabs.querySelector('[data-tab="graph"]').click(),
      onLib: (value) => select(value),
    });
    explorerBinding.rebind();

    const graphMount = Idol.el("div", { style: "flex:1;min-height:0;" });
    bodies.graph.appendChild(graphMount);
    graphView = new GraphView(graphMount, {});
    graphView.setGraph(record.graph || {});

    bodies.deps.style.overflow = "auto";
    const usesList = Idol.el("div", { class: "list" });
    const dependentsList = Idol.el("div", { class: "list" });
    bodies.deps.appendChild(Idol.el("div", { class: "deps-cols" },
      Idol.el("div", null, Idol.el("h3", null, "uses"), usesList),
      Idol.el("div", null, Idol.el("h3", null, "used by"), dependentsList)));
    Idol.api.get(`/api/lib/${encodeURIComponent(name)}/uses`).then((payload) => fillDependencyList(usesList,payload.uses || [],"uses nothing")).catch(() => {});
    Idol.api.get(`/api/lib/${encodeURIComponent(name)}/dependents`).then((payload) => fillDependencyList(dependentsList,payload.dependents || [],"no dependents yet")).catch(() => {});

    if (published) {
      bodies.versions.style.overflow = "auto";
      const versions = Idol.el("div", { class: "list" }, Idol.el("div", { style: "padding:12px 16px" }, Idol.el("span", { class: "spin" })));
      bodies.versions.appendChild(versions);
      Idol.api.get(`/api/lib/${encodeURIComponent(name)}/versions`).then((payload) => {
        versions.replaceChildren();
        if (!(payload.versions || []).length) {
          versions.appendChild(Idol.el("div", { class: "empty" }, Idol.el("div", null, "no versions")));
          return;
        }
        for (const version of [...payload.versions].reverse()) {
          const row = Idol.el("div", { class: "vrow" },
            Idol.el("span", { class: "v" }, `v${version}`),
            version === record.version ? Idol.el("span", { class: "badge sig" }, "current") : null,
            Idol.el("span", { style: "flex:1" }));
          const view = Idol.el("button", { type: "button" }, "view");
          view.addEventListener("click", () => Idol.api.text(`/api/lib/${encodeURIComponent(name)}/version/${encodeURIComponent(version)}`).then((source) => {
            editor.setSource?.(source);
            if (!editor.setSource) { editor.ta.value = source; editor.ta.dispatchEvent(new Event("input")); }
            tabs.querySelector('[data-tab="source"]').click();
          }).catch((error) => Idol.toast(error.message,true)));
          const copy = Idol.el("button", { class: "ghost", type: "button" }, "copy");
          copy.addEventListener("click", () => Idol.api.text(`/api/lib/${encodeURIComponent(name)}/version/${encodeURIComponent(version)}`).then((source) => navigator.clipboard.writeText(source)).then(() => Idol.toast(`v${version} copied`)).catch((error) => Idol.toast(error.message,true)));
          row.append(view,copy);
          versions.appendChild(row);
        }
      }).catch(() => versions.replaceChildren());
    }
  }

  function fillChips(mount, names, emptyText) {
    mount.replaceChildren();
    if (!names.length) { mount.appendChild(Idol.el("span", { class: "dim" }, emptyText)); return; }
    for (const name of names) {
      const chip = Idol.el("button", { class: "chip", type: "button" }, name);
      chip.addEventListener("click", () => select(name));
      mount.appendChild(chip);
    }
  }

  function fillDependencyList(mount, names, emptyText) {
    mount.replaceChildren();
    if (!names.length) { mount.appendChild(Idol.el("div", { class: "empty" }, Idol.el("div", null, emptyText))); return; }
    for (const name of names) {
      const row = Idol.el("button", { class: "row", type: "button" }, Idol.el("div", { class: "grow" }, Idol.el("div", { class: "title" }, name)));
      row.addEventListener("click", () => select(name));
      mount.appendChild(row);
    }
  }

  function openInExplorer(source) {
    const encoded = btoa(unescape(encodeURIComponent(source || "")));
    window.open(`https://graph.idol.id/#${encoded}`, "_blank", "noopener");
  }

  function openInExplorerCurrent() {
    if (detailRecord) openInExplorer(detailRecord.record.source || "");
  }

  async function copyDeepLink(name) {
    const url = new URL("https://lib.idol.id/");
    if (set === "libs") url.searchParams.set("set", "homes");
    url.hash = encodeURIComponent(name);
    await navigator.clipboard.writeText(url.href);
    Idol.toast("registry link copied");
  }

  function publishDialog(name, source) {
    const dialog = document.createElement("dialog");
    dialog.innerHTML = `<form method="dialog"><h2>publish ${escapeHtml(name)} as a world record</h2><label>version<input name="version" value="0.1.0" required></label><label>summary<input name="summary" maxlength="200"></label><label>tags<input name="tags" placeholder="core, test"></label><label>write token<input name="token" type="password" autocomplete="off" required></label><div class="row-btns"><button value="cancel" class="ghost">cancel</button><button value="ok" class="primary">publish</button></div></form>`;
    document.body.appendChild(dialog);
    dialog.showModal();
    dialog.addEventListener("close", async () => {
      if (dialog.returnValue !== "ok") { dialog.remove(); return; }
      const values = new FormData(dialog.querySelector("form"));
      try {
        const response = await fetch("/api/publish", {
          method: "POST",
          headers: { "content-type": "application/json", authorization: `Bearer ${values.get("token")}` },
          body: JSON.stringify({
            name,
            version: values.get("version"),
            source,
            summary: values.get("summary"),
            meta: { publisher: "lib.idol.id", tags: String(values.get("tags") || "").split(",").map((tag) => tag.trim()).filter(Boolean) },
          }),
        });
        const body = await response.json();
        if (!response.ok || body.error) throw new Error(body.error || `publish failed (${response.status})`);
        Idol.toast(`published ${name} v${body.version}`);
        dialog.remove();
        setRecordKind("worlds");
      } catch (error) {
        Idol.toast(error.message,true);
        dialog.remove();
      }
    });
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g,(character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  }

  window.addEventListener("popstate", () => {
    const nextSet = new URLSearchParams(location.search).get("set") === "homes" ? "libs" : "worlds";
    if (nextSet !== set) { set = nextSet; load(); }
    const name = decodeURIComponent(location.hash.slice(1));
    if (name && name !== current) select(name,false); else if (!name) setMobileView("list");
  });

  IdolShell.crumbs([{ label: "registry" }, { label: set === "worlds" ? "published records" : "source homes" }]);
  document.querySelectorAll(".seg button").forEach((button) => button.classList.toggle("here", button.dataset.set === set));
  load();
})();
</script>
</body>
</html>
