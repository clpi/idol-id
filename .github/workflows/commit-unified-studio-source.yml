name: commit admitted unified Idol studio source

on:
  push:
    branches: [fix/unified-idol-studio-20260828]
    paths:
      - .github/workflows/commit-unified-studio-source.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/unified-idol-studio-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply the already-admitted non-workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('shared/studio-app.js')
          source = app.read_text().replace('const graphEmpty = q("#studio-graph-empty");\n', '')
          needle = '''const graphView = new GraphView(q("#studio-graph"), {
            onSelectNode(node) { select("node", node?.raw || node); },
            onSelectEdge(edge) { select("edge", edge?.raw || edge); },
          });
          '''
          replacement = needle + '''const graphEmpty = graphView.empty;
          graphEmpty.id = "studio-graph-empty";
          graphEmpty.classList.add("studio-graph-empty");
          graphEmpty.innerHTML = "No semantic graph is inferred in the browser.<br>Analyze source to request exact compiler-published identities and structural edges.";
          '''
          if 'const graphEmpty = graphView.empty;' not in source:
              if needle not in source:
                  raise SystemExit('Studio GraphView initialization boundary missing')
              source = source.replace(needle, replacement, 1)
          app.write_text(source)

          css = Path('shared/studio.css')
          source = css.read_text()
          source = source.replace(
              '  transform: translateX(102%);\n  transition: transform var(--idol-ease);',
              '  transform: translateY(7px);\n  opacity: 0;\n  visibility: hidden;\n  pointer-events: none;\n  transition: transform var(--idol-ease), opacity var(--idol-fast), visibility var(--idol-fast);',
              1,
          )
          source = source.replace(
              '.idol-drawer.open { transform: translateX(0); }',
              '.idol-drawer.open { transform: translateY(0); opacity: 1; visibility: visible; pointer-events: auto; }',
              1,
          )
          source = source.replace(
              '  .studio-facts { position: absolute; z-index: 30; top: 0; right: 0; bottom: 0; width: min(420px, 88vw); transform: translateX(102%); transition: transform var(--idol-ease); box-shadow: -20px 0 60px rgba(0,0,0,.46); }',
              '  .studio-facts { position: absolute; z-index: 30; top: 0; right: 0; bottom: 0; width: min(420px, 88vw); transform: translateY(7px); opacity: 0; visibility: hidden; pointer-events: none; transition: transform var(--idol-ease), opacity var(--idol-fast), visibility var(--idol-fast); box-shadow: -20px 0 60px rgba(0,0,0,.46); }',
              1,
          )
          source = source.replace(
              '  .studio-root[data-facts-open="true"] .studio-facts { transform: translateX(0); }',
              '  .studio-root[data-facts-open="true"] .studio-facts { transform: translateY(0); opacity: 1; visibility: visible; pointer-events: auto; }',
              1,
          )
          source = source.replace(
              '  .studio-root[data-studio-mode="projection"] .studio-projection { display: flex; transform: none; width: auto; box-shadow: none; }',
              '  .studio-root[data-studio-mode="projection"] .studio-projection { display: flex; transform: none; width: auto; box-shadow: none; opacity: 1; visibility: visible; pointer-events: auto; }',
              1,
          )
          css.write_text(source)

          smoke = Path('scripts/studio-browser-smoke.mjs')
          smoke.write_text(smoke.read_text().replace('.idol-brand-word', '.idol-brand span:last-child'))
          PY
          rm -rf .artifacts .wrangler-dry-run
      - name: Re-run the exact admitted verification
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx --yes wrangler@4.125.0 deploy --dry-run --outdir .wrangler-dry-run
          node scripts/browser-smoke.mjs
          node scripts/studio-browser-smoke.mjs
          node scripts/live-mcp-browser-smoke.mjs
          rm -rf .artifacts .wrangler-dry-run
      - name: Commit only non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "idol studio convergence"
          git config user.email "actions@idol.id"
          git add -A
          git commit -m "fix: close unified Studio browser and graph regressions"
          git push origin HEAD:fix/unified-idol-studio-20260828
