name: Hermes HA script census

on:
  push:
    branches: [ops/hermes-ha-control-20260828]
    paths:
      - .github/workflows/hermes-ha-script-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_BUNDLE: U2FsdGVkX195qP/xncpRb35AOtW6UYj7v2GnvTnljIJ4Y/TxyaFwm3B4aupBEar3PN+3Qq/VwMbKIEmUaV1eKg==
    steps:
      - name: Inspect watchdogs and startup contracts through MiniMax
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup(){
            set +e
            if [[ -n "${SID:-}" ]]; then
              curl -fsS --max-time 10 -b /tmp/cookies -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg sid "$SID" '{session_id:$sid}')" \
                "$BASE/api/session/delete" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/control.json /tmp/cookies /tmp/new.json /tmp/census.sh /tmp/upload.json /tmp/start.json /tmp/stream.log
          }
          trap cleanup EXIT

          export PASS="$(printf '%s' "idol-hermes-ha-control-v1${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')"
          printf '%s' "$CONTROL_BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS >/tmp/control.json
          WEBUI_PASSWORD="$(jq -er '.webui_password' /tmp/control.json)"; echo "::add-mask::$WEBUI_PASSWORD"
          BASE=https://hermes.idol.id
          curl -fsS --retry 3 --retry-all-errors --max-time 15 -c /tmp/cookies -b /tmp/cookies \
            -H 'Content-Type: application/json' --data "$(jq -nc --arg p "$WEBUI_PASSWORD" '{password:$p}')" \
            "$BASE/api/auth/login" >/dev/null
          curl -fsS --max-time 20 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data '{"model":"MiniMax-M2.7","model_provider":"minimax"}' "$BASE/api/session/new" >/tmp/new.json
          SID="$(jq -er '.session.session_id' /tmp/new.json)"
          WORKSPACE="$(jq -er '.session.workspace' /tmp/new.json)"

          cat >/tmp/census.sh <<'CENSUS'
          #!/usr/bin/env bash
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          safe_file(){
            file="$1"
            echo "--- FILE $file ---"
            if [[ ! -f "$file" ]]; then echo absent; return; fi
            stat -c 'mode=%a size=%s mtime=%y' "$file" 2>/dev/null || stat -f 'mode=%Lp size=%z mtime=%Sm' "$file" 2>/dev/null || true
            python3 - "$file" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          text=p.read_text(errors='replace')
          patterns=[
            r'sk-[A-Za-z0-9._-]{8,}', r'gh[pousr]_[A-Za-z0-9_]{8,}',
            r'github_pat_[A-Za-z0-9_]{8,}', r'cfat_[A-Za-z0-9_-]{8,}',
            r'xai-[A-Za-z0-9_-]{8,}', r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b',
            r'\beyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}(?:\.[A-Za-z0-9_-]{8,})?',
          ]
          for pat in patterns: text=re.sub(pat,'[secret]',text,flags=re.I)
          text=re.sub(r'(?im)^([A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|COOKIE)[A-Z0-9_]*)\s*=.*$',r'\1=[present]',text)
          text=re.sub(r'(--(?:token|api-key|password|secret)(?:=|\s+))\S+',r'\1[secret]',text,flags=re.I)
          print('\n'.join(text.splitlines()[:500]))
          PY
          }

          echo '=== PRIMARY SCRIPT CONTRACTS ==='
          for file in \
            /workspace/hermes-jobs/watchdog.sh \
            "$HOME/.hermes/bin/hermes-host-loopback.sh" \
            "$HOME/.openclaw/bin/openclaw-gateway-loopback.sh" \
            "$HOME/.openclaw/bin/openclaw-cloudflared.sh"
          do safe_file "$file"; done

          echo '=== PRIMARY PROCESS PARENTS ==='
          for pid in $(pgrep -f 'hermes gateway run|hermes-webui/server.py|openclaw-gateway|cloudflared.*tunnel run' 2>/dev/null || true); do
            echo "pid=$pid"
            ps -o pid=,ppid=,lstart=,args= -p "$pid" 2>/dev/null \
              | sed -E 's/(--token(=| +))[^ ]+/\1[secret]/Ig; s/sk-[A-Za-z0-9._-]{8,}/[secret]/Ig'
            parent="$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')"
            [[ -n "$parent" ]] && ps -o pid=,ppid=,lstart=,args= -p "$parent" 2>/dev/null || true
          done

          echo '=== PRIMARY HERMES MODEL CONFIG ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path.home()/'.hermes/config.yaml'
          if not p.is_file(): print('absent'); raise SystemExit
          text=p.read_text(errors='replace')
          for line in text.splitlines():
              low=line.lower()
              if any(x in low for x in ('api_key','api-key','token:','password:','secret:','cookie:')):
                  print(line.split(':',1)[0]+': [present]')
              elif any(x in low for x in ('model','provider','base_url','delegation','max_concurrent','fallback','auxiliary')):
                  print(line[:500])
          PY

          echo '=== PRIMARY OPENCLAW MODEL AND AGENT CONFIG ==='
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path.home()/'.openclaw/openclaw.json'
          if not p.is_file(): print('absent'); raise SystemExit
          data=json.loads(p.read_text())
          def clean(v,key=''):
              lk=str(key).lower()
              if any(x in lk for x in ('key','token','secret','password','cookie','credential')):
                  return '[present]' if v not in (None,'') else '[absent]'
              if isinstance(v,dict): return {k:clean(x,k) for k,x in v.items()}
              if isinstance(v,list): return [clean(x,key) for x in v]
              if isinstance(v,str) and len(v)>180: return f'[value length={len(v)}]'
              return v
          for key in ('models','agents','gateway','channels','cron','skills','tools'):
              if key in data:
                  value=clean(data[key],key)
                  text=repr(value)
                  print(f'{key}={text[:18000]}')
          PY

          echo '=== R16 SCRIPT AND USER-SERVICE CONTRACTS ==='
          cat >/tmp/r16-script-census.sh <<'REMOTE'
          set -uo pipefail
          safe_file(){
            file="$1"; echo "--- FILE $file ---"; [[ -f "$file" ]] || { echo absent; return; }
            stat -c 'mode=%a size=%s mtime=%y' "$file" 2>/dev/null || true
            python3 - "$file" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(errors='replace')
          for pat in (r'sk-[A-Za-z0-9._-]{8,}',r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b',r'(--(?:token|api-key|password|secret)(?:=|\s+))\S+'):
              text=re.sub(pat,'[secret]',text,flags=re.I)
          text=re.sub(r'(?im)^([A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|COOKIE)[A-Z0-9_]*)\s*=.*$',r'\1=[present]',text)
          print('\n'.join(text.splitlines()[:500]))
          PY
          }
          for file in \
            "$HOME/hermes-jobs/r16/watchdog.sh" \
            "$HOME/.cloudflared/REFUSE-HERMES-HOSTNAME" \
            "$HOME/.cloudflared/config.yml" \
            "$HOME/.cloudflared/config-r16.yml"
          do safe_file "$file"; done
          echo '--- systemctl user ---'
          systemctl --user is-system-running 2>&1 || true
          systemctl --user list-unit-files --no-pager 2>&1 | grep -Ei 'hermes|openclaw|cloudflared|idol' | head -n 100 || true
          systemctl --user list-units --all --no-pager 2>&1 | grep -Ei 'hermes|openclaw|cloudflared|idol' | head -n 100 || true
          loginctl show-user "$(id -un)" -p Linger -p State -p RuntimePath 2>&1 || true
          echo '--- process tree ---'
          for pid in $(pgrep -f 'hermes gateway run|hermes-webui/server.py|openclaw-gateway|cloudflared.*tunnel run|r16/watchdog.sh' 2>/dev/null || true); do
            ps -o pid=,ppid=,lstart=,args= -p "$pid" 2>/dev/null \
              | sed -E 's/(--token(=| +))[^ ]+/\1[secret]/Ig; s/sk-[A-Za-z0-9._-]{8,}/[secret]/Ig'
            parent="$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')"; [[ -n "$parent" ]] && ps -o pid=,ppid=,lstart=,args= -p "$parent" 2>/dev/null || true
          done
          echo '--- openclaw executable ---'
          pid="$(pgrep -f '^openclaw-gateway' | head -n1 || true)"
          if [[ -n "$pid" ]]; then
            readlink -f "/proc/$pid/exe" || true
            tr '\0' '\n' <"/proc/$pid/environ" 2>/dev/null | cut -d= -f1 | grep -E 'OPENCLAW|NODE|PATH|HOME|MINIMAX|TELEGRAM' | sort -u || true
          fi
          echo '--- telegram poller candidates ---'
          for pid in $(pgrep -f 'hermes.*gateway|gateway.*run|telegram' 2>/dev/null || true); do
            printf 'pid=%s env_names=' "$pid"
            tr '\0' '\n' <"/proc/$pid/environ" 2>/dev/null | cut -d= -f1 | grep -E 'TELEGRAM|HERMES|MINIMAX|NTFY' | sort -u | paste -sd, - || true
          done
          REMOTE
          timeout 60 tailscale ssh clp@r16 'bash -s' </tmp/r16-script-census.sh || true
          rm -f /tmp/r16-script-census.sh
          echo '=== SCRIPT_CENSUS_COMPLETE ==='
          CENSUS
          chmod 700 /tmp/census.sh

          curl -fsS --max-time 20 -b /tmp/cookies -F "session_id=$SID" \
            -F 'file=@/tmp/census.sh;filename=idol-ha-script-census.sh' "$BASE/api/upload" >/tmp/upload.json
          SCRIPT_PATH="$(jq -er '.path' /tmp/upload.json)"
          PROMPT="Use the terminal tool exactly once. Run exactly: bash '$SCRIPT_PATH'. Do not run any other command and return all stdout verbatim."
          curl -fsS --max-time 30 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sid "$SID" --arg m "$PROMPT" --arg ws "$WORKSPACE" '{session_id:$sid,message:$m,model:"MiniMax-M2.7",model_provider:"minimax",workspace:$ws}')" \
            "$BASE/api/chat/start" >/tmp/start.json
          STREAM_ID="$(jq -er '.stream_id' /tmp/start.json)"
          curl -fsS -N --max-time 360 -b /tmp/cookies \
            "$BASE/api/chat/stream?stream_id=$(printf '%s' "$STREAM_ID"|jq -sRr @uri)" >/tmp/stream.log &
          STREAM_PID=$!
          for _ in $(seq 1 360); do
            if ! kill -0 "$STREAM_PID" 2>/dev/null; then break; fi
            pending="$(curl -fsS --max-time 5 -b /tmp/cookies "$BASE/api/approval/pending?session_id=$(printf '%s' "$SID"|jq -sRr @uri)" 2>/dev/null || echo '{}')"
            command="$(printf '%s' "$pending"|jq -r '.pending.command // empty' 2>/dev/null || true)"
            if [[ -n "$command" ]]; then
              if [[ "$command" == "bash '$SCRIPT_PATH'" || "$command" == "bash $SCRIPT_PATH" ]]; then
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"once"}')" "$BASE/api/approval/respond" >/dev/null
              else
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"deny"}')" "$BASE/api/approval/respond" >/dev/null || true
                exit 1
              fi
            fi
            sleep 1
          done
          wait "$STREAM_PID" || true
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          parts=[]
          for line in Path('/tmp/stream.log').read_text(errors='replace').splitlines():
              if not line.startswith('data:'): continue
              try: e=json.loads(line[5:].strip())
              except Exception: continue
              if isinstance(e,dict):
                  for k in ('text','message','content'):
                      if isinstance(e.get(k),str): parts.append(e[k])
          out='\n'.join(parts)
          for pat in (r'sk-[A-Za-z0-9._-]{8,}',r'gh[pousr]_[A-Za-z0-9_]{8,}',r'cfat_[A-Za-z0-9_-]{8,}',r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b'):
              out=re.sub(pat,'[secret]',out,flags=re.I)
          print(out[-100000:])
          if 'SCRIPT_CENSUS_COMPLETE' not in out: raise SystemExit('marker missing')
          PY
