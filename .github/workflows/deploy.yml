name: deploy idol.id

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  IDOL_ACCESS_EMAIL: chris@pecunies.com
  IDOL_ACCESS_TEAM_NAME: idol-clpi

concurrency:
  group: idol-id-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Repository authority and transport security
        run: node --test test/repository-platform-errors.test.mjs test/repository-worker.test.mjs test/repository-transformation-worker.test.mjs
      - name: Test and build every surface
        id: full_check
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/idol-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Produce concise failure evidence
        if: steps.full_check.outputs.status != '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/idol-check.log').read_text(errors='replace')
          lines = source.splitlines()
          selected = []
          for index, line in enumerate(lines):
              if line.startswith('not ok '):
                  selected.extend(lines[index:index + 24])
              elif re.match(r'^# (?:tests|pass|fail|cancelled|skipped|todo) ', line):
                  selected.append(line)
          Path('/tmp/idol-check-summary.txt').write_text('\n'.join(selected) + '\n')
          print('\n'.join(selected))
          PY
      - name: Upload failed test evidence
        if: steps.full_check.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: idol-check-failure-${{ github.run_id }}
          path: |
            /tmp/idol-check.log
            /tmp/idol-check-summary.txt
          retention-days: 7
      - name: Enforce full check result
        if: steps.full_check.outputs.status != '0'
        run: exit 1
      - name: Validate Worker bundle
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Browser interaction and responsive semantic QA
        run: |
          node scripts/browser-smoke.mjs
          node scripts/studio-browser-smoke.mjs
          node scripts/live-mcp-browser-smoke.mjs
      - name: Upload browser interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idol-browser-smoke-${{ github.run_id }}
          path: |
            .artifacts/browser-smoke
            .artifacts/studio-browser-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: idol-preview-${{ github.run_id }}
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'missing CLOUDFLARE_API_TOKEN'; exit 2; }
      - name: Snapshot the public world projection
        env:
          IDOL_WORLD_SNAPSHOT_RETAIN: "1"
        run: node scripts/snapshot-worlds.mjs
      - name: Provision D1 and Platform plus Live Access identity boundaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/provision-platform.mjs
      - name: Provision Repository Observatory Access boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision-repository-access.mjs
      - name: Apply platform migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.125.0 d1 migrations apply PLATFORM_DB --remote --config .wrangler.production.jsonc
      - name: Build one immutable deployment
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build
      - name: Deploy root and every subdomain atomically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.125.0 deploy --config .wrangler.production.jsonc
      - name: Verify deployed authority and every configured host
        env:
          EXPECTED_WEB_COMMIT: ${{ github.sha }}
          IDOL_VERIFY_ATTEMPTS: 30
          IDOL_VERIFY_DELAY_MS: 4000
        run: node scripts/verify-production.mjs
      - name: Deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## idol.id deployed and converged
          One immutable Worker version serves root, www redirect, docs, lib, api, graph, worlds, platform, Live, hosted MCP, r8a, r8b and r16.

          Authority:
          - `/__idol/version`, `/__idol/health`, browser config, installers and runtime manifests project one immutable authority document
          - post-deploy verification checks the exact web commit, Idol authority, idol-native authority and source-law edition on every configured hostname
          - no Wasm artifact is admitted from path existence alone
          - Live owns collaboration truth only; semantic authority, dispatcher authority and world-authority grant remain false
          - world projection freshness is explicit: live snapshot when reachable, otherwise the checked-in snapshot is retained only after schema, source, revision and world validation

          Distribution:
          - curl -fsSL https://idol.id/install | sh
          - irm https://idol.id/install.ps1 | iex
          - exact pinned Zig bootstrap seed; self-hosted release remains false

          Live and hosted MCP:
          - live.idol.id is Cloudflare Access protected and subject-owned
          - one append-only causal history and one causally closed accepted frontier per project
          - relation identities remain operations; structural graph roles are derived
          - Universe View binding is a projection reference with authority grant none
          - mcp.idol.id/mcp is stateless Streamable HTTP authenticated by digest-only scoped Platform keys
          - mobile and desktop Chrome gates cover Live and MCP interactions without horizontal overflow

          Repository Observatory:
          - platform.idol.id/repo and /repo/{observation,scaffold,transformation}/:id are Access protected
          - public GitHub/GitLab/Bitbucket metadata and tree projections only
          - exact resolved revisions, D1 subject ownership and append-only audit
          - review-only scaffold/patch; no source content, provider credential or repository mutation
          - isolated derived-world transformation previews with exact selected delta and SHA-256
          - all execution, source-world mutation, repository write and world publication facts remain false
          - scoped API transport on api.idol.id/v1/repository/api/*

          Browser IDE and prior public worlds/foreign/platform routes remain in the same deployment.
          SUMMARY
