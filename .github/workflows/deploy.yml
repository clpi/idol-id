name: deploy idol.id

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  IDOL_ACCESS_EMAIL_DOMAIN: pecunies.com
  IDOL_ACCESS_TEAM_NAME: idol-clpi

concurrency:
  group: idol-id-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test and build every surface
        run: npm run check
      - name: Validate Worker bundle
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .wrangler-dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'missing CLOUDFLARE_API_TOKEN'; exit 2; }
      - name: Snapshot the public world projection
        run: node scripts/snapshot-worlds.mjs
      - name: Provision D1 and Access identity boundary
        id: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision-platform.mjs
      - name: Apply platform identity migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.125.0 d1 migrations apply PLATFORM_DB --remote --config .wrangler.production.jsonc
      - name: Build one immutable deployment
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build
      - name: Deploy root and every subdomain atomically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.125.0 deploy --config .wrangler.production.jsonc --var "IDOL_COMMIT:${GITHUB_SHA}" --var "IDOL_AUTHORITY:f33bb3773484e7d954a2975211e683dfa89edab5"
      - name: Deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## idol.id deployed
          One Worker version now serves:
          - idol.id
          - docs.idol.id
          - lib.idol.id
          - api.idol.id
          - graph.idol.id
          - worlds.idol.id
          - platform.idol.id
          - r8a.idol.id
          - r8b.idol.id
          - r16.idol.id

          Immutable public projections:
          - /runtime/worlds.json
          - /runtime/foreign.json

          Public foreign-world transport:
          - GET /v1/world/foreign
          - GET /v1/world/:slug/integration
          - POST /v1/world/import-plan (plan-only; no source access or execution)

          Platform identity/API access:
          - Cloudflare Access protects /v1/platform/browser/*
          - D1 stores profiles, digest-only API tokens, and append-only audit events
          - GET /v1/platform/status remains public
          - GET /v1/platform/api/whoami accepts scoped Idol bearer tokens
          - transport identity never grants an Idol world capability
          SUMMARY
