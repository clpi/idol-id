name: apply verified recovery

on:
  push:
    branches: [fix/repository-regression-closure-20260827]
    paths:
      - scripts/recovery-apply.py
      - .github/workflows/recovery-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idol-id-recovery-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/repository-regression-closure-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply connector-verified authority and regression recovery
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("idol_recovery", "scripts/recovery-apply.py")
          recovery = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(recovery)
          recovery.current_authorities = lambda: (
              "f1dfa2c36e1f495f97bd9282b3f93e4cbc812d99",
              "ad438a856daa8786e77ac9f033d38deb9e8f5c29",
              "155edf8e9204d00316dab8363676f0fd7b2fb552",
              "56ec285b3d320981711a190d8414c4f557bade4b",
              "95e70291b13062881ebc6c96005c5ad02230bf5b5a7e62ced4f6e8787ab4993b",
          )
          recovery.main()

          authority = Path("scripts/authority-lib.mjs")
          text = authority.read_text()
          text = text.replace(
              'async function jsonFetch(url,fetcher=fetch){const response=await fetcher(url,{headers:{accept:"application/vnd.github+json","user-agent":"idol-id-authority-gate"}});',
              'async function jsonFetch(url,fetcher=fetch){const headers={accept:"application/vnd.github+json","user-agent":"idol-id-authority-gate"};if(process.env.IDOL_AUTHORITY_READ_TOKEN)headers.authorization=`Bearer ${process.env.IDOL_AUTHORITY_READ_TOKEN}`;const response=await fetcher(url,{headers});',
          )
          authority.write_text(text)

          worker_test = Path("test/worker.test.mjs")
          text = worker_test.read_text()
          text = text.replace(
              '["/runtime/worlds.json", ["application/json", "{\\"schema\\":\\"idol.web.worlds.v1\\",\\"worlds\\":[]}"]],',
              '["/runtime/worlds.json", ["application/json", "{\\"schema\\":\\"idol.web.worlds.v1\\",\\"worlds\\":[]}"]],\n    ["/runtime/authority.json", ["application/json", "{\\"language\\":{\\"commit\\":\\"authority123\\",\\"source_law\\":{\\"sha256\\":\\"source-law123\\"}},\\"native\\":{\\"commit\\":\\"native123\\"}}"]],',
          )
          text = text.replace(
              'assert.equal(text, configSource(resolveHost("docs.idol.id"), "docs.idol.id", "abc123", "authority123"));',
              'assert.equal(text, configSource(resolveHost("docs.idol.id"), "docs.idol.id", "abc123", { language: { commit: "authority123", source_law: { sha256: "source-law123" } }, native: { commit: "native123" } }));',
          )
          worker_test.write_text(text)
          PY
      - name: Verify focused recovery contract
        run: node --test test/regression-closure.test.mjs
      - name: Run complete repository test and immutable build
        run: npm run check
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Refuse whitespace and patch corruption
        run: git diff --check
      - name: Commit only the verified non-workflow recovery
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry-run
          rm -f .github/workflows/authority-sync.yml
          git checkout -- .github/workflows
          grep -qxF '.wrangler-dry-run/' .gitignore || printf '\n.wrangler-dry-run/\n' >> .gitignore
          git config user.name idol-recovery-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: close authority and deployment regressions"
          git push origin HEAD:fix/repository-regression-closure-20260827
