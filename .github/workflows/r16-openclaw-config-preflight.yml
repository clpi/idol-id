name: r16 openclaw config preflight

on:
  push:
    branches: [ops/r16-agent-migration-20260828]
    paths:
      - .github/workflows/r16-openclaw-config-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  R16_TUNNEL_ID: f43607fc-f26b-4fdc-b3b0-85f1bfc006e1
  DEPLOY_KEY_ARTIFACT_ID: "9696748865"

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Open sealed migration bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/r16key
          python -m pip install -q cryptography
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$DEPLOY_KEY_ARTIFACT_ID/zip" -o /tmp/key.zip
          unzip -q /tmp/key.zip -d /tmp/r16key
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          p=json.loads(Path('/tmp/r16key/r16-deploy-private.enc.json').read_text())
          k=HKDF(algorithm=hashes.SHA256(),length=32,salt=base64.b64decode(p['salt']),info=p['info'].encode()).derive(os.environ['CLOUDFLARE_API_TOKEN'].encode())
          pem=AESGCM(k).decrypt(base64.b64decode(p['nonce']),base64.b64decode(p['ciphertext']),p['aad'].encode())
          private=serialization.load_pem_private_key(pem,password=None)
          e=json.loads(Path('ops/r16-provider-bundle.rsa.json').read_text())
          dk=private.decrypt(base64.b64decode(e['encrypted_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(dk).decrypt(base64.b64decode(e['nonce']),base64.b64decode(e['ciphertext']),e['aad'].encode())
          assert hashlib.sha256(plain).hexdigest()==e['payload_sha256']
          assert json.loads(plain)['marker']=='idol-r16-provider-migration-v2'
          Path('/tmp/r16-provider-bundle.json').write_bytes(plain)
          Path('/tmp/r16-provider-bundle.json').chmod(0o600)
          PY
          rm -rf /tmp/r16key /tmp/key.zip

      - name: Create temporary r16 OpenClaw route
        id: route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          r16="$account/cfd_tunnel/$R16_TUNNEL_ID"
          zone_id="$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=pecunies.com&status=active'|jq -er '.result[0].id')"
          dns_base="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          original="$(curl -fsS "${auth[@]}" "$r16/configurations"|jq -e '.result.config')"
          printf '%s' "$original" > /tmp/r16-original.json
          host="r16-occonfig-${RUN_ID}.pecunies.com"
          created="$(curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --arg name "$host" --arg content "$R16_TUNNEL_ID.cfargotunnel.com" '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')" "$dns_base")"
          jq -er '.result.id'<<<"$created" > /tmp/r16-dns-id
          cfg="$(jq --arg h "$host" '.ingress as $i|.ingress=(($i[0:-1])+[{hostname:$h,service:"http://localhost:18789"}]+[$i[-1]])'<<<"$original")"
          curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --argjson config "$cfg" '{config:$config}')" "$r16/configurations"|jq -e '.success==true'>/dev/null
          for _ in $(seq 1 45); do dig +short @1.1.1.1 "$host"|grep -q .&&break;sleep 2;done
          sleep 10
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Read live OpenClaw config and schema through supported CLI
        env:
          CLAW_HOST: ${{ steps.route.outputs.host }}
        shell: bash
        run: |
          set -euo pipefail
          npm install -g openclaw@latest >/dev/null
          token="$(jq -r '.openclaw_token' /tmp/r16-provider-bundle.json)"
          openclaw gateway probe --url "wss://$CLAW_HOST" --token "$token" --json > artifacts/openclaw-probe.json
          openclaw gateway call config.get --url "wss://$CLAW_HOST" --token "$token" --params '{}' --json > /tmp/openclaw-config.json
          openclaw gateway call config.schema --url "wss://$CLAW_HOST" --token "$token" --params '{}' --json > /tmp/openclaw-schema.json
          jq 'walk(if type=="object" then with_entries(if (.key|test("key|token|secret|password|credential|authorization";"i")) then .value="<redacted>" else . end) else . end)' /tmp/openclaw-config.json > artifacts/openclaw-config-redacted.json
          jq '{hash:(.hash//.baseHash//.result.hash//null),exists:(.exists//.result.exists//null),top:(.config//.result.config//{}|keys),providers:(.config.models.providers//.result.config.models.providers//{}|to_entries|map({id:.key,baseUrl:(.value.baseUrl//null),api:(.value.api//null),models:([.value.models[]?|{id:(.id//.name),name:(.name//null),reasoning:(.reasoning//null),input:(.input//null)}])})),defaults:(.config.agents.defaults//.result.config.agents.defaults//{}),channels:(.config.channels//.result.config.channels//{}|keys)}' /tmp/openclaw-config.json > artifacts/openclaw-config-summary.json
          jq '{providerSchema:(..|objects|select(has("models") and has("baseUrl") and has("apiKey"))|keys)|first,apiEnums:[..|objects|select(has("enum"))|.enum|select(any(.[]?; .=="openai-completions" or .=="anthropic-messages"))]|unique}' /tmp/openclaw-schema.json > artifacts/openclaw-model-schema-summary.json
          echo 'OpenClaw providers:'
          jq -r '.providers[]|[.id,.api,.baseUrl,(.models|length)]|@tsv' artifacts/openclaw-config-summary.json
          echo 'OpenClaw model defaults:'
          jq '.defaults.model // .defaults.models // .defaults' artifacts/openclaw-config-summary.json

      - name: Restore temporary route
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.route.outputs.zone_id }}
        shell: bash
        run: |
          set +e
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          if [ -s /tmp/r16-original.json ]; then curl -sS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --argjson config "$(cat /tmp/r16-original.json)" '{config:$config}')" "$account/cfd_tunnel/$R16_TUNNEL_ID/configurations" >/dev/null; fi
          if [ -s /tmp/r16-dns-id ] && [ -n "$ZONE_ID" ]; then curl -sS -X DELETE "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$(cat /tmp/r16-dns-id)" >/dev/null; fi
          rm -f /tmp/r16-provider-bundle.json /tmp/r16-original.json /tmp/r16-dns-id /tmp/openclaw-*.json

      - name: Upload redacted config evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-openclaw-config-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
