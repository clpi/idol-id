name: finalize compiler-first public reset

on:
  push:
    branches: [fix/compiler-first-public-reset-20260828]
    paths:
      - .github/workflows/finalize-public-reset.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: fix/compiler-first-public-reset-20260828
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/compiler-first-public-reset-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify exact branch
        shell: bash
        run: |
          npm run check
          node scripts/browser-smoke.mjs
          node scripts/public-browser-smoke.mjs
      - name: Upload pre-merge browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiler-first-public-reset-final-${{ github.run_id }}
          path: |
            .artifacts/browser-smoke
            .artifacts/public-browser-smoke
          retention-days: 30
      - name: Remove bootstrap-only automation and noise
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-public-reset.yml \
            .github/workflows/public-reset-admission.yml \
            .github/workflows/finalize-public-reset.yml \
            ops/public-reset-trigger.txt \
            ops/public-reset-pr-ready.txt \
            ops/public-reset-checkpoint.txt \
            ops/public-reset-final-trigger.txt \
            ops/public-reset-no-consultation.txt
          git config user.name "idol public reset"
          git config user.email "actions@idol.id"
          git add -A
          git commit -m 'chore: remove reset bootstrap automation' || true
          git push origin HEAD:${BRANCH}
      - name: Merge the admitted reset
        id: merge
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --admin \
            --subject 'fix: reset idol.id around the actual compiler' \
            --body 'Compiler-first public product, exact compiler examples, stable-asset revalidation, responsive shared chrome, and real-browser admission.'
          MERGE_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$MERGE_SHA"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
      - name: Wait for production deployment
        id: production
        shell: bash
        run: |
          target='${{ steps.merge.outputs.sha }}'
          run_id=''
          for _ in $(seq 1 90); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'deploy idol.id' --branch main --limit 10 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'"$target"'") | [.databaseId,.status,(.conclusion // "")] | @tsv' | head -n1)"
            if [[ -n "$row" ]]; then
              run_id="$(cut -f1 <<<"$row")"
              status="$(cut -f2 <<<"$row")"
              conclusion="$(cut -f3 <<<"$row")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]]
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Verify the public product and cache identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/production
          curl -fsS --retry 8 --retry-all-errors --max-time 20 https://idol.id/ -o .artifacts/production/index.html
          curl -fsS --retry 8 --retry-all-errors --max-time 20 -D .artifacts/production/shell.headers https://idol.id/shared/shell.js -o .artifacts/production/shell.js
          curl -fsS --retry 8 --retry-all-errors --max-time 20 -D .artifacts/production/site.headers https://idol.id/shared/site.css -o .artifacts/production/site.css
          curl -fsS --retry 8 --retry-all-errors --max-time 20 https://idol.id/__idol/version -o .artifacts/production/version.json
          curl -fsS --retry 8 --retry-all-errors --max-time 20 https://idol.id/install.sh -o /dev/null
          curl -fsS --retry 8 --retry-all-errors --max-time 20 https://idol.id/install.ps1 -o /dev/null
          grep -q 'Dynamic by default' .artifacts/production/index.html
          ! grep -Eiq '\b(Idsem|Duo|Duon)\b' .artifacts/production/index.html .artifacts/production/shell.js
          grep -Eiq '^cache-control:.*no-cache' .artifacts/production/shell.headers
          grep -Eiq '^cache-control:.*no-cache' .artifacts/production/site.headers
          jq -e --arg sha '${{ steps.merge.outputs.sha }}' '.commit == $sha' .artifacts/production/version.json
          cat > .artifacts/production/admission.json <<JSON
          {
            "schema": "idol.public.production.admission.v1",
            "pull_request": ${{ steps.merge.outputs.pr }},
            "commit": "${{ steps.merge.outputs.sha }}",
            "deploy_run": "${{ steps.production.outputs.run_id }}",
            "homepage": "passed",
            "identity": "passed",
            "stable_asset_revalidation": "passed",
            "installers": "passed"
          }
          JSON
      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiler-first-production-${{ github.run_id }}
          path: .artifacts/production
          retention-days: 30
