name: Hermes HA protected credential presence

on:
  push:
    branches: [ops/hermes-ha-control-20260828]
    paths:
      - .github/workflows/hermes-ha-secret-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERMES_WEBUI_PASSWORD: ${{ secrets.HERMES_WEBUI_PASSWORD }}
      HERMES_PASSWORD: ${{ secrets.HERMES_PASSWORD }}
      OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      R16_SSH_PASSWORD: ${{ secrets.R16_SSH_PASSWORD }}
      R16_PASSWORD: ${{ secrets.R16_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      R16_SSH_PRIVATE_KEY: ${{ secrets.R16_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
    steps:
      - name: Print names and presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN HERMES_WEBUI_PASSWORD HERMES_PASSWORD \
            OPENCLAW_TOKEN MINIMAX_API_KEY R16_SSH_PASSWORD R16_PASSWORD \
            SSH_PASSWORD R16_SSH_PRIVATE_KEY SSH_PRIVATE_KEY TAILSCALE_AUTHKEY \
            TS_AUTHKEY TAILSCALE_OAUTH_CLIENT_ID TAILSCALE_OAUTH_SECRET
          do
            if [[ -n "${!name:-}" ]]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=absent\n' "$name"
            fi
          done
