name: finalize compiler-first public reset v2

on:
  push:
    branches: [fix/compiler-first-public-reset-20260828]
    paths:
      - .github/workflows/finalize-public-reset-v2.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: fix/compiler-first-public-reset-20260828
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/compiler-first-public-reset-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run all repository and real-browser gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/finalize-v2
          npm run check 2>&1 | tee .artifacts/finalize-v2/check.log
          node scripts/browser-smoke.mjs 2>&1 | tee .artifacts/finalize-v2/semantic-browser.log
          node scripts/public-browser-smoke.mjs 2>&1 | tee .artifacts/finalize-v2/public-browser.log
      - name: Upload final pre-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-first-final-v2-${{ github.run_id }}
          path: |
            .artifacts/finalize-v2
            .artifacts/browser-smoke
            .artifacts/public-browser-smoke
          retention-days: 30
      - name: Remove bootstrap-only automation and status debris
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-public-reset.yml \
            .github/workflows/public-reset-admission.yml \
            .github/workflows/finalize-public-reset.yml \
            .github/workflows/apply-public-reset-v2.yml \
            .github/workflows/finalize-public-reset-v2.yml
          find ops -maxdepth 1 -type f -name 'public-reset-*' -delete 2>/dev/null || true
          git config user.name "idol public reset"
          git config user.email "actions@idol.id"
          git add -A
          git commit -m 'chore: remove public reset bootstrap automation' || true
          git push origin HEAD:${BRANCH}
      - name: Merge admitted branch
        id: merge
        shell: bash
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --admin \
            --subject 'fix: reset idol.id around the actual compiler' \
            --body 'Readable compiler-first public product, exact compiler evidence, stable-asset revalidation, responsive shared chrome, and real-browser admission.'
          sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$sha"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Await exact main deployment
        id: deploy
        shell: bash
        run: |
          target='${{ steps.merge.outputs.sha }}'
          run_id=''
          for _ in $(seq 1 120); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'deploy idol.id' --branch main --limit 20 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'"$target"'") | [.databaseId,.status,(.conclusion // "")] | @tsv' | head -n1)"
            if [[ -n "$row" ]]; then
              run_id="$(cut -f1 <<<"$row")"
              status="$(cut -f2 <<<"$row")"
              conclusion="$(cut -f3 <<<"$row")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]]
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Verify live product bytes and cache behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/production-v2
          curl -fsS --retry 10 --retry-all-errors --max-time 20 https://idol.id/ -o .artifacts/production-v2/index.html
          curl -fsS --retry 10 --retry-all-errors --max-time 20 -D .artifacts/production-v2/shell.headers https://idol.id/shared/shell.js -o .artifacts/production-v2/shell.js
          curl -fsS --retry 10 --retry-all-errors --max-time 20 -D .artifacts/production-v2/site.headers https://idol.id/shared/site.css -o .artifacts/production-v2/site.css
          curl -fsS --retry 10 --retry-all-errors --max-time 20 https://idol.id/__idol/version -o .artifacts/production-v2/version.json
          curl -fsS --retry 10 --retry-all-errors --max-time 20 https://idol.id/install.sh -o /dev/null
          curl -fsS --retry 10 --retry-all-errors --max-time 20 https://idol.id/install.ps1 -o /dev/null
          grep -q 'Dynamic by default' .artifacts/production-v2/index.html
          ! grep -Eiq '\b(Idsem|Duo|Duon)\b' .artifacts/production-v2/index.html .artifacts/production-v2/shell.js
          grep -Eiq '^cache-control:.*no-cache' .artifacts/production-v2/shell.headers
          grep -Eiq '^cache-control:.*no-cache' .artifacts/production-v2/site.headers
          jq -e --arg sha '${{ steps.merge.outputs.sha }}' '.commit == $sha' .artifacts/production-v2/version.json
          cat > .artifacts/production-v2/admission.json <<JSON
          {"schema":"idol.public.production.admission.v2","pull_request":${{ steps.merge.outputs.pr }},"commit":"${{ steps.merge.outputs.sha }}","deploy_run":"${{ steps.deploy.outputs.run_id }}","result":"ADMITTED"}
          JSON
      - name: Upload production admission
        uses: actions/upload-artifact@v4
        with:
          name: compiler-first-production-v2-${{ github.run_id }}
          path: .artifacts/production-v2
          retention-days: 30
