name: r16 secret capability audit

on:
  push:
    branches: [ops/r16-agent-migration-20260828]
    paths:
      - .github/workflows/r16-secret-capability-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      R16_SSH_PRIVATE_KEY: ${{ secrets.R16_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      R16_SSH_KEY: ${{ secrets.R16_SSH_KEY }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      R16_SSH_PASSWORD: ${{ secrets.R16_SSH_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      R16_PASSWORD: ${{ secrets.R16_PASSWORD }}
      HERMES_PASSWORD: ${{ secrets.HERMES_PASSWORD }}
      HERMES_WEBUI_PASSWORD: ${{ secrets.HERMES_WEBUI_PASSWORD }}
      OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
      OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
      CLAW_TOKEN: ${{ secrets.CLAW_TOKEN }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      NANOGPT_API_KEY: ${{ secrets.NANOGPT_API_KEY }}
      NANO_GPT_API_KEY: ${{ secrets.NANO_GPT_API_KEY }}
      SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Report encrypted capability presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(
            R16_SSH_PRIVATE_KEY SSH_PRIVATE_KEY DEPLOY_SSH_PRIVATE_KEY R16_SSH_KEY SSH_KEY DEPLOY_KEY
            R16_SSH_PASSWORD SSH_PASSWORD R16_PASSWORD HERMES_PASSWORD HERMES_WEBUI_PASSWORD
            OPENCLAW_GATEWAY_TOKEN OPENCLAW_TOKEN CLAW_TOKEN
            MINIMAX_API_KEY NANOGPT_API_KEY NANO_GPT_API_KEY SYNTHETIC_API_KEY
            OPENROUTER_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY XAI_API_KEY
            DEEPSEEK_API_KEY ZAI_API_KEY DASHSCOPE_API_KEY ALIBABA_API_KEY OLLAMA_API_KEY
          )
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
            fi
          done
