name: finalize exhaustive public surface admission

on:
  push:
    branches: [fix/public-surface-admission-v2-20260828]
    paths:
      - .github/workflows/finalize-public-surface-admission.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: fix/public-surface-admission-v2-20260828
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/public-surface-admission-v2-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Merge latest main and remove reset-only automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "idol public admission"
          git config user.email "actions@idol.id"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f \
            .github/workflows/apply-public-reset.yml \
            .github/workflows/public-reset-admission.yml \
            .github/workflows/finalize-public-reset.yml \
            .github/workflows/apply-public-reset-v2.yml \
            .github/workflows/finalize-public-reset-v2.yml \
            .github/workflows/patch-public-smoke-race.yml \
            .github/workflows/patch-public-mobile-overflow.yml \
            .github/workflows/finalize-public-reset-v3.yml \
            .github/workflows/patch-observatory-example-schema.yml \
            .github/workflows/finalize-public-reset-v4.yml \
            .github/workflows/patch-example-schema-everywhere.yml \
            .github/workflows/finalize-public-reset-v5.yml \
            .github/workflows/autofix-and-finalize-public-reset.yml
          find ops -maxdepth 1 -type f -name 'public-reset-*' -delete 2>/dev/null || true
          git add -A
          git commit -m 'chore: isolate permanent public surface admission' || true
          git push origin HEAD:${BRANCH}
      - name: Verify repository and pre-deploy browser contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/public-surface-final
          npm run check 2>&1 | tee .artifacts/public-surface-final/check.log
          node scripts/browser-smoke.mjs 2>&1 | tee .artifacts/public-surface-final/semantic-browser.log
          node scripts/public-browser-smoke.mjs 2>&1 | tee .artifacts/public-surface-final/public-browser.log
      - name: Upload pre-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-predeploy-${{ github.run_id }}
          path: |
            .artifacts/public-surface-final
            .artifacts/browser-smoke
            .artifacts/public-browser-smoke
          retention-days: 30
      - name: Remove finalizer from admitted tree
        shell: bash
        run: |
          rm -f .github/workflows/finalize-public-surface-admission.yml
          git add -A
          git commit -m 'chore: remove public surface bootstrap finalizer'
          git push origin HEAD:${BRANCH}
      - name: Create or reuse PR and merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo "pr=0" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -z "$pr" ]]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title 'test: continuously admit every public idol.id surface' --body 'Adds real-Chrome mobile and desktop admission for every intended non-agent public surface, runs after every successful deployment and daily, and retains screenshots and exact failures.')"
            pr="${url##*/}"
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --admin --subject 'test: continuously admit every public idol.id surface' --body 'Permanent post-deploy Chrome audit, transport checks, identity checks, overflow checks, touch-target checks, and screenshots for all non-agent surfaces.' || gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash
          sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$sha"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for exact deployment
        id: deploy
        shell: bash
        run: |
          target='${{ steps.merge.outputs.sha }}'; run_id=''
          for _ in $(seq 1 180); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'deploy idol.id' --branch main --limit 25 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'"$target"'") | [.databaseId,.status,(.conclusion // "")] | @tsv' | head -n1)"
            if [[ -n "$row" ]]; then
              run_id="$(cut -f1 <<<"$row")"; status="$(cut -f2 <<<"$row")"; conclusion="$(cut -f3 <<<"$row")"
              if [[ "$status" == completed ]]; then [[ "$conclusion" == success ]]; break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Run exhaustive live audit
        shell: bash
        run: node scripts/audit-live-surfaces.mjs
      - name: Upload exhaustive live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-live-${{ github.run_id }}
          path: .artifacts/live-surfaces
          retention-days: 30
