name: r16 authenticated config audit v2

on:
  push:
    branches: [ops/r16-agent-migration-20260828]
    paths:
      - .github/workflows/r16-authenticated-config-audit-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  R16_TUNNEL_ID: f43607fc-f26b-4fdc-b3b0-85f1bfc006e1
  DEPLOY_KEY_ARTIFACT_ID: "9696748865"

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Open sealed migration bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/r16key
          python -m pip install -q cryptography
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$DEPLOY_KEY_ARTIFACT_ID/zip" -o /tmp/key.zip
          unzip -q /tmp/key.zip -d /tmp/r16key
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          p=json.loads(Path('/tmp/r16key/r16-deploy-private.enc.json').read_text())
          k=HKDF(algorithm=hashes.SHA256(),length=32,salt=base64.b64decode(p['salt']),info=p['info'].encode()).derive(os.environ['CLOUDFLARE_API_TOKEN'].encode())
          pem=AESGCM(k).decrypt(base64.b64decode(p['nonce']),base64.b64decode(p['ciphertext']),p['aad'].encode())
          private=serialization.load_pem_private_key(pem,password=None)
          e=json.loads(Path('ops/r16-provider-bundle.rsa.json').read_text())
          dk=private.decrypt(base64.b64decode(e['encrypted_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(dk).decrypt(base64.b64decode(e['nonce']),base64.b64decode(e['ciphertext']),e['aad'].encode())
          assert hashlib.sha256(plain).hexdigest()==e['payload_sha256']
          assert json.loads(plain)['marker']=='idol-r16-provider-migration-v2'
          Path('/tmp/r16-provider-bundle.json').write_bytes(plain)
          Path('/tmp/r16-provider-bundle.json').chmod(0o600)
          PY
          rm -rf /tmp/r16key /tmp/key.zip

      - name: Audit authenticated config surfaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          npm install -g openclaw@latest >/dev/null
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          r16="$account/cfd_tunnel/$R16_TUNNEL_ID"
          zone_id="$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=pecunies.com&status=active'|jq -er '.result[0].id')"
          dns_base="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          original="$(curl -fsS "${auth[@]}" "$r16/configurations"|jq -e '.result.config')"
          host="r16-auth2-${RUN_ID}.pecunies.com"
          dns_id=''
          cleanup(){ set +e; rm -f /tmp/r16-provider-bundle.json /tmp/hermes.cookies /tmp/hermes-*.json; curl -sS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --argjson config "$original" '{config:$config}')" "$r16/configurations" >/dev/null; [ -z "$dns_id" ] || curl -sS -X DELETE "${auth[@]}" "$dns_base/$dns_id" >/dev/null; }
          trap cleanup EXIT
          created="$(curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --arg name "$host" --arg content "$R16_TUNNEL_ID.cfargotunnel.com" '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')" "$dns_base")"
          dns_id="$(jq -er '.result.id'<<<"$created")"
          for _ in $(seq 1 45); do dig +short @1.1.1.1 "$host"|grep -q .&&break;sleep 2;done
          route(){ cfg="$(jq --arg h "$host" --arg s "$1" '.ingress as $i|.ingress=(($i[0:-1])+[{hostname:$h,service:$s}]+[$i[-1]])'<<<"$original")"; curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --argjson config "$cfg" '{config:$config}')" "$r16/configurations"|jq -e '.success==true'>/dev/null; sleep 10; }

          route http://localhost:8787
          password="$(jq -r '.hermes_password' /tmp/r16-provider-bundle.json)"
          curl -fsS -c /tmp/hermes.cookies -H 'Content-Type: application/json' --data "$(jq -nc --arg password "$password" '{password:$password}')" "https://$host/api/auth/login"|jq -e '.ok==true'>/dev/null
          : > artifacts/hermes-endpoints.tsv
          for path in /api/env /api/config /api/model/info /api/model/options /api/model/set; do
            code="$(curl -sS -b /tmp/hermes.cookies -o "/tmp/hermes-${path//\//_}.json" -w '%{http_code}' "https://$host$path")"
            allow="$(curl -sS -b /tmp/hermes.cookies -X OPTIONS -D - -o /dev/null "https://$host$path"|awk 'BEGIN{IGNORECASE=1}/^allow:/{sub(/\r$/,"");print substr($0,8)}')"
            printf '%s\tget=%s\tallow=%s\n' "$path" "$code" "$allow"|tee -a artifacts/hermes-endpoints.tsv
          done
          test "$(awk -F'\t' '$1=="/api/env"{sub("get=","",$2);print $2}' artifacts/hermes-endpoints.tsv)" = 200
          cp /tmp/hermes-_api_env.json /tmp/hermes-env.json
          jq 'def setflag: if type=="object" then (.is_set//.set//.configured//false) else ((tostring|length)>0) end; if type=="object" and has("variables") then .variables elif type=="object" and has("env") then .env else . end | to_entries | map({name:.key,is_set:(.value|setflag),fields:(if (.value|type)=="object" then (.value|keys) else [] end)})|sort_by(.name)' /tmp/hermes-env.json > artifacts/hermes-env-inventory.json
          for f in /tmp/hermes-_api_config.json /tmp/hermes-_api_model_info.json /tmp/hermes-_api_model_options.json; do
            [ -s "$f" ] || continue
            name="$(basename "$f" .json)"
            jq 'walk(if type=="object" then with_entries(if (.key|test("key|token|secret|password|credential|value";"i")) then .value="<redacted>" else . end) else . end)' "$f" > "artifacts/$name-redacted.json" 2>/dev/null || true
          done
          echo "Hermes configured entries: $(jq '[.[]|select(.is_set)]|length' artifacts/hermes-env-inventory.json)"

          route http://localhost:18789
          token="$(jq -r '.openclaw_token' /tmp/r16-provider-bundle.json)"
          openclaw gateway probe --url "wss://$host" --token "$token" --json > artifacts/openclaw-probe.json
          openclaw gateway call config.get --url "wss://$host" --token "$token" --params '{}' --json > artifacts/openclaw-config-redacted.json
          jq '{ok,capability,targets:[.targets[]?|{id,connect,auth}]}' artifacts/openclaw-probe.json > artifacts/openclaw-probe-summary.json
          jq '[..|objects|select(has("providers"))|.providers|if type=="object" then keys else [] end]|add//[]|unique' artifacts/openclaw-config-redacted.json > artifacts/openclaw-provider-ids.json
          echo "OpenClaw provider IDs: $(jq length artifacts/openclaw-provider-ids.json)"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-authenticated-config-v2-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
