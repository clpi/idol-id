name: Hermes bootstrap discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  R16_TUNNEL_ID: f43607fc-f26b-4fdc-b3b0-85f1bfc006e1
  DIRECT_HOST: f43607fc-f26b-4fdc-b3b0-85f1bfc006e1.cfargotunnel.com

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Probe permanent tunnel SSH ingress without Access application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          tbase="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$R16_TUNNEL_ID"
          mgmt="$(curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data '{"resources":["logs"]}' "$tbase/management" | jq -r '.result')"
          curl -LfsS https://github.com/cloudflare/cloudflared/releases/download/2026.5.2/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          getent ahosts "$DIRECT_HOST" | head -n 4 || true
          timeout 20 /tmp/cloudflared tail --token "$mgmt" --output=json --level debug "$R16_TUNNEL_ID" >/tmp/tail.log 2>/tmp/tail.err & tailpid=$!
          sleep 3
          /tmp/cloudflared access tcp --hostname "$DIRECT_HOST" --url 127.0.0.1:2222 >/tmp/tcp.log 2>&1 & proxypid=$!
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && break; sleep .5; done
          echo '--- SSH protocol ---'
          set +e
          out="$(ssh -vv -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ConnectTimeout=8 clp@127.0.0.1 true 2>&1)"; rc=$?
          set -e
          echo "$out" | grep -E 'Remote protocol version|Server host key|Authentications that can continue|Permission denied|Connection closed|Connection timed out|refused|banner|kex_exchange' | tail -n 100 || true
          echo "SSH_PROBE_RC=$rc"
          kill "$proxypid" 2>/dev/null || true; sleep 2; kill "$tailpid" 2>/dev/null || true; wait "$tailpid" 2>/dev/null || true
          echo '--- tcp proxy ---'; tail -n 80 /tmp/tcp.log || true
          echo '--- connector origin evidence ---'; cat /tmp/tail.log /tmp/tail.err 2>/dev/null | grep -Ei 'localhost:22|tcp|origin|dial|refused|connect|error|cfargotunnel' | tail -n 150 || true
