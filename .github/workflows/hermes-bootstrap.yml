name: Hermes bootstrap discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  SSH_HOST: ssh-r16.idol.id

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect Cloudflare Access capability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          echo '--- Access applications ---'
          apps="$(curl -sS "${auth[@]}" "$base/access/apps?per_page=100")"
          echo "$apps" | jq -c '{success,errors,result:[.result[]? | {id,name,domain,type,session_duration}]}'
          echo '--- Service token API capability ---'
          toks="$(curl -sS "${auth[@]}" "$base/access/service_tokens?per_page=100")"
          echo "$toks" | jq -c '{success,errors,count:(.result|length? // 0),names:[.result[]?.name]}'

      - name: Confirm r16 public SSH route still resolves
        shell: bash
        run: |
          set -euo pipefail
          getent ahosts "$SSH_HOST" | head
