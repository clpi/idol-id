name: Hermes bootstrap discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inventory live r16 tunnel ingress and connector state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          tunnels="$(curl -fsS "${auth[@]}" "$base/cfd_tunnel?is_deleted=false&per_page=100")"
          while IFS=$'\t' read -r id name status; do
            cfg="$(curl -fsS "${auth[@]}" "$base/cfd_tunnel/$id/configurations" 2>/dev/null || true)"
            if [ -n "$cfg" ] && echo "$cfg" | jq -e '.. | strings | select(. == "r16.idol.id")' >/dev/null 2>&1; then
              echo "TUNNEL id=$id name=$name status=$status"
              echo "$cfg" | jq -c '.result.config.ingress | map({hostname:(.hostname // null),service})'
              echo 'CONNECTIONS:'
              curl -fsS "${auth[@]}" "$base/cfd_tunnel/$id/connections" | jq -c '{success,result:[.result[]? | {colo_name,id,is_pending_reconnect,origin_ip,opened_at,client_version}]}'
            fi
          done < <(echo "$tunnels" | jq -r '.result[] | [.id,.name,.status] | @tsv')
