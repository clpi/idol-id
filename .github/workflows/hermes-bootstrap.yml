name: Hermes bootstrap discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  R16_ACCESS_APP: e5373039-3d29-4dd4-9c92-65aeba364ce6

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect r16 Access application and policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          echo '--- app ---'
          curl -fsS "${auth[@]}" "$base/access/apps/$R16_ACCESS_APP" | jq -c '{success,errors,result:(.result|{id,name,domain,type,aud,session_duration,app_launcher_visible,allowed_idps,auto_redirect_to_identity,enable_binding_cookie,http_only_cookie,same_site_cookie})}'
          echo '--- policies ---'
          curl -fsS "${auth[@]}" "$base/access/apps/$R16_ACCESS_APP/policies?per_page=100" | jq -c '{success,errors,result:[.result[]? | {id,name,decision,precedence,include,require,exclude}]}'
          echo '--- app CA ---'
          ca="$(curl -sS "${auth[@]}" "$base/access/apps/$R16_ACCESS_APP/ca")"
          echo "$ca" | jq -c '{success,errors,result:(if .result then {id:.result.id,aud:.result.aud,public_key_present:(.result.public_key|length>0)} else null end)}'
          echo '--- all Access CAs ---'
          curl -fsS "${auth[@]}" "$base/access/apps/ca?per_page=100" | jq -c '{success,errors,result:[.result[]? | {id,aud,public_key_present:(.public_key|length>0)}]}'
