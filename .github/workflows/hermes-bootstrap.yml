name: Hermes bootstrap discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 08a6895467d13bf4c4eed99de43e4af5
  R16_TUNNEL_ID: f43607fc-f26b-4fdc-b3b0-85f1bfc006e1

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect r16 connector metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$R16_TUNNEL_ID"
          echo '--- tunnel ---'
          curl -fsS "${auth[@]}" "$base" | jq -c '.result | del(.credentials_file,.token)'
          echo '--- configuration ---'
          curl -fsS "${auth[@]}" "$base/configurations" | jq -c '.result.config'
          echo '--- connections full ---'
          curl -fsS "${auth[@]}" "$base/connections" | jq -c '.'
