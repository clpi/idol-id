name: Hermes live HA census

on:
  push:
    branches: [ops/hermes-ha-control-20260828]
    paths:
      - .github/workflows/hermes-ha-live-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_BUNDLE: U2FsdGVkX195qP/xncpRb35AOtW6UYj7v2GnvTnljIJ4Y/TxyaFwm3B4aupBEar3PN+3Qq/VwMbKIEmUaV1eKg==
    steps:
      - name: Run exact read-only HA census through MiniMax
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup(){
            set +e
            if [[ -n "${SID:-}" ]]; then
              curl -fsS --max-time 10 -b /tmp/cookies -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg sid "$SID" '{session_id:$sid}')" \
                "$BASE/api/session/delete" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/control.json /tmp/cookies /tmp/login.json /tmp/new.json \
              /tmp/census.sh /tmp/upload.json /tmp/start.json /tmp/stream.log
          }
          trap cleanup EXIT

          export PASS="$(printf '%s' "idol-hermes-ha-control-v1${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')"
          printf '%s' "$CONTROL_BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS >/tmp/control.json
          WEBUI_PASSWORD="$(jq -er '.webui_password' /tmp/control.json)"; echo "::add-mask::$WEBUI_PASSWORD"
          BASE=https://hermes.idol.id
          curl -fsS --retry 3 --retry-all-errors --max-time 15 \
            -c /tmp/cookies -b /tmp/cookies -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg p "$WEBUI_PASSWORD" '{password:$p}')" "$BASE/api/auth/login" >/tmp/login.json
          jq -e '.ok == true' /tmp/login.json >/dev/null
          curl -fsS --max-time 20 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data '{"model":"MiniMax-M2.7","model_provider":"minimax"}' "$BASE/api/session/new" >/tmp/new.json
          SID="$(jq -er '.session.session_id' /tmp/new.json)"
          WORKSPACE="$(jq -er '.session.workspace' /tmp/new.json)"

          cat >/tmp/census.sh <<'CENSUS'
          #!/usr/bin/env bash
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          redact(){
            python3 -c '
          import re,sys
          text=sys.stdin.read()
          pats=[r"sk-[A-Za-z0-9._-]{8,}",r"gh[pousr]_[A-Za-z0-9_]{8,}",r"github_pat_[A-Za-z0-9_]{8,}",r"cfat_[A-Za-z0-9_-]{8,}",r"xai-[A-Za-z0-9_-]{8,}",r"Bearer\s+[A-Za-z0-9._-]{8,}",r"\b\d{7,}:[A-Za-z0-9_-]{20,}\b",r"\beyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}(?:\.[A-Za-z0-9_-]{8,})?"]
          for p in pats:text=re.sub(p,"[secret]",text,flags=re.I)
          text=re.sub(r"(--(?:token|api-key|password|secret)(?:=|\s+))\S+",r"\1[secret]",text,flags=re.I)
          text=re.sub(r"(?im)^([A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|COOKIE)[A-Z0-9_]*)\s*=.*$",r"\1=[present]",text)
          sys.stdout.write(text)
          '
          }

          echo '=== PRIMARY IDENTITY ==='
          date -u '+observed_at=%Y-%m-%dT%H:%M:%SZ'
          printf 'hostname=%s user=%s uid=%s home=%s cwd=%s\n' "$(hostname)" "$(id -un)" "$(id -u)" "$HOME" "$PWD"
          uname -a
          printf 'pid1='; tr '\0' ' ' </proc/1/cmdline 2>/dev/null || true; echo
          if command -v sudo >/dev/null 2>&1; then sudo -n true 2>/dev/null && echo sudo_noninteractive=yes || echo sudo_noninteractive=no; else echo sudo=absent; fi

          echo '=== PRIMARY EXECUTABLES ==='
          for c in hermes openclaw cloudflared tailscale ssh rsync curl python3 git tmux screen supervisorctl supervisord s6-svscan s6-svc crond cron systemctl launchctl docker podman; do
            printf '%s=' "$c"; command -v "$c" 2>/dev/null || echo absent
          done
          echo '=== PRIMARY VERSIONS ==='
          hermes --version 2>&1 | head -n 8 || true
          openclaw --version 2>&1 | head -n 8 || true
          cloudflared --version 2>&1 | head -n 4 || true
          tailscale version 2>&1 | head -n 8 || true

          echo '=== PRIMARY HTTP ==='
          for url in http://127.0.0.1:8787/health http://127.0.0.1:8787/api/auth/status http://127.0.0.1:18789/health http://127.0.0.1:18889/health https://hermes.idol.id/ https://claw.idol.id/; do
            printf '%s -> ' "$url"; curl -ksS --max-time 6 -o /dev/null -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' "$url" || true
          done

          echo '=== PRIMARY PROCESSES ==='
          ps -eo pid=,ppid=,lstart=,args= 2>/dev/null | grep -Ei 'hermes|openclaw|cloudflared|tailscale|supervis|s6|cron' | grep -v grep | redact | head -n 300 || true
          echo '=== PRIMARY LISTENERS ==='
          (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null || true) | grep -E 'State|LISTEN|:8787|:18789|:18889' | redact | head -n 200

          echo '=== PRIMARY SUPERVISION ==='
          crontab -l 2>&1 | redact | head -n 160 || true
          supervisorctl status 2>&1 | redact | head -n 160 || true
          tmux list-sessions 2>&1 | head -n 80 || true
          screen -ls 2>&1 | head -n 80 || true
          find "$HOME/.config" "$HOME/.local" /etc /opt -maxdepth 4 -type f \
            \( -iname '*hermes*.service' -o -iname '*hermes*.conf' -o -iname '*hermes*.sh' -o -iname '*openclaw*.service' -o -iname '*cloudflared*.service' \) \
            -printf '%p mode=%m size=%s mtime=%TY-%Tm-%TdT%TH:%TM:%TSZ\n' 2>/dev/null | head -n 240 || true

          echo '=== PRIMARY HERMES STATUS ==='
          (hermes gateway status --deep 2>&1 || hermes gateway status 2>&1 || true) | redact | head -n 260
          echo '=== PRIMARY OPENCLAW STATUS ==='
          (openclaw gateway status 2>&1 || true) | redact | head -n 260

          echo '=== PRIMARY CONFIG SAFE ==='
          python3 - <<'PY'
          from pathlib import Path
          import json,re,stat
          try: import yaml
          except Exception: yaml=None
          envfiles=[Path.home()/'.hermes/.env',Path.home()/'.hermes/credentials.master.env']
          for p in envfiles:
              if not p.is_file(): print(f'envfile={p} absent');continue
              names=[];vals={}
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if line.startswith('export '):line=line[7:].strip()
                  if not line or line.startswith('#') or '=' not in line:continue
                  k,v=line.split('=',1);k=k.strip();v=v.strip().strip('"').strip("'")
                  if re.fullmatch(r'[A-Z][A-Z0-9_]*',k):names.append(k);vals[k]=v
              print(f'envfile={p} mode={stat.S_IMODE(p.stat().st_mode):04o} size={p.stat().st_size}')
              print('env_names='+','.join(sorted(names)))
              for k in ('MINIMAX_API_KEY','TELEGRAM_BOT_TOKEN','HERMES_WEBUI_PASSWORD','NTFY_TOPIC'):
                  print(f'{k}_present={"yes" if vals.get(k) else "no"}')
              if vals.get('MINIMAX_API_KEY'):print('MINIMAX_API_KEY_class=' + ('token-plan' if vals[k if False else 'MINIMAX_API_KEY'].startswith('sk-cp-') else 'other'))
          p=Path.home()/'.hermes/config.yaml'
          print(f'hermes_config={p} present={p.is_file()}')
          if p.is_file() and yaml:
              d=yaml.safe_load(p.read_text()) or {}
              for sec in ('model','delegation','auxiliary','fallback','gateway'):
                  v=d.get(sec) if isinstance(d,dict) else None
                  if isinstance(v,dict):
                      safe={k:('[present]' if any(x in str(k).lower() for x in ('key','token','secret','password')) and val else val) for k,val in v.items()}
                      print(f'{sec}={safe!r}')
          root=Path.home()/'.openclaw'
          print(f'openclaw_root={root} present={root.is_dir()}')
          if root.is_dir():
              for f in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=f.relative_to(root)
                  if len(rel.parts)<=3:print(f'openclaw_file={rel} mode={stat.S_IMODE(f.stat().st_mode):04o} size={f.stat().st_size}')
              for name in ('openclaw.json','config.json','openclaw.json5','config.json5'):
                  f=root/name
                  if f.is_file():
                      t=f.read_text(errors='replace')
                      for pat in (r'"primary"\s*:\s*"([^"]+)"',r'"provider"\s*:\s*"([^"]+)"',r'"model"\s*:\s*"([^"]+)"'):
                          for m in re.finditer(pat,t): print('openclaw_model_ref='+m.group(1))
          PY

          echo '=== PRIMARY CLOUDFLARED SAFE ==='
          python3 - <<'PY'
          from pathlib import Path
          import stat
          try: import yaml
          except Exception: yaml=None
          for root in (Path.home()/'.cloudflared',Path('/etc/cloudflared')):
              if not root.is_dir():continue
              for p in sorted(x for x in root.iterdir() if x.is_file()):print(f'cloudflared_file={p} mode={stat.S_IMODE(p.stat().st_mode):04o} size={p.stat().st_size}')
          for p in (Path.home()/'.cloudflared/config.yml',Path.home()/'.cloudflared/config.yaml',Path('/etc/cloudflared/config.yml'),Path('/etc/cloudflared/config.yaml')):
              if not p.is_file() or not yaml:continue
              d=yaml.safe_load(p.read_text()) or {}
              print(f'cloudflared_config={p} tunnel={d.get("tunnel","absent")} credentials={Path(str(d.get("credentials-file"))).name if d.get("credentials-file") else "absent"}')
              for i in d.get('ingress') or []:
                  if isinstance(i,dict):print(f'ingress hostname={i.get("hostname","default")} service={i.get("service","absent")}')
          PY

          echo '=== MINIMAX PLAN VALIDITY ==='
          python3 - <<'PY'
          from pathlib import Path
          import json,urllib.request
          key=''
          p=Path.home()/'.hermes/.env'
          if p.is_file():
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if line.startswith('export '):line=line[7:].strip()
                  if line.startswith('MINIMAX_API_KEY='):key=line.split('=',1)[1].strip().strip('"').strip("'")
          if not key: print('minimax_plan_probe=no_key');raise SystemExit
          req=urllib.request.Request('https://api.minimax.io/v1/token_plan/remains',headers={'Authorization':'Bearer '+key})
          try:
              with urllib.request.urlopen(req,timeout=12) as r:
                  d=json.loads(r.read())
              print('minimax_plan_http=200')
              print('minimax_plan_keys='+','.join(sorted(d.keys())))
              rows=d.get('model_remains') or d.get('modelRemains') or []
              print('minimax_model_windows='+str(len(rows) if isinstance(rows,list) else 0))
          except Exception as e: print('minimax_plan_error='+type(e).__name__)
          PY

          echo '=== TAILNET ==='
          tailscale status 2>&1 | redact | head -n 240 || true
          for h in r16 r8a r8b mm clp; do echo "ping=$h"; tailscale ping --timeout=5s "$h" 2>&1 | head -n 12 || true; done

          cat >/tmp/idol-ha-remote-census.sh <<'REMOTE'
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          redact(){ python3 -c 'import re,sys;t=sys.stdin.read();
          pats=[r"sk-[A-Za-z0-9._-]{8,}",r"\b\d{7,}:[A-Za-z0-9_-]{20,}\b",r"(--(?:token|api-key|password|secret)(?:=|\s+))\S+"]
          for p in pats:t=re.sub(p,"[secret]",t,flags=re.I)
          sys.stdout.write(t)' ; }
          echo 'REMOTE_BEGIN'
          date -u '+observed_at=%Y-%m-%dT%H:%M:%SZ'
          printf 'hostname=%s user=%s uid=%s home=%s\n' "$(hostname)" "$(id -un)" "$(id -u)" "$HOME"
          uname -a
          if command -v sudo >/dev/null 2>&1;then sudo -n true 2>/dev/null&&echo sudo_noninteractive=yes||echo sudo_noninteractive=no;else echo sudo=absent;fi
          for c in hermes openclaw cloudflared tailscale ssh rsync curl python3 git systemctl;do printf '%s=' "$c";command -v "$c" 2>/dev/null||echo absent;done
          hermes --version 2>&1|head -n 6||true;openclaw --version 2>&1|head -n 6||true;cloudflared --version 2>&1|head -n 4||true
          ps -eo pid=,ppid=,lstart=,args= 2>/dev/null|grep -Ei 'hermes|openclaw|cloudflared|tailscale'|grep -v grep|redact|head -n 240||true
          (ss -lntp 2>/dev/null||true)|grep -E 'State|:8787|:18789|:18889'|redact|head -n 160
          for unit in hermes-gateway.service hermes-gateway-r16.service hermes-webui.service openclaw-gateway.service openclaw.service cloudflared.service idol-hermes-failover.service idol-hermes-sync.service;do
            printf '%s active=' "$unit";systemctl is-active "$unit" 2>/dev/null||true
            printf '%s enabled=' "$unit";systemctl is-enabled "$unit" 2>/dev/null||true
          done
          systemctl list-unit-files --type=service --no-pager 2>/dev/null|grep -Ei 'hermes|openclaw|cloudflared|idol'|head -n 160||true
          for url in http://127.0.0.1:8787/health http://127.0.0.1:18789/health http://127.0.0.1:18889/health;do printf '%s -> ' "$url";curl -sS --max-time 5 -o /dev/null -w 'status=%{http_code}\n' "$url"||true;done
          python3 - <<'PY'
          from pathlib import Path
          import re,stat
          for p in (Path.home()/'.hermes/.env',Path.home()/'.hermes/credentials.master.env'):
              if not p.is_file():print(f'envfile={p} absent');continue
              vals={};names=[]
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if line.startswith('export '):line=line[7:].strip()
                  if not line or line.startswith('#') or '=' not in line:continue
                  k,v=line.split('=',1);k=k.strip();v=v.strip().strip('"').strip("'")
                  if re.fullmatch(r'[A-Z][A-Z0-9_]*',k):names.append(k);vals[k]=v
              print(f'envfile={p} mode={stat.S_IMODE(p.stat().st_mode):04o} names='+','.join(sorted(names)))
              for k in ('MINIMAX_API_KEY','TELEGRAM_BOT_TOKEN','HERMES_WEBUI_PASSWORD'):
                  print(f'{k}_present={"yes" if vals.get(k) else "no"}')
              if vals.get('MINIMAX_API_KEY'):print('MINIMAX_API_KEY_class='+('token-plan' if vals['MINIMAX_API_KEY'].startswith('sk-cp-') else 'other'))
          for root in (Path.home()/'.cloudflared',Path('/etc/cloudflared')):
              if root.is_dir():
                  for f in sorted(x for x in root.iterdir() if x.is_file()):print(f'cloudflared_file={f} mode={stat.S_IMODE(f.stat().st_mode):04o} size={f.stat().st_size}')
          for root in (Path.home()/'.hermes',Path.home()/'.openclaw',Path.home()/'.config/idol-hermes'):
              print(f'state_root={root} present={root.is_dir()}')
          PY
          echo 'REMOTE_END'
          REMOTE

          for h in r16 r8a r8b;do
            echo "=== REMOTE $h ==="
            timeout 30 tailscale ssh "clp@$h" 'bash -s' </tmp/idol-ha-remote-census.sh 2>&1|redact|head -n 700||true
          done
          rm -f /tmp/idol-ha-remote-census.sh
          echo '=== CENSUS_COMPLETE ==='
          CENSUS
          chmod 700 /tmp/census.sh

          curl -fsS --max-time 20 -b /tmp/cookies -F "session_id=$SID" \
            -F 'file=@/tmp/census.sh;filename=idol-ha-live-census.sh' "$BASE/api/upload" >/tmp/upload.json
          SCRIPT_PATH="$(jq -er '.path' /tmp/upload.json)"
          PROMPT="Use the terminal tool exactly once. Run exactly: bash '$SCRIPT_PATH'. Do not run any other command and return all stdout verbatim."
          curl -fsS --max-time 30 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sid "$SID" --arg m "$PROMPT" --arg ws "$WORKSPACE" '{session_id:$sid,message:$m,model:"MiniMax-M2.7",model_provider:"minimax",workspace:$ws}')" \
            "$BASE/api/chat/start" >/tmp/start.json
          STREAM_ID="$(jq -er '.stream_id' /tmp/start.json)"
          curl -fsS -N --max-time 480 -b /tmp/cookies \
            "$BASE/api/chat/stream?stream_id=$(printf '%s' "$STREAM_ID"|jq -sRr @uri)" >/tmp/stream.log &
          STREAM_PID=$!
          for _ in $(seq 1 480);do
            if ! kill -0 "$STREAM_PID" 2>/dev/null;then break;fi
            pending="$(curl -fsS --max-time 5 -b /tmp/cookies "$BASE/api/approval/pending?session_id=$(printf '%s' "$SID"|jq -sRr @uri)" 2>/dev/null||echo '{}')"
            command="$(printf '%s' "$pending"|jq -r '.pending.command // empty' 2>/dev/null||true)"
            if [[ -n "$command" ]];then
              if [[ "$command" == "bash '$SCRIPT_PATH'" || "$command" == "bash $SCRIPT_PATH" ]];then
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"once"}')" "$BASE/api/approval/respond" >/dev/null
                echo exact_command_approved_once=yes
              else
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"deny"}')" "$BASE/api/approval/respond" >/dev/null||true
                echo unexpected_command_denied=yes;exit 1
              fi
            fi
            sleep 1
          done
          wait "$STREAM_PID"||true
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys
          t=Path('/tmp/stream.log').read_text(errors='replace');parts=[]
          for line in t.splitlines():
              if not line.startswith('data:'):continue
              try:e=json.loads(line[5:].strip())
              except Exception:continue
              if isinstance(e,dict):
                  for k in ('text','message','content'):
                      if isinstance(e.get(k),str):parts.append(e[k])
          out='\n'.join(parts)
          for p in (r'sk-[A-Za-z0-9._-]{8,}',r'gh[pousr]_[A-Za-z0-9_]{8,}',r'cfat_[A-Za-z0-9_-]{8,}',r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b'):
              out=re.sub(p,'[secret]',out,flags=re.I)
          print(out[-60000:])
          if 'CENSUS_COMPLETE' not in out:raise SystemExit('census marker missing')
          PY
