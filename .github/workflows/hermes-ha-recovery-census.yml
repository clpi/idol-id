name: Hermes HA recovery census

on:
  push:
    branches: [ops/hermes-ha-control-20260828]
    paths:
      - .github/workflows/hermes-ha-recovery-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_BUNDLE: U2FsdGVkX195qP/xncpRb35AOtW6UYj7v2GnvTnljIJ4Y/TxyaFwm3B4aupBEar3PN+3Qq/VwMbKIEmUaV1eKg==
    steps:
      - name: Run exact read-only recovery census through MiniMax
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup(){
            set +e
            if [[ -n "${SID:-}" ]]; then
              curl -fsS --max-time 10 -b /tmp/cookies -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg sid "$SID" '{session_id:$sid}')" \
                "$BASE/api/session/delete" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/control.json /tmp/cookies /tmp/new.json /tmp/census.sh /tmp/upload.json /tmp/start.json /tmp/stream.log
          }
          trap cleanup EXIT

          export PASS="$(printf '%s' "idol-hermes-ha-control-v1${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')"
          printf '%s' "$CONTROL_BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS >/tmp/control.json
          WEBUI_PASSWORD="$(jq -er '.webui_password' /tmp/control.json)"; echo "::add-mask::$WEBUI_PASSWORD"
          BASE=https://hermes.idol.id
          curl -fsS --retry 3 --retry-all-errors --max-time 15 -c /tmp/cookies -b /tmp/cookies \
            -H 'Content-Type: application/json' --data "$(jq -nc --arg p "$WEBUI_PASSWORD" '{password:$p}')" \
            "$BASE/api/auth/login" >/dev/null
          curl -fsS --max-time 20 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data '{"model":"MiniMax-M2.7","model_provider":"minimax"}' "$BASE/api/session/new" >/tmp/new.json
          SID="$(jq -er '.session.session_id' /tmp/new.json)"
          WORKSPACE="$(jq -er '.session.workspace' /tmp/new.json)"

          cat >/tmp/census.sh <<'CENSUS'
          #!/usr/bin/env bash
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          redact(){
            python3 -c '
          import re,sys
          text=sys.stdin.read()
          pats=[r"sk-[A-Za-z0-9._-]{8,}",r"gh[pousr]_[A-Za-z0-9_]{8,}",r"github_pat_[A-Za-z0-9_]{8,}",r"cfat_[A-Za-z0-9_-]{8,}",r"xai-[A-Za-z0-9_-]{8,}",r"\b\d{7,}:[A-Za-z0-9_-]{20,}\b",r"\beyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}(?:\.[A-Za-z0-9_-]{8,})?"]
          for p in pats:text=re.sub(p,"[secret]",text,flags=re.I)
          text=re.sub(r"(--(?:token|api-key|password|secret)(?:=|\s+))\S+",r"\1[secret]",text,flags=re.I)
          text=re.sub(r"(?im)^([A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|COOKIE)[A-Z0-9_]*)\s*=.*$",r"\1=[present]",text)
          sys.stdout.write(text)
          '
          }

          echo '=== PRIMARY CURRENT STATE ==='
          date -u '+observed_at=%Y-%m-%dT%H:%M:%SZ'
          printf 'hostname=%s user=%s\n' "$(hostname)" "$(id -un)"
          for url in http://127.0.0.1:8787/health http://127.0.0.1:18789/health https://hermes.idol.id/health https://claw.idol.id/health; do
            printf '%s -> ' "$url"; curl -ksS --max-time 6 -o /dev/null -w 'status=%{http_code}\n' "$url" || true
          done
          for p in "$HOME/.hermes/bin/idol-hermes-primary-tick.sh" "$HOME/.hermes/bin/idol-hermes-ha-loop.sh"; do
            if [[ -f "$p" ]]; then
              printf 'script=%s mode=%s size=%s syntax=' "$p" "$(stat -c %a "$p" 2>/dev/null || echo unknown)" "$(stat -c %s "$p" 2>/dev/null || echo unknown)"
              bash -n "$p" && echo ok || echo bad
            else echo "script=$p absent"; fi
          done
          printf 'primary_loop_processes='; pgrep -af 'idol-hermes-ha-loop.sh' 2>/dev/null | redact | paste -sd';' - || true; echo
          printf 'primary_tick_calls_host_loop='; grep -q 'idol-hermes-primary-tick.sh' "$HOME/.hermes/bin/hermes-host-loopback.sh" 2>/dev/null && echo yes || echo no
          printf 'primary_tick_calls_agent_watchdog='; grep -q 'idol-hermes-primary-tick.sh' /workspace/hermes-jobs/watchdog.sh 2>/dev/null && echo yes || echo no
          printf 'agent_watchdog_processes='; pgrep -af '/workspace/hermes-jobs/watchdog.sh' 2>/dev/null | redact | paste -sd';' - || true; echo
          printf 'cloudflared_processes='; pgrep -af 'cloudflared.*tunnel run' 2>/dev/null | redact | paste -sd';' - || true; echo
          printf 'hermes_gateway_processes='; pgrep -af 'hermes.*gateway run' 2>/dev/null | redact | paste -sd';' - || true; echo
          printf 'openclaw_processes='; pgrep -af '^openclaw-gateway|openclaw.*gateway' 2>/dev/null | redact | paste -sd';' - || true; echo

          echo '=== PRIMARY CONFIG ASSERTIONS ==='
          "$HOME/.hermes/hermes-agent/venv/bin/python" - <<'PY'
          from pathlib import Path
          import json,yaml
          h=yaml.safe_load((Path.home()/'.hermes/config.yaml').read_text()) or {}
          print('hermes_model_provider='+str((h.get('model') or {}).get('provider')))
          print('hermes_model_default='+str((h.get('model') or {}).get('default')))
          print('hermes_delegation_provider='+str((h.get('delegation') or {}).get('provider')))
          print('hermes_delegation_model='+str((h.get('delegation') or {}).get('model')))
          print('hermes_delegation_max='+str((h.get('delegation') or {}).get('max_concurrent_children')))
          print('hermes_fallback_providers='+repr(h.get('fallback_providers')))
          o=json.loads((Path.home()/'.openclaw/openclaw.json').read_text())
          d=((o.get('agents') or {}).get('defaults') or {})
          print('openclaw_primary='+str((d.get('model') or {}).get('primary')))
          print('openclaw_max='+str(d.get('maxConcurrent')))
          print('openclaw_subagents_max='+str((d.get('subagents') or {}).get('maxConcurrent')))
          print('openclaw_minimax_provider=' + ('yes' if 'minimax' in ((o.get('models') or {}).get('providers') or {}) else 'no'))
          PY
          echo '=== PRIMARY CRON ==='
          "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/.hermes/hermes-agent/hermes" cron list --all 2>&1 | redact | head -n 160 || true
          echo '=== PRIMARY HA LOG TAILS ==='
          for p in "$HOME/.hermes/logs/idol-ha-primary.log" "$HOME/.hermes/logs/idol-ha-loop.log" "$HOME/.hermes/logs/idol-ha-loop-bootstrap.log"; do
            echo "--- $p ---"; tail -n 120 "$p" 2>/dev/null | redact || true
          done

          cat >/tmp/r16-recovery-census.sh <<'REMOTE'
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          redact(){ python3 -c 'import re,sys;t=sys.stdin.read();
          for p in (r"sk-[A-Za-z0-9._-]{8,}",r"\b\d{7,}:[A-Za-z0-9_-]{20,}\b",r"(--(?:token|api-key|password|secret)(?:=|\s+))\S+"):t=re.sub(p,"[secret]",t,flags=re.I)
          sys.stdout.write(t)' ; }
          echo '=== R16 CURRENT STATE ==='
          date -u '+observed_at=%Y-%m-%dT%H:%M:%SZ'
          printf 'hostname=%s user=%s\n' "$(hostname)" "$(id -un)"
          for unit in hermes-serve.service hermes-webui.service openclaw-gateway.service hermes-gateway.service idol-hermes-failover.service idol-hermes-standby-tunnel.service; do
            printf '%s active=' "$unit"; systemctl --user is-active "$unit" 2>/dev/null || true
            printf '%s enabled=' "$unit"; systemctl --user is-enabled "$unit" 2>/dev/null || true
          done
          printf 'role='; cat "$HOME/.config/idol-hermes/role" 2>/dev/null || echo absent
          printf 'heartbeat_mtime='; stat -c %Y "$HOME/.config/idol-hermes/primary-heartbeat" 2>/dev/null || echo absent
          for url in http://127.0.0.1:8787/health http://127.0.0.1:18789/health; do
            printf '%s -> ' "$url"; curl -sS --max-time 6 -o /dev/null -w 'status=%{http_code}\n' "$url" || true
          done
          echo '--- openclaw unit ---'
          systemctl --user cat openclaw-gateway.service 2>&1 | redact | head -n 180 || true
          echo '--- openclaw status ---'
          systemctl --user status openclaw-gateway.service --no-pager -l 2>&1 | redact | head -n 220 || true
          echo '--- openclaw journal ---'
          journalctl --user -u openclaw-gateway.service -n 240 --no-pager -o short-iso 2>&1 | redact | head -n 340 || true
          echo '--- failover status ---'
          systemctl --user status idol-hermes-failover.service --no-pager -l 2>&1 | redact | head -n 180 || true
          echo '--- failover journal ---'
          journalctl --user -u idol-hermes-failover.service -n 180 --no-pager -o short-iso 2>&1 | redact | head -n 260 || true
          echo '--- failover log ---'
          tail -n 180 "$HOME/.config/idol-hermes/failover.log" 2>/dev/null | redact || true
          echo '--- standby tunnel status ---'
          systemctl --user status idol-hermes-standby-tunnel.service --no-pager -l 2>&1 | redact | head -n 180 || true
          echo '--- config assertions ---'
          python3 - <<'PY'
          from pathlib import Path
          import json
          try: import yaml
          except Exception: yaml=None
          hp=Path.home()/'.hermes/config.yaml'
          if hp.is_file() and yaml:
              h=yaml.safe_load(hp.read_text()) or {}
              print('hermes_model_provider='+str((h.get('model') or {}).get('provider')))
              print('hermes_model_default='+str((h.get('model') or {}).get('default')))
              print('hermes_delegation_max='+str((h.get('delegation') or {}).get('max_concurrent_children')))
          op=Path.home()/'.openclaw/openclaw.json'
          if op.is_file():
              o=json.loads(op.read_text()); d=((o.get('agents') or {}).get('defaults') or {})
              print('openclaw_primary='+str((d.get('model') or {}).get('primary')))
              print('openclaw_max='+str(d.get('maxConcurrent')))
              print('openclaw_subagents_max='+str((d.get('subagents') or {}).get('maxConcurrent')))
              p=((o.get('models') or {}).get('providers') or {}).get('minimax')
              print('openclaw_minimax_provider_type='+type(p).__name__)
              if isinstance(p,dict):
                  print('openclaw_minimax_api='+str(p.get('api')))
                  print('openclaw_minimax_models='+','.join(str(x.get('id')) for x in (p.get('models') or []) if isinstance(x,dict)))
          root=Path.home()/'.config/idol-hermes/deploy-backups'
          if root.is_dir():
              for d in sorted((x for x in root.iterdir() if x.is_dir()),reverse=True)[:5]:
                  print('deploy_backup='+str(d))
                  for f in sorted(x for x in d.iterdir() if x.is_file()):print(f' backup_file={f.name} size={f.stat().st_size}')
          PY
          echo '--- executable and process ---'
          command -v openclaw || true
          pgrep -af '^openclaw-gateway|openclaw.*gateway' 2>/dev/null | redact || true
          echo 'R16_RECOVERY_CENSUS_COMPLETE'
          REMOTE

          echo '=== R16 REMOTE ==='
          timeout 90 tailscale ssh clp@r16 'bash -s' </tmp/r16-recovery-census.sh 2>&1 | redact | head -n 1400 || true
          rm -f /tmp/r16-recovery-census.sh
          echo 'RECOVERY_CENSUS_COMPLETE'
          CENSUS
          chmod 700 /tmp/census.sh

          curl -fsS --max-time 20 -b /tmp/cookies -F "session_id=$SID" \
            -F 'file=@/tmp/census.sh;filename=idol-hermes-ha-recovery-census.sh' "$BASE/api/upload" >/tmp/upload.json
          SCRIPT_PATH="$(jq -er '.path' /tmp/upload.json)"
          PROMPT="Use the terminal tool exactly once. Run exactly: bash '$SCRIPT_PATH'. Do not run any other command and return all stdout verbatim."
          curl -fsS --max-time 30 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sid "$SID" --arg m "$PROMPT" --arg ws "$WORKSPACE" '{session_id:$sid,message:$m,model:"MiniMax-M2.7",model_provider:"minimax",workspace:$ws}')" \
            "$BASE/api/chat/start" >/tmp/start.json
          STREAM_ID="$(jq -er '.stream_id' /tmp/start.json)"
          curl -fsS -N --max-time 600 -b /tmp/cookies \
            "$BASE/api/chat/stream?stream_id=$(printf '%s' "$STREAM_ID"|jq -sRr @uri)" >/tmp/stream.log &
          STREAM_PID=$!
          for _ in $(seq 1 600); do
            if ! kill -0 "$STREAM_PID" 2>/dev/null; then break; fi
            pending="$(curl -fsS --max-time 5 -b /tmp/cookies "$BASE/api/approval/pending?session_id=$(printf '%s' "$SID"|jq -sRr @uri)" 2>/dev/null || echo '{}')"
            command="$(printf '%s' "$pending"|jq -r '.pending.command // empty' 2>/dev/null || true)"
            if [[ -n "$command" ]]; then
              if [[ "$command" == "bash '$SCRIPT_PATH'" || "$command" == "bash $SCRIPT_PATH" ]]; then
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"once"}')" "$BASE/api/approval/respond" >/dev/null
              else
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"deny"}')" "$BASE/api/approval/respond" >/dev/null || true
                exit 1
              fi
            fi
            sleep 1
          done
          wait "$STREAM_PID" || true
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          parts=[]
          for line in Path('/tmp/stream.log').read_text(errors='replace').splitlines():
              if not line.startswith('data:'): continue
              try:e=json.loads(line[5:].strip())
              except Exception:continue
              if isinstance(e,dict):
                  for k in ('text','message','content'):
                      if isinstance(e.get(k),str):parts.append(e[k])
          out='\n'.join(parts)
          for pat in (r'sk-[A-Za-z0-9._-]{8,}',r'gh[pousr]_[A-Za-z0-9_]{8,}',r'cfat_[A-Za-z0-9_-]{8,}',r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b'):
              out=re.sub(pat,'[secret]',out,flags=re.I)
          print(out[-120000:])
          if 'RECOVERY_CENSUS_COMPLETE' not in out: raise SystemExit('recovery census marker missing')
          PY
