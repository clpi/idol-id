name: Verify Idsem current surface once

on:
  push:
    branches: [fix/idsem-current-surface-20260828]
    paths:
      - apps/site/index.html
      - shared/shell.js
      - test/idsem-current-surface.test.mjs
      - .github/workflows/idsem-current-surface-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test current identity and full repository suite
        run: |
          set -euo pipefail
          node --test test/idsem-current-surface.test.mjs
          npm test
          npm run build
          git diff --check
      - name: Remove this one-shot verifier after admission
        run: |
          set -euo pipefail
          rm .github/workflows/idsem-current-surface-once.yml
          git config user.name 'idsem-surface-bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'ci: retire Idsem current-surface verifier'
          git push origin HEAD:fix/idsem-current-surface-20260828
