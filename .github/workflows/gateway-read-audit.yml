name: Gateway read audit
on:
  push:
    branches: [ops/authenticated-audit-20260906]
    paths: [.github/workflows/gateway-read-audit.yml]
permissions:
  contents: read
concurrency:
  group: gateway-read-audit-20260906
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - name: Discover public MCP authorization metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,urllib.request,urllib.error,urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          print('OBSERVED_AT='+datetime.datetime.now(datetime.timezone.utc).isoformat())
          for path in ('/mcp','/.well-known/oauth-protected-resource','/.well-known/oauth-protected-resource/mcp','/.well-known/oauth-authorization-server'):
              try:
                  try:r=opener.open('https://claw.idol.id'+path,timeout=10)
                  except urllib.error.HTTPError as error:r=error
                  with r:
                      body=r.read(12000)
                      row={'path':path,'status':r.status}
                      if path.startswith('/.well-known/'):
                          try:
                              data=json.loads(body)
                              for key in ('issuer','resource','authorization_servers','authorization_endpoint','token_endpoint','registration_endpoint','scopes_supported','grant_types_supported','response_types_supported','code_challenge_methods_supported'):
                                  if key in data:row[key]=data[key]
                          except ValueError:pass
                      print(json.dumps(row))
              except Exception as error:print(json.dumps({'path':path,'error':type(error).__name__}))
          PY
      - name: Require existing gateway credentials rather than reporting unauthenticated success
        env:
          HERMES_WEBUI_PASSWORD: ${{ secrets.HERMES_WEBUI_PASSWORD }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,os
          if datetime.datetime.now(datetime.timezone.utc)>=datetime.datetime(2026,9,7,tzinfo=datetime.timezone.utc):
              raise SystemExit('BLOCKED: one-day diagnostic expired')
          available={k:bool(os.environ.get(k)) for k in ('HERMES_WEBUI_PASSWORD','OPENCLAW_GATEWAY_TOKEN')}
          print(json.dumps({'credential_available':available,'authenticated_status':'not-yet-measured','dispatch':False}))
          if not all(available.values()):raise SystemExit('BLOCKED: existing named gateway credentials unavailable; no authenticated fleet audit completed')
          PY
      - name: Read only the two explicitly requested gateway tools
        env:
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          token=os.environ.pop('OPENCLAW_GATEWAY_TOKEN')
          passed=0
          for name in ('compiler_status','live_status'):
              request=urllib.request.Request('https://claw.idol.id/tools/invoke',data=json.dumps({'tool':name,'args':{}}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with opener.open(request,timeout=15) as response:
                      data=json.loads(response.read(200000))
                      ok=data.get('ok') is True
                      result=data.get('result',{})
                      print(json.dumps({'tool':name,'http':response.status,'ok':ok,'result_keys':[k for k in result if isinstance(k,str) and re.fullmatch('[a-zA-Z_][a-zA-Z0-9_]{0,60}',k)] if isinstance(result,dict) else []}))
                      passed+=int(ok)
              except Exception as error:print(json.dumps({'tool':name,'error':type(error).__name__}))
          if passed!=2:raise SystemExit('BLOCKED: one or both authenticated status reads unavailable')
          print('Gateway tool reads completed; worker health and provider utilization require their own evidence')
          PY
