name: Idol surface admit and deploy v2

on:
  push:
    branches: [ops/idol-domain-repair-20260828]
    paths:
      - .github/workflows/idol-surface-admit-deploy-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: idol-surface-admit-deploy-v2
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REPAIR_BRANCH: fix/idol-surfaces-20260828
    steps:
      - name: Wait for source repair PR
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            gh pr view "$REPAIR_BRANCH" --repo clpi/idol-id \
              --json number,url,headRefOid,state,mergeCommit >/tmp/pr.json 2>/dev/null && break
            sleep 15
          done
          test -s /tmp/pr.json
          state="$(jq -r .state /tmp/pr.json)"
          [[ "$state" == OPEN || "$state" == MERGED ]]
          echo "PR_NUMBER=$(jq -r .number /tmp/pr.json)" >> "$GITHUB_ENV"
          echo "PR_STATE=$state" >> "$GITHUB_ENV"
          echo "PR_HEAD=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
          fetch-depth: 0

      - name: Fence and independently verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git diff --name-only origin/main...HEAD | tee /tmp/changed || true
          if grep -Ei '(^|/)(hermes|openclaw|claw)(/|\.|$)|hermes-bootstrap|hermes-ha' /tmp/changed; then exit 1; fi
          if git diff origin/main...HEAD | grep -Ei '^\+.*(hermes\.idol\.id|claw\.idol\.id)'; then exit 1; fi
          test -s ops/reports/idol-source-repair.md
          grep -q '^RESULT=PASS$' ops/reports/idol-source-verification.log

          : >/tmp/admission.log
          logrun(){ echo "+ $*" | tee -a /tmp/admission.log; "$@" 2>&1 | tee -a /tmp/admission.log; }
          if [[ -f package.json ]]; then
            if [[ -f pnpm-lock.yaml ]]; then corepack enable; logrun pnpm install --frozen-lockfile; PM=pnpm
            elif [[ -f yarn.lock ]]; then corepack enable; logrun yarn install --immutable; PM=yarn
            elif [[ -f bun.lockb || -f bun.lock ]]; then curl -fsSL https://bun.sh/install | bash >/dev/null; export PATH="$HOME/.bun/bin:$PATH"; logrun bun install --frozen-lockfile; PM=bun
            else PM=npm; [[ -f package-lock.json ]] && logrun npm ci || logrun npm install; fi
            for script in lint typecheck check test build; do
              node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts['$script']?0:1)" 2>/dev/null \
                && logrun "$PM" run "$script" || true
            done
          fi
          if [[ -f pyproject.toml || -f pytest.ini ]]; then python3 -m pip install -q pytest; logrun python3 -m pytest -q; fi
          [[ ! -f Cargo.toml ]] || logrun cargo test --workspace
          echo RESULT=PASS | tee -a /tmp/admission.log

      - name: Merge if still open and resolve admitted main SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PR_STATE" == OPEN ]]; then
            set +e
            gh pr checks "$PR_NUMBER" --repo clpi/idol-id --watch --fail-fast --interval 15
            checks_rc=$?
            set -e
            if [[ "$checks_rc" -ne 0 ]]; then
              remaining="$(gh pr checks "$PR_NUMBER" --repo clpi/idol-id --json state 2>/dev/null \
                | jq '[.[]|select(.state!="SUCCESS" and .state!="SKIPPED" and .state!="NEUTRAL")]|length' || echo 1)"
              [[ "$remaining" -eq 0 ]]
            fi
            gh pr merge "$PR_NUMBER" --repo clpi/idol-id --squash --delete-branch
          fi
          for _ in $(seq 1 30); do
            state="$(gh pr view "$PR_NUMBER" --repo clpi/idol-id --json state --jq .state)"
            [[ "$state" == MERGED ]] && break
            sleep 5
          done
          [[ "$state" == MERGED ]]
          main_sha="$(gh api repos/clpi/idol-id/commits/main --jq .sha)"
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Require successful production deployment for admitted main SHA
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          deploy_run_id=""
          # Prefer the merge-triggered deployment; dispatch only as a fallback.
          for attempt in $(seq 1 12); do
            runs="$(gh api 'repos/clpi/idol-id/actions/runs?branch=main&per_page=100')"
            deploy_run_id="$(jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[]|select(.head_sha==$sha and (.path|test("deploy")))][0].id // empty' <<<"$runs")"
            [[ -n "$deploy_run_id" ]] && break
            [[ "$attempt" -ne 4 ]] || gh workflow run deploy.yml --repo clpi/idol-id --ref main 2>/dev/null || true
            sleep 10
          done
          test -n "$deploy_run_id"

          for _ in $(seq 1 160); do
            run="$(gh api "repos/clpi/idol-id/actions/runs/$deploy_run_id")"
            status="$(jq -r .status <<<"$run")"; conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]]
              break
            fi
            sleep 15
          done
          [[ "$status" == completed && "$conclusion" == success ]]
          echo "DEPLOY_RUN_ID=$deploy_run_id" >> "$GITHUB_ENV"

      - name: Run production transport, TLS, HTML, and asset admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          D=/tmp/idol-admission-v2; mkdir -p "$D"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          api=https://api.cloudflare.com/client/v4
          zone="$(curl -fsS "${auth[@]}" "$api/zones?name=idol.id&status=active" | jq -er '.result[0].id')"
          curl -fsS "${auth[@]}" "$api/zones/$zone/dns_records?per_page=5000" >"$D/dns.json"
          jq -r '.result[] | select((.type=="A" or .type=="AAAA" or .type=="CNAME") and (.proxied==true or .name=="idol.id")) | .name' "$D/dns.json" \
            | awk 'NF && $0 !~ /^\*/ && $0 !~ /(^|\.)_/ && $0 != "hermes.idol.id" && $0 != "claw.idol.id"' \
            | sort -u >"$D/hosts"
          printf 'idol.id\n' >>"$D/hosts"; sort -u -o "$D/hosts" "$D/hosts"

          printf '[]' >"$D/results.json"; overall=0
          while IFS= read -r host; do
            probes='[]'; root_type=''; root_file="$D/$host.root"; rm -f "$root_file"
            for path in / /health /api/health /__idol/health; do
              body="$D/body"; rm -f "$body"
              meta="$(curl -sS -L --connect-timeout 7 --max-time 25 --retry 2 --retry-all-errors -o "$body" \
                -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{num_redirects}\t%{size_download}\t%{time_total}\t%{ssl_verify_result}' \
                "https://$host$path" 2>/dev/null || printf '000\thttps://%s%s\t\t0\t0\t0\t1' "$host" "$path")"
              IFS=$'\t' read -r code final type redirects bytes seconds ssl <<<"$meta"
              if [[ "$path" == / && -f "$body" ]]; then cp "$body" "$root_file"; root_type="$type"; fi
              probes="$(jq -nc --argjson a "$probes" --arg p "$path" --arg c "$code" --arg f "$final" --arg t "$type" --arg r "$redirects" --arg b "$bytes" --arg s "$seconds" --arg ssl "$ssl" \
                '$a+[{path:$p,http:($c|tonumber?//0),final_url:$f,content_type:$t,redirects:($r|tonumber?//0),bytes:($b|tonumber?//0),seconds:($s|tonumber?//0),ssl_verify_result:($ssl|tonumber?//1)}]')"
            done
            transport_ok="$(jq '[.[]|select(.http>=200 and .http<400 and .ssl_verify_result==0)]|length>0' <<<"$probes")"

            assets='[]'; assets_ok=true; blank_ok=true
            if [[ "$root_type" == text/html* && -s "$root_file" ]]; then
              python3 - "$host" "$root_file" >"$D/assets-list" <<'PY'
          import html.parser,sys,urllib.parse
          host,path=sys.argv[1:]
          class P(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.urls=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t in ('script','img','source') and d.get('src'):self.urls.append(d['src'])
                  if t=='link' and d.get('href'):self.urls.append(d['href'])
          p=P();p.feed(open(path,errors='replace').read()); seen=set()
          for raw in p.urls:
              u=urllib.parse.urljoin(f'https://{host}/',raw)
              if urllib.parse.urlparse(u).hostname==host and u not in seen:
                  seen.add(u); print(u)
          PY
              while IFS= read -r url; do
                [[ -n "$url" ]] || continue
                code="$(curl -sS -L --connect-timeout 5 --max-time 15 --retry 1 -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || echo 000)"
                assets="$(jq -nc --argjson a "$assets" --arg u "$url" --arg c "$code" '$a+[{url:$u,http:($c|tonumber?//0)}]')"
                [[ "$code" -ge 200 && "$code" -lt 400 ]] || assets_ok=false
              done < <(head -n 100 "$D/assets-list")
              python3 - "$root_file" <<'PY' || blank_ok=false
          import re,sys
          text=open(sys.argv[1],errors='replace').read()
          visible=re.sub(r'<(script|style)[^>]*>.*?</\1>','',text,flags=re.I|re.S)
          visible=re.sub(r'<[^>]+>',' ',visible); visible=re.sub(r'\s+',' ',visible).strip()
          app=bool(re.search(r'<(?:canvas|main)\b|id=["\'](?:app|root|__next)["\']',text,re.I))
          raise SystemExit(0 if len(visible)>=20 or app else 1)
          PY
            fi
            host_ok=false
            [[ "$transport_ok" == true && "$assets_ok" == true && "$blank_ok" == true ]] && host_ok=true || overall=1
            jq -n --arg host "$host" --argjson healthy "$host_ok" --argjson transport "$transport_ok" \
              --argjson assets_ok "$assets_ok" --argjson blank_ok "$blank_ok" --argjson probes "$probes" --argjson assets "$assets" \
              '{host:$host,healthy:$healthy,transport_ok:$transport,assets_ok:$assets_ok,blank_ok:$blank_ok,probes:$probes,assets:$assets}' >"$D/one.json"
            jq -s '.[0]+[.[1]]' "$D/results.json" "$D/one.json" >"$D/m.json"; mv "$D/m.json" "$D/results.json"
          done <"$D/hosts"

          jq -n --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sha "$MAIN_SHA" --arg run "$DEPLOY_RUN_ID" --argjson passed "$([[ "$overall" -eq 0 ]] && echo true || echo false)" \
            --slurpfile results "$D/results.json" \
            '{schema:"idol.surface.production-admission.v2",observed_at:$observed_at,main_sha:$sha,deploy_run_id:($run|tonumber),exclusions:["hermes.idol.id","claw.idol.id"],results:$results[0],passed:$passed}' >"$D/report.json"
          [[ "$overall" -eq 0 ]]

      - name: Persist authoritative production evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/idol-admission-v2; [[ -s "$D/report.json" ]] || exit 0
          git fetch origin ops/idol-domain-repair-20260828
          git checkout -B ops/idol-domain-repair-20260828 origin/ops/idol-domain-repair-20260828
          mkdir -p ops/reports
          cp "$D/report.json" ops/reports/idol-surface-production-admission-v2.json
          cp /tmp/admission.log ops/reports/idol-surface-independent-verification-v2.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ops/reports/idol-surface-production-admission-v2.json').read_text())
          lines=['# Idol surface production admission v2','',f"Observed: `{d['observed_at']}`",f"Main SHA: `{d['main_sha']}`",f"Deploy run: `{d['deploy_run_id']}`",f"Overall: **{'PASS' if d['passed'] else 'FAIL'}**",'',
                 '| Host | Overall | Transport/TLS | Assets | Nonblank | Root | Best health |','|---|---:|---:|---:|---:|---:|---:|']
          for r in sorted(d['results'],key=lambda x:x['host']):
              c={x['path']:x['http'] for x in r['probes']}; best=max(c.get('/health',0),c.get('/api/health',0),c.get('/__idol/health',0))
              lines.append(f"| `{r['host']}` | {r['healthy']} | {r['transport_ok']} | {r['assets_ok']} | {r['blank_ok']} | {c.get('/',0)} | {best} |")
          Path('ops/reports/idol-surface-production-admission-v2.md').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name idol-surface-admission
          git config user.email idol-surface-admission@users.noreply.github.com
          git add ops/reports/idol-surface-production-admission-v2.json ops/reports/idol-surface-production-admission-v2.md ops/reports/idol-surface-independent-verification-v2.log
          git commit -m 'ops: record authoritative Idol production admission v2' || exit 0
          git push origin HEAD:ops/idol-domain-repair-20260828
