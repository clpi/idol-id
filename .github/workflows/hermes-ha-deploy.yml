name: Deploy Hermes HA and MiniMax defaults

on:
  push:
    branches: [ops/hermes-ha-control-20260828]
    paths:
      - .github/workflows/hermes-ha-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_BUNDLE: U2FsdGVkX195qP/xncpRb35AOtW6UYj7v2GnvTnljIJ4Y/TxyaFwm3B4aupBEar3PN+3Qq/VwMbKIEmUaV1eKg==
    steps:
      - name: Apply exact audited deployment through MiniMax
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup(){
            set +e
            if [[ -n "${SID:-}" ]]; then
              curl -fsS --max-time 10 -b /tmp/cookies -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg sid "$SID" '{session_id:$sid}')" \
                "$BASE/api/session/delete" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/control.json /tmp/cookies /tmp/new.json /tmp/deploy.sh /tmp/upload.json /tmp/start.json /tmp/stream.log
          }
          trap cleanup EXIT

          export PASS="$(printf '%s' "idol-hermes-ha-control-v1${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')"
          printf '%s' "$CONTROL_BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS >/tmp/control.json
          WEBUI_PASSWORD="$(jq -er '.webui_password' /tmp/control.json)"; echo "::add-mask::$WEBUI_PASSWORD"
          BASE=https://hermes.idol.id
          curl -fsS --retry 3 --retry-all-errors --max-time 15 -c /tmp/cookies -b /tmp/cookies \
            -H 'Content-Type: application/json' --data "$(jq -nc --arg p "$WEBUI_PASSWORD" '{password:$p}')" \
            "$BASE/api/auth/login" >/dev/null
          curl -fsS --max-time 20 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data '{"model":"MiniMax-M2.7","model_provider":"minimax"}' "$BASE/api/session/new" >/tmp/new.json
          SID="$(jq -er '.session.session_id' /tmp/new.json)"
          WORKSPACE="$(jq -er '.session.workspace' /tmp/new.json)"

          cat >/tmp/deploy.sh <<'DEPLOY'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NOW="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$HOME/.config/idol-hermes/deploy-backups/$NOW"
          mkdir -p "$BACKUP" "$HOME/.hermes/bin" "$HOME/.hermes/logs" "$HOME/.config/idol-hermes"

          log(){ printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
          fail(){ log "ERROR $*"; exit 1; }
          env_value(){
            python3 - "$1" <<'PY'
          import re,sys
          from pathlib import Path
          name=sys.argv[1]; value=''
          p=Path.home()/'.hermes/.env'
          if p.is_file():
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if line.startswith('export '): line=line[7:].strip()
                  if not line or line.startswith('#') or '=' not in line: continue
                  key,val=line.split('=',1)
                  if key.strip()==name: value=val.strip().strip('"').strip("'")
          sys.stdout.write(value)
          PY
          }

          log 'preflight begin'
          [[ "$(hostname -s)" == cursor ]] || fail "expected cursor primary, got $(hostname -s)"
          command -v tailscale >/dev/null || fail 'tailscale absent'
          command -v curl >/dev/null || fail 'curl absent'
          [[ -x "$HOME/.hermes/hermes-agent/venv/bin/python" ]] || fail 'Hermes venv absent'
          [[ -f "$HOME/.hermes/config.yaml" ]] || fail 'Hermes config absent'
          [[ -f "$HOME/.openclaw/openclaw.json" ]] || fail 'OpenClaw config absent'
          [[ -s "$HOME/.cloudflared/claw.token" ]] || fail 'claw tunnel token absent'
          MINIMAX_API_KEY="$(env_value MINIMAX_API_KEY)"
          [[ "$MINIMAX_API_KEY" == sk-cp-* ]] || fail 'MiniMax token-plan key absent or wrong class'

          # Verify the subscription allowance endpoint without printing credentials or allowance detail.
          plan_code="$(curl -sS --max-time 15 -o /tmp/idol-minimax-plan.json -w '%{http_code}' \
            -H "Authorization: Bearer $MINIMAX_API_KEY" https://api.minimax.io/v1/token_plan/remains || true)"
          [[ "$plan_code" == 200 ]] || fail "MiniMax token-plan endpoint returned $plan_code"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/idol-minimax-plan.json').read_text())
          rows=data.get('model_remains') or data.get('modelRemains') or []
          if not isinstance(rows,list) or not rows: raise SystemExit('no MiniMax allowance windows')
          print(f'MINIMAX_PLAN_OK windows={len(rows)}')
          PY
          rm -f /tmp/idol-minimax-plan.json

          for file in \
            "$HOME/.hermes/config.yaml" \
            "$HOME/.openclaw/openclaw.json" \
            "$HOME/.openclaw/bin/openclaw-gateway-loopback.sh" \
            "$HOME/.openclaw/bin/openclaw-cloudflared.sh" \
            "$HOME/.hermes/bin/hermes-host-loopback.sh" \
            /workspace/hermes-jobs/watchdog.sh
          do
            [[ -e "$file" ]] && cp -a "$file" "$BACKUP/$(printf '%s' "$file" | sed 's#^/##;s#/#__#g')"
          done

          log 'patch primary Hermes model and delegation'
          "$HOME/.hermes/hermes-agent/venv/bin/python" - <<'PY'
          from pathlib import Path
          import os,yaml
          p=Path.home()/'.hermes/config.yaml'
          data=yaml.safe_load(p.read_text()) or {}
          if not isinstance(data,dict): raise SystemExit('Hermes config is not a mapping')
          model=data.get('model')
          if not isinstance(model,dict): model={}
          model.update({
              'provider':'minimax',
              'default':'MiniMax-M2.7',
              'base_url':'https://api.minimax.io/anthropic',
              'api_mode':'anthropic_messages',
          })
          data['model']=model
          delegation=data.get('delegation')
          if not isinstance(delegation,dict): delegation={}
          delegation.update({
              'provider':'minimax',
              'model':'MiniMax-M2.7',
              'max_concurrent_children':3,
              'child_timeout_seconds':3600,
              'surface_child_process_notifications':False,
          })
          data['delegation']=delegation
          data['fallback_providers']=[]
          cron=data.get('cron')
          if not isinstance(cron,dict): cron={}
          cron.update({'provider':'minimax','model':'MiniMax-M2.7'})
          data['cron']=cron
          tmp=p.with_suffix('.yaml.tmp')
          tmp.write_text(yaml.safe_dump(data,sort_keys=False,allow_unicode=True))
          os.chmod(tmp,0o600); tmp.replace(p)
          PY

          log 'patch primary OpenClaw MiniMax provider/default/concurrency'
          MINIMAX_API_KEY="$MINIMAX_API_KEY" python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path.home()/'.openclaw/openclaw.json'
          data=json.loads(p.read_text())
          models=data.setdefault('models',{})
          models['mode']='merge'
          providers=models.setdefault('providers',{})
          providers['minimax']={
              'baseUrl':'https://api.minimax.io/v1',
              'apiKey':os.environ['MINIMAX_API_KEY'],
              'api':'openai-completions',
              'models':[
                  {'id':'MiniMax-M2.7','name':'MiniMax M2.7 (Plus)','reasoning':True,'input':['text'],'contextWindow':200000,'maxTokens':131072,'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'api':'openai-completions'},
                  {'id':'MiniMax-M3','name':'MiniMax M3 (Plus)','reasoning':True,'input':['text'],'contextWindow':200000,'maxTokens':131072,'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'api':'openai-completions'},
              ],
          }
          agents=data.setdefault('agents',{}).setdefault('defaults',{})
          agents.setdefault('model',{})['primary']='minimax/MiniMax-M2.7'
          agents['maxConcurrent']=3
          agents.setdefault('subagents',{})['maxConcurrent']=3
          agents['subagents']['archiveAfterMinutes']=60
          catalog=agents.setdefault('models',{})
          catalog.setdefault('minimax/MiniMax-M2.7',{})
          catalog.setdefault('minimax/MiniMax-M3',{})
          policy=agents.setdefault('modelPolicy',{})
          allow=policy.setdefault('allow',[])
          for name in ('minimax/MiniMax-M2.7','minimax/MiniMax-M3'):
              if name not in allow: allow.append(name)
          tmp=p.with_suffix('.json.tmp')
          tmp.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          os.chmod(tmp,0o600); tmp.replace(p)
          PY

          log 'patch OpenClaw environment allowlist and secure tunnel launcher'
          python3 - <<'PY'
          from pathlib import Path
          p=Path.home()/'.openclaw/bin/openclaw-gateway-loopback.sh'
          text=p.read_text()
          if 'load_env_key MINIMAX_API_KEY' not in text:
              anchor='load_env_key OPENROUTER_API_KEY\n'
              if anchor not in text: raise SystemExit('OpenClaw key-loader anchor missing')
              text=text.replace(anchor,anchor+'load_env_key MINIMAX_API_KEY\n',1)
          if '|MINIMAX_API_KEY)' not in text:
              text=text.replace('|OPENROUTER_API_KEY)', '|OPENROUTER_API_KEY|MINIMAX_API_KEY)')
          p.write_text(text); p.chmod(0o700)
          PY
          cat >"$HOME/.openclaw/bin/openclaw-cloudflared.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME="${HOME:-/home/box}"
          TOKEN_FILE="${HOME}/.cloudflared/claw.token"
          LOG_FILE="${HOME}/.openclaw/logs/cloudflared-claw.log"
          BIN="${HOME}/.local/bin/cloudflared"
          [[ -s "$TOKEN_FILE" ]] || { echo "missing tunnel token file" >&2; exit 1; }
          mkdir -p "$(dirname "$LOG_FILE")"
          exec "$BIN" --no-autoupdate tunnel run --token-file "$TOKEN_FILE"
          SH
          chmod 700 "$HOME/.openclaw/bin/openclaw-cloudflared.sh"
          chmod 600 "$HOME/.cloudflared/claw.token" "$HOME/.openclaw/openclaw.json" "$HOME/.hermes/config.yaml"
          bash -n "$HOME/.openclaw/bin/openclaw-gateway-loopback.sh"
          bash -n "$HOME/.openclaw/bin/openclaw-cloudflared.sh"

          log 'install primary HA tick and loop'
          cat >"$HOME/.hermes/bin/idol-hermes-primary-tick.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          umask 077
          export HOME="${HOME:-/home/box}"
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          STATE="$HOME/.config/idol-hermes"
          LOG="$HOME/.hermes/logs/idol-ha-primary.log"
          mkdir -p "$STATE" "$(dirname "$LOG")"
          LOCK="$STATE/primary-tick.lock"
          mkdir "$LOCK" 2>/dev/null || exit 0
          trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
          say(){ printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >>"$LOG"; }
          healthy(){ curl -fsS --max-time 4 "$1" >/dev/null 2>&1; }
          source_env(){ set -a; source "$HOME/.hermes/.env" 2>/dev/null || true; set +a; }
          source_env

          # Fence/demote r16 before asserting primary services whenever the tailnet is available.
          timeout 12 tailscale ssh clp@r16 \
            'mkdir -p ~/.config/idol-hermes; systemctl --user stop idol-hermes-standby-tunnel.service >/dev/null 2>&1 || true; printf "standby\n" > ~/.config/idol-hermes/role; date +%s > ~/.config/idol-hermes/primary-heartbeat.tmp; mv ~/.config/idol-hermes/primary-heartbeat.tmp ~/.config/idol-hermes/primary-heartbeat' \
            >/dev/null 2>&1 || true

          if ! healthy http://127.0.0.1:8787/health; then
            say 'webui unhealthy; restarting'
            pkill -f '/home/box/hermes-webui/server.py' 2>/dev/null || true
            nohup "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/hermes-webui/server.py" >>"$HOME/.hermes/logs/webui-ha.log" 2>&1 &
          fi
          if ! healthy http://127.0.0.1:18789/health; then
            say 'openclaw unhealthy; restarting'
            pkill -f '^openclaw-gateway' 2>/dev/null || true
            nohup "$HOME/.openclaw/bin/openclaw-gateway-loopback.sh" >>"$HOME/.openclaw/logs/gateway-ha.log" 2>&1 &
          fi
          if ! pgrep -f 'hermes.*gateway run' >/dev/null 2>&1; then
            say 'Hermes gateway absent; restarting'
            nohup "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/.hermes/hermes-agent/hermes" gateway run --replace --accept-hooks >>"$HOME/.hermes/logs/gateway-ha.log" 2>&1 &
          fi
          if ! pgrep -f 'cloudflared.*tunnel run' >/dev/null 2>&1; then
            say 'claw tunnel absent; restarting'
            nohup "$HOME/.openclaw/bin/openclaw-cloudflared.sh" >>"$HOME/.openclaw/logs/cloudflared-claw.log" 2>&1 &
          fi
          if ! pgrep -f '/workspace/hermes-jobs/watchdog.sh' >/dev/null 2>&1; then
            say 'agent watchdog absent; restarting'
            nohup /bin/bash /workspace/hermes-jobs/watchdog.sh >>/workspace/hermes-jobs/logs/watchdog-bootstrap.log 2>&1 &
          fi

          now="$(date +%s)"
          last=0; [[ -f "$STATE/last-sync" ]] && read -r last <"$STATE/last-sync" || true
          if (( now - last >= 120 )); then
            tmp="$STATE/hermes-primary-latest.zip.tmp"
            final="$STATE/hermes-primary-latest.zip"
            if "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/.hermes/hermes-agent/hermes" backup --quick -o "$tmp" --label idol-ha-primary >>"$LOG" 2>&1; then
              mv "$tmp" "$final"
              if timeout 45 tailscale ssh clp@r16 \
                'umask 077; mkdir -p ~/.config/idol-hermes/backups; cat > ~/.config/idol-hermes/backups/hermes-primary-latest.zip.tmp; mv ~/.config/idol-hermes/backups/hermes-primary-latest.zip.tmp ~/.config/idol-hermes/backups/hermes-primary-latest.zip' \
                <"$final" >/dev/null 2>&1; then
                printf '%s\n' "$now" >"$STATE/last-sync"
                say 'quick backup synchronized to r16'
              else
                say 'r16 backup synchronization failed'
              fi
            else
              rm -f "$tmp"
              say 'quick backup creation failed'
            fi
            tar -C "$HOME" -cf - .openclaw/openclaw.json .openclaw/.env 2>/dev/null \
              | timeout 45 tailscale ssh clp@r16 \
                  'umask 077; mkdir -p ~/.config/idol-hermes/backups; cat > ~/.config/idol-hermes/backups/openclaw-primary-latest.tar.tmp; mv ~/.config/idol-hermes/backups/openclaw-primary-latest.tar.tmp ~/.config/idol-hermes/backups/openclaw-primary-latest.tar' \
                >/dev/null 2>&1 || true
          fi
          SH
          chmod 700 "$HOME/.hermes/bin/idol-hermes-primary-tick.sh"

          cat >"$HOME/.hermes/bin/idol-hermes-ha-loop.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          export HOME="${HOME:-/home/box}"
          LOG="$HOME/.hermes/logs/idol-ha-loop.log"
          mkdir -p "$(dirname "$LOG")"
          echo $$ >"$HOME/.config/idol-hermes/primary-loop.pid"
          while true; do
            "$HOME/.hermes/bin/idol-hermes-primary-tick.sh" >>"$LOG" 2>&1 || true
            sleep 15
          done
          SH
          chmod 700 "$HOME/.hermes/bin/idol-hermes-ha-loop.sh"
          bash -n "$HOME/.hermes/bin/idol-hermes-primary-tick.sh"
          bash -n "$HOME/.hermes/bin/idol-hermes-ha-loop.sh"

          # Add redundant calls to already-established durable loops; do not replace their existing work.
          python3 - <<'PY'
          from pathlib import Path
          tick='  "$HOME/.hermes/bin/idol-hermes-primary-tick.sh" >/dev/null 2>&1 || true\n'
          p=Path.home()/'.hermes/bin/hermes-host-loopback.sh'
          if p.is_file():
              text=p.read_text()
              if 'idol-hermes-primary-tick.sh' not in text:
                  anchor='  /home/box/.hermes/bin/hermes-host.sh >>"$LOG" 2>&1 || echo "host_exit $? $(date -Is)" >>"$LOG"\n'
                  if anchor in text: text=text.replace(anchor,anchor+tick,1)
                  p.write_text(text); p.chmod(0o700)
          p=Path('/workspace/hermes-jobs/watchdog.sh')
          if p.is_file():
              text=p.read_text()
              if 'idol-hermes-primary-tick.sh' not in text:
                  anchor='  bash "$COORD" tick >>"$LOG" 2>&1 || echo "coord_exit $? $(date -Is)" >>"$LOG"\n'
                  if anchor in text: text=text.replace(anchor,anchor+tick,1)
                  p.write_text(text); p.chmod(0o755)
          PY
          bash -n "$HOME/.hermes/bin/hermes-host-loopback.sh"
          bash -n /workspace/hermes-jobs/watchdog.sh

          log 'install r16 MiniMax configuration and failover service'
          cat >/tmp/idol-r16-ha-apply.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NOW="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$HOME/.config/idol-hermes/deploy-backups/$NOW"
          mkdir -p "$BACKUP" "$HOME/.config/idol-hermes" "$HOME/.local/bin" "$HOME/.config/systemd/user"
          for f in "$HOME/.hermes/config.yaml" "$HOME/.openclaw/openclaw.json" "$HOME/hermes-jobs/r16/watchdog.sh"; do
            [[ -e "$f" ]] && cp -a "$f" "$BACKUP/$(basename "$f")"
          done
          key="$(python3 - <<'PY'
          from pathlib import Path
          value=''
          for raw in (Path.home()/'.hermes/.env').read_text(errors='replace').splitlines():
              line=raw.strip()
              if line.startswith('export '):line=line[7:].strip()
              if line.startswith('MINIMAX_API_KEY='):value=line.split('=',1)[1].strip().strip('"').strip("'")
          print(value,end='')
          PY
          )"
          [[ "$key" == sk-cp-* ]] || { echo 'r16 MiniMax token-plan key missing' >&2; exit 1; }

          MINIMAX_API_KEY="$key" python3 - <<'PY'
          from pathlib import Path
          import json,os
          import yaml
          hp=Path.home()/'.hermes/config.yaml'
          h=yaml.safe_load(hp.read_text()) or {}
          model=h.get('model') if isinstance(h.get('model'),dict) else {}
          model.update({'provider':'minimax','default':'MiniMax-M2.7','base_url':'https://api.minimax.io/anthropic','api_mode':'anthropic_messages'})
          h['model']=model
          delegation=h.get('delegation') if isinstance(h.get('delegation'),dict) else {}
          delegation.update({'provider':'minimax','model':'MiniMax-M2.7','max_concurrent_children':3,'child_timeout_seconds':3600,'surface_child_process_notifications':False})
          h['delegation']=delegation; h['fallback_providers']=[]
          cron=h.get('cron') if isinstance(h.get('cron'),dict) else {}
          cron.update({'provider':'minimax','model':'MiniMax-M2.7'}); h['cron']=cron
          tmp=hp.with_suffix('.yaml.tmp');tmp.write_text(yaml.safe_dump(h,sort_keys=False,allow_unicode=True));os.chmod(tmp,0o600);tmp.replace(hp)

          op=Path.home()/'.openclaw/openclaw.json'
          o=json.loads(op.read_text())
          providers=o.setdefault('models',{}).setdefault('providers',{})
          providers['minimax']={'baseUrl':'https://api.minimax.io/v1','apiKey':os.environ['MINIMAX_API_KEY'],'api':'openai-completions','models':[
            {'id':'MiniMax-M2.7','name':'MiniMax M2.7 (Plus)','reasoning':True,'input':['text'],'contextWindow':200000,'maxTokens':131072,'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'api':'openai-completions'},
            {'id':'MiniMax-M3','name':'MiniMax M3 (Plus)','reasoning':True,'input':['text'],'contextWindow':200000,'maxTokens':131072,'cost':{'input':0,'output':0,'cacheRead':0,'cacheWrite':0},'api':'openai-completions'}]}
          agents=o.setdefault('agents',{}).setdefault('defaults',{})
          agents.setdefault('model',{})['primary']='minimax/MiniMax-M2.7';agents['maxConcurrent']=3
          agents.setdefault('subagents',{})['maxConcurrent']=3
          agents.setdefault('models',{}).setdefault('minimax/MiniMax-M2.7',{})
          agents['models'].setdefault('minimax/MiniMax-M3',{})
          allow=agents.setdefault('modelPolicy',{}).setdefault('allow',[])
          for name in ('minimax/MiniMax-M2.7','minimax/MiniMax-M3'):
              if name not in allow:allow.append(name)
          tmp=op.with_suffix('.json.tmp');tmp.write_text(json.dumps(o,indent=2,sort_keys=True)+'\n');os.chmod(tmp,0o600);tmp.replace(op)
          PY

          chmod 600 "$HOME/.hermes/.env" "$HOME/.hermes/config.yaml" "$HOME/.openclaw/openclaw.json"
          find "$HOME/.cloudflared" -maxdepth 1 -type f \( -name '*.json' -o -name '*.token' -o -name '*.yml' -o -name '*.yaml' \) -exec chmod 600 {} + 2>/dev/null || true
          [[ -s "$HOME/.cloudflared/claw.token" ]] || { echo 'r16 claw token missing' >&2; exit 1; }

          cat >"$HOME/.config/systemd/user/idol-hermes-standby-tunnel.service" <<UNIT
          [Unit]
          Description=Standby connector for hermes.idol.id and claw.idol.id
          After=network-online.target hermes-webui.service openclaw-gateway.service

          [Service]
          Type=simple
          ExecStart=$(command -v cloudflared) --no-autoupdate tunnel run --token-file %h/.cloudflared/claw.token
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          cat >"$HOME/.local/bin/idol-hermes-failover" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          umask 077
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          STATE="$HOME/.config/idol-hermes"
          LOG="$STATE/failover.log"
          mkdir -p "$STATE"
          role=standby; [[ -f "$STATE/role" ]] && read -r role <"$STATE/role" || true
          failures=0
          promoted_at=0
          say(){ printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >>"$LOG"; }
          ok(){ curl -fsS --max-time 4 "$1" >/dev/null 2>&1; }
          heartbeat_fresh(){
            [[ -f "$STATE/primary-heartbeat" ]] || return 1
            local now mtime; now="$(date +%s)"; mtime="$(stat -c %Y "$STATE/primary-heartbeat" 2>/dev/null || echo 0)"
            (( now - mtime < 55 ))
          }
          ensure_local(){
            ok http://127.0.0.1:8787/health || systemctl --user restart hermes-webui.service >/dev/null 2>&1 || true
            ok http://127.0.0.1:18789/health || systemctl --user restart openclaw-gateway.service >/dev/null 2>&1 || true
            systemctl --user is-active --quiet hermes-serve.service || systemctl --user restart hermes-serve.service >/dev/null 2>&1 || true
          }
          promote(){
            ensure_local
            systemctl --user start idol-hermes-standby-tunnel.service >/dev/null 2>&1 || return 1
            role=active; promoted_at="$(date +%s)"; printf 'active\n' >"$STATE/role"; say 'promoted standby connector'
          }
          demote_probe(){
            systemctl --user stop idol-hermes-standby-tunnel.service >/dev/null 2>&1 || true
            sleep 12
            if ok https://hermes.idol.id/health; then
              role=standby; promoted_at=0; printf 'standby\n' >"$STATE/role"; say 'demoted; primary public path held'
              return 0
            fi
            systemctl --user start idol-hermes-standby-tunnel.service >/dev/null 2>&1 || true
            say 'demotion refused; public path still needed standby'
            return 1
          }
          say "failover monitor start pid=$$"
          while true; do
            ensure_local
            direct=0; public=0; fresh=0
            ok http://100.71.255.39:8787/health && direct=1
            ok https://hermes.idol.id/health && public=1
            heartbeat_fresh && fresh=1
            if (( direct || fresh )); then
              failures=0
              if [[ "$role" == active ]] && (( $(date +%s) - promoted_at >= 300 )); then demote_probe || true; fi
            elif (( public )); then
              failures=0
            else
              failures=$((failures+1))
              if (( failures >= 3 )) && [[ "$role" != active ]]; then promote || true; failures=0; fi
            fi
            sleep 10
          done
          SH
          chmod 700 "$HOME/.local/bin/idol-hermes-failover"
          bash -n "$HOME/.local/bin/idol-hermes-failover"

          cat >"$HOME/.config/systemd/user/idol-hermes-failover.service" <<'UNIT'
          [Unit]
          Description=Fenced active-passive failover for Hermes and OpenClaw public tunnel
          After=network-online.target hermes-webui.service openclaw-gateway.service

          [Service]
          Type=simple
          ExecStart=%h/.local/bin/idol-hermes-failover
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT

          # Telegram remains explicitly fenced to cursor; r16 never starts this service automatically.
          systemctl --user disable --now hermes-gateway.service >/dev/null 2>&1 || true
          systemctl --user reset-failed hermes-gateway.service >/dev/null 2>&1 || true
          rm -f "$HOME/.cloudflared/REFUSE-HERMES-HOSTNAME"
          systemctl --user daemon-reload
          systemctl --user stop idol-hermes-standby-tunnel.service >/dev/null 2>&1 || true
          printf 'standby\n' >"$HOME/.config/idol-hermes/role"
          systemctl --user enable --now idol-hermes-failover.service >/dev/null
          systemctl --user restart hermes-serve.service hermes-webui.service openclaw-gateway.service
          sleep 5
          systemctl --user is-active --quiet idol-hermes-failover.service
          systemctl --user is-active --quiet hermes-webui.service
          systemctl --user is-active --quiet openclaw-gateway.service
          curl -fsS --max-time 8 http://127.0.0.1:8787/health >/dev/null
          curl -fsS --max-time 8 http://127.0.0.1:18789/health >/dev/null
          echo R16_HA_READY
          REMOTE
          chmod 700 /tmp/idol-r16-ha-apply.sh
          bash -n /tmp/idol-r16-ha-apply.sh
          timeout 150 tailscale ssh clp@r16 'bash -s' </tmp/idol-r16-ha-apply.sh
          rm -f /tmp/idol-r16-ha-apply.sh

          log 'start primary HA supervisor and initial synchronization'
          pkill -f 'idol-hermes-ha-loop.sh' 2>/dev/null || true
          nohup "$HOME/.hermes/bin/idol-hermes-ha-loop.sh" >>"$HOME/.hermes/logs/idol-ha-loop-bootstrap.log" 2>&1 &
          sleep 2
          "$HOME/.hermes/bin/idol-hermes-primary-tick.sh"

          log 'configure durable MiniMax fleet steward'
          JOB_NAME=idol-minimax-fleet-steward
          LIST="$($HOME/.hermes/hermes-agent/venv/bin/python $HOME/.hermes/hermes-agent/hermes cron list --all 2>&1 || true)"
          JOB_ID="$(printf '%s\n' "$LIST" | awk -v n="$JOB_NAME" 'index($0,n){print $1;exit}')"
          PROMPT='Continuously advance Idol using current repository ground truth. Work only in /workspace/clpi/idol at its current exact HEAD. Read AGENTS.md and current authority before editing. Consult the Idol claim tool and active work; claim one non-overlapping semantic boundary before changing files. Preserve one semantic graph, current source law, worlds/projection algebra, and FTCFTW evidence. Never introduce legacy syntax, duplicate authority, catalog/router/registry machinery, name-based semantic reconstruction, or PAYG/credit-backed providers. Use MiniMax Plus only. Delegate at most three disjoint child tasks when genuinely parallel. Run focused tests, record exact evidence, commit coherent work on a non-main branch, and leave a concise handoff. When productive implementation is unsafe, perform a grounded audit or construct minimal failing tests/counterexamples instead of speculative code.'
          if [[ -n "$JOB_ID" ]]; then
            "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/.hermes/hermes-agent/hermes" cron edit "$JOB_ID" \
              --schedule 'every 5m' --prompt "$PROMPT" --name "$JOB_NAME" --deliver local \
              --workdir /workspace/clpi/idol --model MiniMax-M2.7 --provider minimax \
              --reasoning-effort high --continuity >/dev/null
            echo "MINIMAX_STEWARD_UPDATED id=$JOB_ID"
          else
            "$HOME/.hermes/hermes-agent/venv/bin/python" "$HOME/.hermes/hermes-agent/hermes" cron create 'every 5m' "$PROMPT" \
              --name "$JOB_NAME" --deliver local --workdir /workspace/clpi/idol \
              --model MiniMax-M2.7 --provider minimax --reasoning-effort high --continuity >/tmp/idol-cron-create.out
            sed -E 's/sk-[A-Za-z0-9._-]{8,}/[secret]/Ig' /tmp/idol-cron-create.out | head -n 20
            rm -f /tmp/idol-cron-create.out
          fi

          log 'validate primary configuration'
          "$HOME/.hermes/hermes-agent/venv/bin/python" - <<'PY'
          from pathlib import Path
          import json,yaml
          h=yaml.safe_load((Path.home()/'.hermes/config.yaml').read_text())
          assert h['model']['provider']=='minimax'
          assert h['model']['default']=='MiniMax-M2.7'
          assert h['delegation']['max_concurrent_children']==3
          assert h.get('fallback_providers')==[]
          o=json.loads((Path.home()/'.openclaw/openclaw.json').read_text())
          assert o['agents']['defaults']['model']['primary']=='minimax/MiniMax-M2.7'
          assert o['agents']['defaults']['maxConcurrent']==3
          assert o['agents']['defaults']['subagents']['maxConcurrent']==3
          assert 'minimax' in o['models']['providers']
          print('PRIMARY_CONFIG_OK')
          PY
          pgrep -f 'idol-hermes-ha-loop.sh' >/dev/null
          timeout 20 tailscale ssh clp@r16 'systemctl --user is-active idol-hermes-failover.service; systemctl --user is-active hermes-webui.service; systemctl --user is-active openclaw-gateway.service; test "$(cat ~/.config/idol-hermes/role)" = standby; test -s ~/.config/idol-hermes/backups/hermes-primary-latest.zip || true' | head -n 20

          # Restart model-consuming daemons and the tunnel after the controlling WebUI stream has safely completed.
          nohup bash -c 'sleep 120; source "$HOME/.hermes/.env" 2>/dev/null || true; pkill -f "^openclaw-gateway" 2>/dev/null || true; pkill -f "hermes.*gateway run" 2>/dev/null || true; pkill -f "cloudflared.*tunnel run" 2>/dev/null || true; sleep 3; "$HOME/.hermes/bin/idol-hermes-primary-tick.sh"' \
            >>"$HOME/.hermes/logs/idol-ha-delayed-restart.log" 2>&1 </dev/null &

          echo HERMES_HA_DEPLOYED
          DEPLOY
          chmod 700 /tmp/deploy.sh

          curl -fsS --max-time 20 -b /tmp/cookies -F "session_id=$SID" \
            -F 'file=@/tmp/deploy.sh;filename=idol-hermes-ha-deploy.sh' "$BASE/api/upload" >/tmp/upload.json
          SCRIPT_PATH="$(jq -er '.path' /tmp/upload.json)"
          PROMPT="Use the terminal tool exactly once. Run exactly: bash '$SCRIPT_PATH'. Do not run any other command, do not alter the script, and return all stdout verbatim."
          curl -fsS --max-time 30 -b /tmp/cookies -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sid "$SID" --arg m "$PROMPT" --arg ws "$WORKSPACE" '{session_id:$sid,message:$m,model:"MiniMax-M2.7",model_provider:"minimax",workspace:$ws}')" \
            "$BASE/api/chat/start" >/tmp/start.json
          STREAM_ID="$(jq -er '.stream_id' /tmp/start.json)"
          curl -fsS -N --max-time 900 -b /tmp/cookies \
            "$BASE/api/chat/stream?stream_id=$(printf '%s' "$STREAM_ID"|jq -sRr @uri)" >/tmp/stream.log &
          STREAM_PID=$!
          for _ in $(seq 1 900); do
            if ! kill -0 "$STREAM_PID" 2>/dev/null; then break; fi
            pending="$(curl -fsS --max-time 5 -b /tmp/cookies "$BASE/api/approval/pending?session_id=$(printf '%s' "$SID"|jq -sRr @uri)" 2>/dev/null || echo '{}')"
            command="$(printf '%s' "$pending"|jq -r '.pending.command // empty' 2>/dev/null || true)"
            if [[ -n "$command" ]]; then
              if [[ "$command" == "bash '$SCRIPT_PATH'" || "$command" == "bash $SCRIPT_PATH" ]]; then
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"once"}')" "$BASE/api/approval/respond" >/dev/null
                echo exact_deployment_approved_once=yes
              else
                curl -fsS --max-time 5 -b /tmp/cookies -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg sid "$SID" '{session_id:$sid,choice:"deny"}')" "$BASE/api/approval/respond" >/dev/null || true
                echo unexpected_command_denied=yes
                exit 1
              fi
            fi
            sleep 1
          done
          wait "$STREAM_PID" || true
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          parts=[]
          for line in Path('/tmp/stream.log').read_text(errors='replace').splitlines():
              if not line.startswith('data:'): continue
              try:e=json.loads(line[5:].strip())
              except Exception:continue
              if isinstance(e,dict):
                  for k in ('text','message','content'):
                      if isinstance(e.get(k),str):parts.append(e[k])
          out='\n'.join(parts)
          for pat in (r'sk-[A-Za-z0-9._-]{8,}',r'gh[pousr]_[A-Za-z0-9_]{8,}',r'cfat_[A-Za-z0-9_-]{8,}',r'\b\d{7,}:[A-Za-z0-9_-]{20,}\b'):
              out=re.sub(pat,'[secret]',out,flags=re.I)
          print(out[-80000:])
          for marker in ('MINIMAX_PLAN_OK','R16_HA_READY','PRIMARY_CONFIG_OK','HERMES_HA_DEPLOYED'):
              if marker not in out:raise SystemExit('missing '+marker)
          PY
